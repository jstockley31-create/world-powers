<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f151c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>World Powers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--ac2:#b8892f;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;
 --food:#8fbf5a;--oil:#d4a64a;--steel:#8ea4b8;--goods:#b48ce0;--r:8px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;width:100%}
#top>*,#app>*{min-width:0}
button,input,select{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:#3b4b5c;background:#1f2b39}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.pri:hover:not(:disabled){background:#e0b55a}
.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.ok:hover:not(:disabled){background:#23462e}
.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.dng:hover:not(:disabled){background:#46232a}
.btn.sm{padding:4px 9px;font-size:12px}.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}.btn.ghost:hover{color:var(--tx);background:var(--s3)}
input[type=text],input[type=number],input[type=password],input[type=email],input:not([type]),select{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac)}
a{color:var(--bl);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.ac{color:var(--ac)}.yl{color:var(--yl)}
.num{font-variant-numeric:tabular-nums}
/* top */
#top{display:flex;align-items:center;gap:18px;padding:0 16px;height:58px;background:var(--s1);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}

.brand .mark:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 6px,#ffffff14 6px 7px)}
.brand b{display:block;letter-spacing:.22em;font-size:13px;font-weight:700}.brand small{display:block;color:var(--mu);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#natbox{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid var(--bd);min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006}
#natbox b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}#natbox small{display:block;color:var(--ac);font-size:11px;font-weight:500}
#kpis{display:flex;gap:4px;margin-left:auto;overflow:hidden;min-width:0;flex:0 1 auto}.rkn{white-space:nowrap}
@media(min-width:821px) and (max-width:1500px){.kpi:nth-child(6){display:none}#natbox b{max-width:170px}.brand{min-width:150px}}
@media(min-width:821px) and (max-width:1340px){.kpi:nth-child(5){display:none}.kpi{min-width:84px;padding:4px 10px}}
@media(min-width:821px) and (max-width:1200px){.kpi:nth-child(3){display:none}#natbox b{max-width:140px}}

.kpi span{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}.kpi span .ic{width:12px;height:12px}
.kpi b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.topr{display:flex;gap:6px;align-items:center}
/* timers strip */
#timers{display:flex;gap:6px;padding:6px 16px;background:#0c1117;border-bottom:1px solid var(--bd);overflow-x:auto;min-height:38px;align-items:center}
@media(min-width:821px){#timers{flex-wrap:wrap;overflow-x:visible;row-gap:5px}}
@media(min-width:821px) and (max-width:1300px){.rkt th,.rkt td{padding:6px 6px;font-size:12.5px}}
.tm{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;border:1px solid var(--bd2);background:var(--s2);font-size:12px;cursor:pointer;white-space:nowrap}
.tm b{font:500 11.5px var(--mono)}.tm.rdy{border-color:#2c5a39;background:#13241a;color:#b8f0c4}.tm.rdy b{color:var(--gn)}.tm:not(.rdy) b{color:var(--mu)}
.tm .ic{width:13px;height:13px}
.tm.dec{border-color:#5d4a1f;background:#241c0d;color:#f0d9a4}

#app{display:grid;grid-template-columns:212px 1fr;min-height:0}

.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#b7c2cd;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:13.5px}
.nav:hover{background:var(--s2);color:var(--tx)}.nav.on{background:var(--s3);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav .ic{width:17px;height:17px}.nav .bdg{margin-left:auto;background:var(--ac);color:#17120a;border-radius:10px;font-size:10.5px;font-weight:700;padding:0 6px}
.nav .bdg.g{background:#2c5a39;color:#b8f0c4}
#main{overflow-y:auto;padding:20px 22px 30px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}.wrap.enter{animation:pgin .18s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.wrap.enter,.confetti,.promo,.shake{animation:none!important}}
h1.pg{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}.pgsub{color:var(--mu);margin:0 0 18px}

.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.panel>header h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#c5ced8;display:flex;align-items:center;gap:8px}
.panel>.bd{padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.st span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.st b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.st small{display:block;color:var(--mu);font-size:11.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .5s}
.res{display:inline-flex;align-items:center;gap:6px}.res .ic{width:15px;height:15px}
/* operations */
.op .blk{font-size:11.5px;color:#e3b341;margin-top:2px}.tm b:empty{display:none}
.opall{display:block;width:100%;padding:14px;font-size:16px;font-weight:700;margin:0 0 12px;position:sticky;top:8px;z-index:5;box-shadow:0 6px 18px #0008}
.tm .tp{font-style:normal;display:inline-flex;align-items:center;gap:6px}
/* run-all button: a solid strip behind it so cards scroll cleanly underneath */
.opallw{position:sticky;top:-20px;z-index:5;background:var(--bg);padding:12px 0 12px;margin:-12px 0 0;box-shadow:0 10px 12px -10px #000}@media(max-width:820px){.opallw{top:-14px}}.opallw .opall{position:static;margin:0;box-shadow:none}
#timers:empty{display:none}
@media(max-width:820px){
 /* all the stats at once: a 4-column grid instead of a strip cut off at the edge */

 .kpi{padding:2px 6px!important;min-width:0;border-left:1px solid var(--bd)}.kpi:nth-child(4n+1){border-left:0;padding-left:0!important}
 .kpi span{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.5px;letter-spacing:.02em}.kpi span .ic{flex:none;width:11px;height:11px}.kpi b{font-size:13.5px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}

 #timers{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent);padding-right:28px}
 .ftabs{flex-wrap:wrap;overflow:visible}
 /* easier to hit with a thumb */
 input[type=range]{height:30px}
 .qchips button{font-size:12.5px;padding:6px 10px;min-height:32px}
 .rkseg button{padding:8px 12px;min-height:34px}
 .panel>header a{display:inline-block;padding:6px 0}
 a.mtn,.panel .bd a[data-act]{padding:3px 0;display:inline-block}

 .tag{font-size:11px}
 input[type=file]{min-height:36px}
}
@media(max-width:380px){.kpi span{font-size:8.8px;letter-spacing:0;gap:2px}.kpi span .ic{width:10px;height:10px}.kpi{padding:2px 4px!important}}
.tm.runall{font-weight:700}.tm.runall.rdy{background:var(--ac);color:#17120a;border-color:var(--ac)}.tm.runall.rdy b{color:#17120a}
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(355px,1fr));gap:6px}
.op{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px 10px;display:grid;grid-template-columns:30px minmax(0,1fr) 86px;align-items:center;gap:9px;position:relative;overflow:hidden}
.op.rdy{border-color:#2c4a36}
.op .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--ac)}.op .ico .ic{width:17px;height:17px}
.op .tx{min-width:0;line-height:1.35}.op .nm{display:flex;align-items:baseline;gap:8px}.op .nm b{font-size:14px;font-weight:600;white-space:nowrap}.op .nm small{color:var(--mu);font-size:11px;white-space:nowrap}
.op .ef{font-size:12.5px;margin-top:1px}.op .gn{color:#8fdca6}.op .cs{color:var(--mu)}
.op .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bg);overflow:hidden}.op .prog i{display:block;height:100%;background:var(--bl)}
.op .btn{width:100%;padding-left:6px;padding-right:6px;font-variant-numeric:tabular-nums}.op .btn:disabled{background:var(--s3);border-color:var(--bd2);color:var(--mu);opacity:1}
@media(max-width:820px){.ops{grid-template-columns:1fr}.op{grid-template-columns:28px minmax(0,1fr) 90px}.op .ico{width:28px;height:28px}}
.opc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.opc .h{display:flex;align-items:center;gap:10px}.opc .h .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--ac);flex:none}.opc .h .ico .ic{width:18px;height:18px}
.opc .h b{font-size:14.5px;font-weight:600;display:block}.opc .h small{color:var(--mu);font-size:11.5px}.opc .d{color:#aab5c0;font-size:13px;flex:1}.opc .btn{width:100%}
.qchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;max-width:230px}.qchips button{background:var(--s3);border:1px solid var(--bd2);color:#c5ced8;border-radius:5px;font:inherit;font-size:11px;padding:1px 6px;cursor:pointer}.qchips button:hover{border-color:var(--ac);color:#fff}
.qprev{font-size:11px;margin-top:3px;line-height:1.5}.qprev b{color:#c5ced8;font-weight:600}.qprev b.rd{color:var(--rd)}
.nkalert{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:rgba(40,6,4,.92);border:1px solid #ff5a3c;color:#ffd7cf;padding:10px 16px;border-radius:12px;box-shadow:0 0 40px rgba(255,60,30,.45);font-size:14px;max-width:calc(100vw - 24px);animation:nkpulse 1s ease-in-out infinite alternate}

svg.flag{vertical-align:-2px;border-radius:2px;flex:none}h2 svg.flag{margin-right:8px;vertical-align:-4px}
.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}.law{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;background:var(--s2)}.law.on{border-color:#2c4a36;background:#0f1a13}.law b{font-size:13.5px}.law small{display:block;color:var(--mu);font-size:12px;line-height:1.4;margin-top:2px}.law .btn{flex:none}
.fdes{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.fprev{text-align:center;min-width:200px;flex:0 0 auto;margin:0 auto}.fed{flex:1;min-width:250px}

 setTimeout(()=>{if(o.isConnected){o.classList.add('out');setTimeout(()=>o.remove(),400)}},12000);setTimeout(()=>{const h=heldToasts.splice(0);nukeNext();h.slice(-1).forEach(t=>toast(t))},1500)}

// announced tests: an amber bar on everyone's screen counts down to the start of the 30-second countdown
const ntWarns=new Map();let ntWarnT=0;
function ntWarn(fx){if(!fx||!fx.go||fx.go<=Date.now()||ntSeen.has(fx.id))return;ntWarns.set(fx.id,fx);ntWarnDraw();if(!ntWarnT)ntWarnT=setInterval(ntWarnDraw,1000)}

 if(!list.length){if(el)el.remove();clearInterval(ntWarnT);ntWarnT=0;return}
 if(!el){el=document.createElement('div');el.id='ntWarn';el.className='ntwarn';el.addEventListener('click',ev=>{const k=ev.target.closest('[data-w]');if(!k)return;if(k.dataset.w==='x'){el.classList.add('hide')}else{const f=[...ntWarns.values()].sort((a,b)=>a.go-b.go)[0];if(f){if(page!=='world'){page='world';render()}setTimeout(()=>GL.flyToVis(f.at,1.85,.8),350)}}});document.body.appendChild(el)}
 const f=list[0],left=Math.max(0,f.go-Date.now()),m=Math.floor(left/60000),sec=Math.floor(left/1000)%60;
 el.innerHTML=`<span class="ic">☢</span><span><b>NUCLEAR TEST ${left>0?`in ${m}:${String(sec).padStart(2,'0')}`:'starting'}</b>${esc(f.byName)} · ${esc(ntWhere(f.ocean))}${list.length>1?` · +${list.length-1} more`:''}</span><button class="btn sm" data-w="see">Show me where</button><button class="btn sm ghost" data-w="x" aria-label="Hide">✕</button>`}

 const t0=Date.now();const go=()=>{const a=document.activeElement,typing=a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value&&a.value.length>0;if((nukeBusy||typing)&&Date.now()-t0<120000)return setTimeout(go,2000);location.reload()};setTimeout(go,1800)});
function nukeNext(){const fx=nukeQ.shift();if(!fx){nukeBusy=false;return}nukeBusy=true;
 if(fx.test){testSeq(fx);return}
 if(fx.from==null||!P[fx.from]||!P[fx.h]){nukeFlash(fx);setTimeout(nukeNext,3000);return}
 const dur=clamp(12000+d3.geoDistance(P[fx.from].c,P[fx.h].c)*4500,12000,22000);
 SND.siren(Math.ceil(dur/1000)+8);const al=document.createElement('div');al.className='nkalert';al.innerHTML=`<span class="nkdot"></span><b>☢ ${fx.replay?'REPLAY · ':''}MISSILE LAUNCH DETECTED</b><span>${esc(fx.byName)} ${fx.retaliation?'has fired back at':'has launched a nuclear missile at'} ${esc(fx.toName)}</span><span class="nkph" id="nkPh">LAUNCH</span><button class="btn sm" data-nk="skip">Skip</button>`;document.body.appendChild(al);
 const phT=setInterval(()=>{const ph=GL.nukePhase(),el=$('nkPh');if(!el||!al.isConnected){clearInterval(phT);return}if(ph)el.textContent=ph.ph+(ph.left>0?' · impact in '+Math.ceil(ph.left/1000)+'s':'')},250);
 let finished=false;const finish=()=>{if(finished)return;finished=true;clearInterval(phT);al.remove();if(fx.intercepted)interceptFlash(fx);else{nukeFlash(fx,true);if(!fx.replay&&!fx.demo&&P[fx.h])GL.burn(fx.h,Date.now(),20)}setTimeout(()=>{const h=heldToasts.splice(0);nukeNext();h.slice(-1).forEach(t=>toast(t))},2500)};

 setTimeout(()=>{if(GL.coarse)GL.flyTo(mid,clamp(1.9-dist*.55,.85,2.2));else GL.flyTo(a,clamp(1.9-dist*.4,1.1,2));setTimeout(()=>{if(finished)return;GL.missile(a,b,dur,finish,fx.h,fx.intercepted)},1100)},250)}

(()=>{const q=new URLSearchParams(location.search),rp=q.get('replay');if(rp==null)return;let tries=0;

  document.body.appendChild(o);o.addEventListener('click',ev=>{const x=ev.target.dataset.x;if(!x)return;o.remove();if(x==='go')nukeQueue({...fx,replay:true})})};
