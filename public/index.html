<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f151c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>World Powers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--ac2:#b8892f;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;
 --food:#8fbf5a;--oil:#d4a64a;--steel:#8ea4b8;--goods:#b48ce0;--r:8px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;width:100%}
#top>*,#app>*{min-width:0}
button,input,select{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:#3b4b5c;background:#1f2b39}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.pri:hover:not(:disabled){background:#e0b55a}
.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.ok:hover:not(:disabled){background:#23462e}
.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.dng:hover:not(:disabled){background:#46232a}
.btn.sm{padding:4px 9px;font-size:12px}.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}.btn.ghost:hover{color:var(--tx);background:var(--s3)}
input[type=text],input[type=number],input:not([type]),select{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac)}
a{color:var(--bl);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.ac{color:var(--ac)}.yl{color:var(--yl)}
.num{font-variant-numeric:tabular-nums}
/* top */
#top{display:flex;align-items:center;gap:18px;padding:0 16px;height:58px;background:var(--s1);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand .mark{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f6d93,#0f2539 70%);box-shadow:inset 0 0 0 1px #4c7ca5,0 0 12px #2b5a8040;position:relative;overflow:hidden}
.brand .mark:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 6px,#ffffff14 6px 7px)}
.brand b{display:block;letter-spacing:.22em;font-size:13px;font-weight:700}.brand small{display:block;color:var(--mu);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#natbox{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid var(--bd);min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006}
#natbox b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}#natbox small{display:block;color:var(--ac);font-size:11px;font-weight:500}
#kpis{display:flex;gap:4px;margin-left:auto;overflow:hidden}
.kpi{padding:4px 12px;border-left:1px solid var(--bd);min-width:92px}
.kpi span{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}.kpi span .ic{width:12px;height:12px}
.kpi b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.topr{display:flex;gap:6px;align-items:center}
/* timers strip */
#timers{display:flex;gap:6px;padding:6px 16px;background:#0c1117;border-bottom:1px solid var(--bd);overflow-x:auto;min-height:38px;align-items:center}
.tm{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;border:1px solid var(--bd2);background:var(--s2);font-size:12px;cursor:pointer;white-space:nowrap}
.tm b{font:500 11.5px var(--mono)}.tm.rdy{border-color:#2c5a39;background:#13241a;color:#b8f0c4}.tm.rdy b{color:var(--gn)}.tm:not(.rdy) b{color:var(--mu)}
.tm .ic{width:13px;height:13px}
.tm.dec{border-color:#5d4a1f;background:#241c0d;color:#f0d9a4}
/* layout */
#app{display:grid;grid-template-columns:212px 1fr;min-height:0}
#side{background:var(--s1);border-right:1px solid var(--bd);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#side .sec{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;margin:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#b7c2cd;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:13.5px}
.nav:hover{background:var(--s2);color:var(--tx)}.nav.on{background:var(--s3);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav .ic{width:17px;height:17px}.nav .bdg{margin-left:auto;background:var(--ac);color:#17120a;border-radius:10px;font-size:10.5px;font-weight:700;padding:0 6px}
.nav .bdg.g{background:#2c5a39;color:#b8f0c4}
#main{overflow-y:auto;padding:20px 22px 30px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}
h1.pg{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}.pgsub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.panel>header h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#c5ced8;display:flex;align-items:center;gap:8px}
.panel>.bd{padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.st span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.st b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.st small{display:block;color:var(--mu);font-size:11.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .5s}
.res{display:inline-flex;align-items:center;gap:6px}.res .ic{width:15px;height:15px}
/* operations */
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.op{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.op.rdy{border-color:#2c4a36}
.op .h{display:flex;align-items:center;gap:10px}.op .h .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--ac)}
.op .h .ico .ic{width:18px;height:18px}.op .h b{font-size:14.5px;font-weight:600;display:block}.op .h small{color:var(--mu);font-size:11.5px}
.op .d{color:#aab5c0;font-size:13px;flex:1}
.op .cost{font-size:12px;color:var(--mu)}
.op .prog{height:3px;background:var(--bg);border-radius:2px;overflow:hidden}.op .prog i{display:block;height:100%;background:var(--bl)}
.op .btn{width:100%}.op .btn:disabled{background:var(--s3);border-color:var(--bd2);color:var(--mu);opacity:1}
/* decisions */
.dec{border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:var(--s2)}
.dec b{font-size:14.5px}.dec p{margin:3px 0 10px;color:#aab5c0}
.dec .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;margin-top:6px;background:var(--s1);border:1px solid var(--bd2);border-radius:6px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.dec .opt:hover{border-color:var(--ac)}.dec .opt span:first-child{font-weight:500}
.eff{display:inline-flex;gap:4px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.chk:last-child{border:0}
.chk .cb{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd2);display:grid;place-items:center;flex:none}.chk.done .cb{background:var(--gn);border-color:var(--gn);color:#06210f}.chk.done .cb .ic{width:12px;height:12px;stroke-width:3}
.chk.done span{color:var(--mu);text-decoration:line-through}
.log{max-height:340px;overflow-y:auto}.log div{padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:10px}.log div time{color:var(--mu2);font:11.5px var(--mono);flex:none;width:62px;padding-top:2px}
/* globe */
.gwrap{position:relative;background:radial-gradient(ellipse at 50% 45%,#0e1d2c 0%,#090d12 70%);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);touch-action:none}
.gwrap canvas{display:block;width:100%;height:100%;cursor:grab}.gwrap canvas.drag{cursor:grabbing}
.gctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.gctl button{width:34px;height:34px;padding:0;border-radius:6px;background:#0f151ccc;border:1px solid var(--bd2);display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.gctl button:hover{border-color:var(--ac)}
.glegend{position:absolute;left:12px;bottom:12px;background:#0f151ccc;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:11.5px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap;backdrop-filter:blur(4px)}
.glegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
#tip{position:fixed;pointer-events:none;background:#0b1118f2;border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;font-size:12.5px;z-index:40;display:none;max-width:260px;box-shadow:0 8px 24px #0008}
#tip b{display:block}
.pinfo h3{margin:0 0 2px;font-size:17px;font-weight:600}.pinfo .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13px}.pinfo .kv span{color:var(--mu)}
/* dock */
#dock{background:var(--s1);border-top:1px solid var(--bd);display:flex;flex-direction:column}
.dockh{display:flex;align-items:center;gap:12px;padding:7px 16px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.dockh .live{width:7px;height:7px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn)}
.dockh .sp{margin-left:auto}
.dockb{display:grid;grid-template-columns:1fr;height:150px}#onl{display:none!important}
#onlstrip{background:#070a0e;border-bottom:1px solid var(--bd);padding:7px 16px 8px;text-align:center;max-height:96px;overflow-y:auto}
#onlstrip .oh{color:#fff;font-weight:600;font-size:13.5px;margin-bottom:3px;letter-spacing:.01em}
#onlstrip .names{line-height:1.65}
#onlstrip a{display:inline-block;margin:0 8px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
#onlstrip a:hover{filter:brightness(1.3)}
#onlstrip a.on{font-weight:700}#onlstrip a.idle{font-style:italic;opacity:.55}#onlstrip a.ally{text-decoration:underline;text-underline-offset:3px}#onlstrip a.me{text-decoration:underline dotted;text-underline-offset:3px}
#onlstrip .legend{color:var(--mu2);font-size:11px;margin-top:2px}
#dock.min .dockb{display:none}
.chatcol{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--bd)}
#chat{flex:1;min-height:0;overflow-y:auto;padding:8px 16px;font-size:13px}
#chat .m{padding:2px 0;line-height:1.5;word-wrap:break-word}#chat .m time{color:var(--mu2);font:11px var(--mono);margin-right:8px}
#chat .m .who{font-weight:600;cursor:pointer;margin-right:6px}
#chat .m.n{color:#d8c79d}#chat .m.n .lbl{color:var(--ac);font-weight:600;margin-right:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#chat .m.sys{color:#f0d9a4;background:#241c0d;border-left:2px solid var(--ac);padding:4px 8px;margin:3px 0;border-radius:3px}
#chatin{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--bd)}#chatin input{flex:1}
#onl{overflow-y:auto;padding:8px 10px}
#onl .o{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px}#onl .o:hover{background:var(--s2)}
#onl .o small{margin-left:auto;color:var(--mu2);font-size:11px}#onl .o.idle{opacity:.5}
#onl .lbl2{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin:8px 8px 4px}
/* misc */
#mod{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:16px;backdrop-filter:blur(2px)}
#mod .panel{width:100%;max-width:500px;margin:0;box-shadow:0 20px 60px #000c}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202b;border:1px solid var(--bd2);border-left:3px solid var(--ac);padding:10px 16px;border-radius:6px;z-index:50;display:none;max-width:90vw;box-shadow:0 10px 30px #0009;font-size:13.5px}
.motd{background:#241c0d;border:1px solid #5d4a1f;color:#f0d9a4;border-radius:6px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatches button{width:30px;height:30px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}.swatches button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}.swatches button.used{opacity:.25}
.govs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gov{border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--s2);text-align:left}.gov.on{border-color:var(--ac);background:#1f1a10}.gov b{display:block;font-size:13.5px}.gov small{color:var(--mu);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field>label{font-size:12px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
@media(max-width:1100px){.cols{grid-template-columns:1fr}.kpi:nth-child(n+5){display:none}}
@media(max-width:820px){
 body{grid-template-rows:auto auto 1fr}
 #top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px 12px}
 .brand{min-width:0}.brand>div{display:none}
 #natbox{border-left:0;padding-left:0;flex:1 1 0;overflow:hidden}#natbox>div{min-width:0;overflow:hidden}#natbox b{max-width:100%;display:block}
 .topr .btn span,.topr .btn{font-size:12px}#logoutBtn{padding:4px 6px}
 #kpis{display:flex;order:5;width:100%;margin:0;overflow-x:auto;gap:0;scrollbar-width:none}#kpis::-webkit-scrollbar{display:none}
 .kpi{min-width:auto;padding:2px 12px 2px 10px;flex:none}.kpi:first-child{border-left:0;padding-left:0}.kpi:nth-child(n+5){display:block}.kpi b{font-size:14px}
 #timers{padding:6px 12px;scrollbar-width:none}#timers::-webkit-scrollbar{display:none}
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr}
 #side{position:fixed;left:0;right:0;bottom:0;z-index:16;flex-direction:row;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;background:#0d1319}
 #side::-webkit-scrollbar{display:none}#side .sec{display:none}
 .nav{flex-direction:column;gap:3px;width:auto;min-width:68px;padding:6px 4px;font-size:10.5px;position:relative;justify-content:center;flex:none}
 .nav.on{box-shadow:inset 0 2px 0 var(--ac);background:transparent;color:var(--ac)}.nav .ic{width:21px;height:21px}
 .nav .bdg{position:absolute;top:2px;right:10px;margin:0;font-size:9.5px;padding:0 5px}
 .nav.mob{display:flex!important}
 #main{padding:14px 12px calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
 h1.pg{font-size:19px}.pgsub{font-size:13px}
 .cols,.cols[style]{grid-template-columns:minmax(0,1fr)!important}.cols3{grid-template-columns:1fr}
 .panel>.bd{padding:12px;overflow-x:auto}.panel>header{padding:10px 12px}
 table{min-width:520px}.panel .stats table,.op table{min-width:0}
 th,td{padding:8px 8px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .govs{grid-template-columns:1fr}
 .gwrap{height:62vh!important}.glegend{display:none}
 #dock{display:none}
 body.chatopen #dock{display:flex;position:fixed;left:0;right:0;top:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;border-top:0}
 body.chatopen .dockb{grid-template-columns:1fr;flex:1;height:auto;min-height:0}body.chatopen #onlstrip{max-height:28vh}
 body.chatopen .chatcol{min-height:0;border-right:0}#dockBtn{display:none}
 #chatin input{font-size:16px}
 #toast{bottom:calc(80px + env(safe-area-inset-bottom))}
 input,select{font-size:16px}
 .dec .opt{flex-direction:column;align-items:flex-start}
}
.nav.mob{display:none}
</style>

<script>
(function(){
'use strict';
const st={me:null,users:{},cols:{nations:{},chat:{},online:{}},ready:false,subs:[]};
let resolveAuth;const authed=new Promise(r=>resolveAuth=r);
function snap(col){const m=st.cols[col]||{};const docs=Object.keys(m).map(id=>({id,exists:true,data:()=>m[id],metadata:{fromCache:false,hasPendingWrites:false}}));return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
const fireT={};function fire(col){clearTimeout(fireT[col]);fireT[col]=setTimeout(()=>{const s=snap(col);for(const x of st.subs.slice())if(x.col===col){try{x.cb(s)}catch(e){console.error(e)}}},50)}
function mkErr(status,msg){const code=status===401?'revoked':status===429?'unavailable':(status>=400&&status<500)?'invalid_argument':'unavailable';return Object.assign(new Error(msg),{code,status})}
async function api(method,url,body){let r;try{r=await fetch(url,{method,credentials:'same-origin',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw mkErr(0,'Network error — check your connection.')}let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw mkErr(r.status,j.error||('Error '+r.status));return j}
const db={
 collection(col){return{onSnapshot(cb){const s={col,cb};st.subs.push(s);if(st.ready)setTimeout(()=>cb(snap(col)),0);return()=>{st.subs=st.subs.filter(x=>x!==s)}}}},
 doc(p){const[col,id]=p.split('/');return{
  async set(d){if(!st.cols[col])st.cols[col]={};const prev=st.cols[col][id];st.cols[col][id]=JSON.parse(JSON.stringify(d));fire(col);try{await api('PUT','/api/doc/'+col+'/'+encodeURIComponent(id),d)}catch(e){if(prev===undefined)delete st.cols[col][id];else st.cols[col][id]=prev;fire(col);throw e}},
  async delete(){await api('DELETE','/api/doc/'+col+'/'+encodeURIComponent(id));if(st.cols[col])delete st.cols[col][id];fire(col)}}}};
const user={id:async()=>st.me.id,isOwner:async()=>!!st.me.admin,canEdit:async()=>!!st.me.admin,can:async()=>true,me:async()=>({id:st.me.id,name:st.me.name}),profiles:async ids=>{const o={};for(const i of ids)o[i]={name:st.users[i]||''};return o}};
window.claude={use:async n=>{await authed;return n==='db'?db:n==='user'?user:null}};
window.WP={me:()=>st.me,api};
const setCfg=c=>{if(c)window.dispatchEvent(new CustomEvent('wp-config',{detail:c}))};
function connect(){const es=new EventSource('/api/stream');
 es.addEventListener('init',e=>{const d=JSON.parse(e.data);st.cols={nations:{},chat:{},online:{},...d.cols};st.users=d.users||{};st.ready=true;setCfg(d.config);for(const c in st.cols)fire(c)});
 es.addEventListener('doc',e=>{const d=JSON.parse(e.data);if(!st.cols[d.col])st.cols[d.col]={};if(d.data==null)delete st.cols[d.col][d.id];else st.cols[d.col][d.id]=d.data;fire(d.col)});
 es.addEventListener('user',e=>{const d=JSON.parse(e.data);if(d.name==null)delete st.users[d.id];else st.users[d.id]=d.name});
 es.addEventListener('config',e=>setCfg(JSON.parse(e.data)));
 es.addEventListener('announce',e=>window.dispatchEvent(new CustomEvent('wp-announce',{detail:JSON.parse(e.data)})));
 es.onerror=async()=>{try{await api('GET','/api/me')}catch(x){if(x.status===401||x.status===403){es.close();location.reload()}}}}
// ---------- sign-in screen ----------
const CSS=`#auth{position:fixed;inset:0;z-index:60;background:#05080c;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);font-family:Inter,system-ui,sans-serif;color:#e6edf3}
#auth .left{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0d1d2d 0%,#05080c 70%)}
#authGlobe{position:absolute;inset:-10%}
#auth .tagline{position:absolute;left:48px;bottom:44px;max-width:460px}
#auth .tagline h1{font-size:40px;line-height:1.1;margin:0 0 12px;font-weight:700;letter-spacing:-.02em}
#auth .tagline p{color:#8b98a5;font-size:15px;margin:0;line-height:1.55}
#auth .right{display:flex;align-items:center;justify-content:center;padding:32px;background:#0b1016;border-left:1px solid #1f2a36}
#auth .card{width:100%;max-width:360px}
#auth .logo{display:flex;align-items:center;gap:10px;margin-bottom:34px}
#auth .logo .mk{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f6d93,#0f2539 70%);box-shadow:inset 0 0 0 1px #4c7ca5}
#auth .logo b{letter-spacing:.24em;font-size:13.5px}
#auth h2{font-size:22px;margin:0 0 6px;font-weight:600}#auth .sub{color:#8b98a5;margin:0 0 24px;font-size:14px}
#auth form{display:flex;flex-direction:column;gap:14px}
#auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#8b98a5;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
#auth input{background:#05080c;border:1px solid #2a3746;border-radius:6px;padding:11px 12px;color:#fff;font:15px Inter,system-ui,sans-serif;outline:none;text-transform:none;letter-spacing:0}
#auth input:focus{border-color:#d4a64a}
#auth .go{background:#d4a64a;border:0;color:#17120a;border-radius:6px;padding:12px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;margin-top:4px}#auth .go:hover{background:#e0b55a}#auth .go:disabled{opacity:.6}
#auth .err{color:#ff8a80;min-height:18px;font-size:13px}
#auth .sw{color:#8b98a5;font-size:13.5px;margin-top:18px;text-align:center}#auth .sw a{color:#d4a64a;cursor:pointer;font-weight:500}
#auth .fine{color:#5d6b79;font-size:12px;margin-top:22px;line-height:1.5}
@media(max-width:820px){#auth{grid-template-columns:1fr}#auth .left{display:none}}`;
let mode='login';
function showLogin(){let el=document.getElementById('auth');const first=!el;
 if(first){const s=document.createElement('style');s.textContent=CSS;document.head.appendChild(s);el=document.createElement('div');el.id='auth';el.innerHTML=`<div class="left"><div id="authGlobe"></div><div class="tagline"><h1>Build a nation.<br>Shape the world.</h1><p>A persistent strategy game played in real time with everyone else. Govern, trade, form alliances — and decide when it is worth going to war.</p></div></div><div class="right"><div class="card" id="authCard"></div></div>`;document.body.appendChild(el)}
 const signup=mode==='signup';
 document.getElementById('authCard').innerHTML=`<div class="logo"><span class="mk"></span><b>WORLD POWERS</b></div><h2>${signup?'Create your account':'Welcome back'}</h2><p class="sub">${signup?'One account per email address.':'Sign in to return to your nation.'}</p>
 <form id="authf">${signup?'<label>Leader name<input name="name" maxlength="20" autocomplete="nickname" placeholder="Shown to other players" required></label>':''}<label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="${signup?8:1}" autocomplete="${signup?'new-password':'current-password'}" ${signup?'placeholder="At least 8 characters"':''} required></label><div class="err" id="autherr"></div><button class="go">${signup?'Create account':'Sign in'}</button></form>
 <div class="sw">${signup?'Already have an account? <a data-m="login">Sign in</a>':'New here? <a data-m="signup">Create an account</a>'}</div>${signup?'':'<div class="fine">Forgot your password? Contact the game administrator to have it reset.</div>'}`;
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;showLogin()});
 document.getElementById('authf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector('.go');btn.disabled=true;document.getElementById('autherr').textContent='';
  try{st.me=await api('POST','/api/'+mode,Object.fromEntries(f));go()}catch(x){document.getElementById('autherr').textContent=x.message;btn.disabled=false}};
 el.querySelector('input').focus();
 if(first)window.dispatchEvent(new Event('wp-login'))}
function go(){const el=document.getElementById('auth');if(el)el.remove();const lo=document.getElementById('logoutBtn');if(lo){lo.style.display='';lo.title='Signed in as '+st.me.name+' ('+st.me.email+')';lo.onclick=async()=>{try{await api('POST','/api/logout')}catch(e){}location.reload()}}connect();resolveAuth()}
async function start(){try{st.me=await api('GET','/api/me');go()}catch(e){showLogin()}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script>

function unread(){let c=0;for(const[u,ch]of Object.entries(CH))if(u!==uid)for(const m of ch.m||[])if(m.t>chatSeen)c++;return c}
function markChatSeen(){chatSeen=Date.now();try{localStorage.setItem('wp_chatseen',chatSeen)}catch(e){}}
function renderSide(){const b=k=>{if(!me)return'';if(k==='chat'){const u=unread();return u&&page!=='chat'?`<span class="bdg">${u>9?'9+':u}</span>`:''}if(k==='overview'&&me.cards.length)return`<span class="bdg">${me.cards.length}</span>`;if(k==='ops'){const r=ACTS.filter(a=>ready(a.k)).length;if(r)return`<span class="bdg g">${r}</span>`}if(k==='diplo'){const p=others().filter(u=>offered(u,uid,'ally')||offered(u,uid,'trade')||(atWar(uid,u)&&(R(u,uid).peace||0)>warSince(uid,u))).length;if(p)return`<span class="bdg">${p}</span>`}return''};
 $('side').innerHTML=`<div class="sec">Command</div>`+NAV.slice(0,4).map(n=>navB(n,b)).join('')+`<div class="sec">Affairs of state</div>`+NAV.slice(4,8).map(n=>navB(n,b)).join('')+`<div class="sec">World</div>`+NAV.slice(8).map(n=>navB(n,b)).join('');document.body.classList.toggle('chatopen',page==='chat')}
const navB=([k,i,t],b)=>`<button class="nav ${page===k?'on':''} ${k==='chat'?'mob':''}" data-act="page" data-a="${k}">${I(i)}<span>${t}</span>${b(k)}</button>`;
const panel=(title,body,right='',icon='')=>`<section class="panel"><header><h2>${icon?I(icon):''}${title}</h2><div>${right}</div></header><div class="bd">${body}</div></section>`;
const stat=(l,v,cls='',sub='')=>`<div class="st"><span>${l}</span><b class="${cls}">${v}</b>${sub?`<small>${sub}</small>`:''}</div>`;
const EN={tr:'Treasury',ap:'Approval',st:'Stability',pop:'Population',troops:'Troops',tech:'Tech',food:'Food',oil:'Oil',steel:'Steel',goods:'Goods',infra:'Infrastructure',fort:'Fortifications',train:'Training',aggr:'Aggression'};
function effTxt(e){if(e.risk!=null)return`<span class="tag y">${Math.round(e.risk*100)}% chance of success</span>`;const s=Object.entries(e).map(([k,v])=>{const good=k==='aggr'?v<0:v>0;const t=k==='tr'?`${v>0?'+':'−'}${moneyS(Math.abs(v)*taxIncome())}`:`${EN[k]} ${v>0?'+':'−'}${Math.abs(v)}${k==='pop'?'%':''}`;return`<span class="tag ${good?'g':'r'}">${t}</span>`}).join('');return s||'<span class="tag">No effect</span>'}
function renderPage(){if(!loaded)return'<p class="mu">Connecting to the world…</p>';if(!db)return panel('Sign in required','<p>Sign in to play.</p>');
 if(!me)return pFound();if(page==='chat'){markChatSeen();return''}return({overview:pOverview,ops:pOps,world:pWorld,military:pMilitary,economy:pEconomy,gov:pGov,diplo:pDiplo,rank:pRank,help:pHelp}[page]||pOverview)()}
const foundHexTxt=()=>found_.hex!=null?`<div class="st"><span>Starting province</span><b>${esc(pname(found_.hex))}</b><small>${TYPE[P[found_.hex].t].n}</small></div>`:`<div class="st" style="border-style:dashed"><span>Starting province</span><b class="ac" style="font-size:14px">Select a province on the globe</b><small>Must be at least two provinces away from any nation</small></div>`;
function pFound(){const s=found_,used=new Set(Object.values(A).map(n=>n.color));if(!s.color)s.color=COLORS.find(c=>!used.has(c))||COLORS[0];
 return`<h1 class="pg">Found your nation</h1><p class="pgsub">Every nation begins with a single province. Grow through good governance, trade and — when necessary — force.</p><div class="cols"><div>${globeSlot('found','min(68vh,640px)')}</div><div>${panel('Charter',`
 <div class="field"><label>Nation name</label><input id="fn_name" maxlength="28" value="${esc(s.name)}" placeholder="e.g. Republic of Avalon"></div>
 <div class="field"><label>National color</label><div class="swatches">${COLORS.map(c=>`<button class="${c===s.color?'on':''} ${used.has(c)&&c!==s.color?'used':''}" style="background:${c}" data-act="fcol" data-a="${c}" title="${used.has(c)?'In use by another nation':''}"></button>`).join('')}</div></div>
 <div class="field"><label>Form of government</label><div class="govs">${Object.entries(GOV).map(([k,g])=>`<button class="gov ${k===s.gov?'on':''}" data-act="fgov" data-a="${k}"><b>${g.n}</b><small>${g.d}</small></button>`).join('')}</div></div>
 <div class="field" id="fhex">${foundHexTxt()}</div>
 <button class="btn pri" data-act="found" style="width:100%;padding:11px;font-size:14.5px">Establish nation</button>`)}</div></div>`}
function checklist(){const c=me.cnt||{};const items=[['Collect taxes',c.tax],['Boost production',c.prod],['Expand your borders',myHexes().length>1],['Make a decision',c.decide],['Fund research',me.tech>0],['Say hello in World Chat',myChat.length>0]];const done=items.filter(i=>i[1]).length;if(done===items.length||me.hideGuide)return'';
 return panel('Getting started',`<div class="bar" style="margin-bottom:10px"><i style="width:${done/items.length*100}%"></i></div>${items.map(([t,d])=>`<div class="chk ${d?'done':''}"><span class="cb">${d?I('check'):''}</span><span>${t}</span></div>`).join('')}<p class="mu" style="margin:10px 0 0;font-size:12.5px">Operations are your main tools. Each one has a cooldown timer shown at the top of the screen — return when it reads READY.</p>`,`<span class="mu">${done}/${items.length}</span> <button class="btn sm ghost" data-act="hideguide">Dismiss</button>`,'check')}
function pOverview(){const n=me,p=production(),c=consumption(n),w=wars(uid);
 const cards=n.cards.length?n.cards.map(cd=>{const C_=CARDS[cd.i];if(!C_)return'';return`<div class="dec"><b>${esc(C_.t)}</b><p>${esc(C_.d)}</p>${C_.o.map((o,i)=>`<button class="opt" data-act="decide" data-a="${esc(cd.id)}" data-b="${i}"><span>${esc(o[0])}</span><span class="eff">${effTxt(o[1])}</span></button>`).join('')}</div>`}).join(''):'<p class="mu" style="margin:0">No matters require your attention. New issues arrive roughly every 40 minutes.</p>';
 return`<h1 class="pg">${esc(n.name)}</h1><p class="pgsub">${esc(rankName(n))} · ${GOV[n.gov].n} · Founded ${ago(n.created)}${w.length?` · <span class="rd">At war with ${w.map(nmHtml).join(', ')}</span>`:''}</p>
 <div class="cols"><div>${checklist()}${panel(`Decisions${n.cards.length?` <span class="tag y">${n.cards.length} pending</span>`:''}`,cards,'','alert')}
 ${panel('Resources',`<table><thead><tr><th>Resource</th><th class="r">Stockpile</th><th class="r">Output</th><th class="r">Consumption</th><th class="r">Net / 10 min</th></tr></thead><tbody>${Object.keys(RES).map(r=>{const net=p[r]-c[r];return`<tr><td>${resI(r)} ${RES[r].n}</td><td class="r num"><b>${num(n.res[r])}</b></td><td class="r num gn">+${p[r]}</td><td class="r num rd">−${c[r]}</td><td class="r num ${net<0?'rd':'gn'}">${net>=0?'+':''}${net}</td></tr>`}).join('')}</tbody></table><p class="mu" style="margin:10px 0 0;font-size:12.5px">Army upkeep: ${money(n.troops*8)} per 10 minutes. Shortages are serious: no food shrinks the population, no oil weakens the army by 40%, no goods erodes approval.</p>`,`<a data-act="page" data-a="economy">Trade on the market →</a>`,'chart')}</div>
 <div>${panel('Territory',globeSlot('mini','340px'),`<a data-act="page" data-a="world">Open map →</a>`,'globe')}
 ${panel('Indicators',`<div class="stats">${stat('Rank',esc(rankName(n)),'ac',rankOf(n.xp)<RANKS.length-1?`${num(n.xp)} / ${num(RANKS[rankOf(n.xp)+1][0])} XP`:num(n.xp)+' XP')}${stat('Army power',num(power(uid)))}${stat('Tech level',n.tech)}${stat('Aggression',Math.round(n.aggr||0),sanctioned(n)?'rd':'',sanctioned(n)?'Under sanctions':'Sanctions at 50')}</div>`)}
 ${panel('Recent events',`<div class="log">${(n.log||[]).slice(0,14).map(l=>`<div><time>${ago(l.t)}</time><span>${esc(l.x)}</span></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div>`)}</div></div>`}
function pOps(){return`<h1 class="pg">Operations</h1><p class="pgsub">Your primary instruments of government. Each operation earns experience toward promotion; higher ranks hold more territory, produce more, and defend better.</p>
 <div class="ops">${ACTS.map(a=>`<div class="op" data-cd="${a.k}"><div class="h"><div class="ico">${I(a.i)}</div><div><b>${a.n}</b><small>${a.cd>=60?a.cd/60+' h':a.cd+' min'} cooldown · +${a.xp} XP</small></div></div><div class="d">${esc(ACTD[a.k](me))}</div><div class="prog"><i></i></div><button class="btn ok" data-act="do" data-a="${a.k}">Execute</button></div>`).join('')}</div>
 <div style="height:16px"></div>${panel('Ranks',`<table><thead><tr><th>Rank</th><th class="r">Experience</th><th class="r">Province limit</th><th class="r">Output bonus</th><th>Notes</th></tr></thead><tbody>${RANKS.map((r,j)=>`<tr style="${j===rankOf(me.xp)?'background:#1f1a10':''}"><td>${j===rankOf(me.xp)?'<b class="ac">'+r[1]+'</b>':r[1]}</td><td class="r num">${num(r[0])}</td><td class="r num">${3+j*4}</td><td class="r num">+${j*10}%</td><td class="mu">${j===2?'May wage war':''}${j===rankOf(me.xp)?' Current rank':''}</td></tr>`).join('')}</tbody></table>`,'','trophy')}`}
function pWorld(){return`<h1 class="pg">World</h1><p class="pgsub">Drag to rotate, scroll or pinch to zoom, tap a province for details. Dashed outlines mark land you can settle.</p><div class="cols" style="grid-template-columns:minmax(0,1fr) 340px"><div>${globeSlot('world','min(72vh,720px)')}</div><div>${panel('Province',`<div id="pinfo" class="pinfo">${provInfo()}</div>`,'','pin')}${panel('Nations',Object.keys(A).sort((a,b)=>score(b)-score(a)).map(u=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer" data-act="fly" data-a="${esc(u)}"><span class="dot" style="background:${esc(A[u].color)}"></span><span>${esc(A[u].name)}${aiTag(u)}</span><span class="mu" style="margin-left:auto;font-size:12px">${hexesOf(u).length} prov.</span></div>`).join('')||'<p class="mu">None yet.</p>')}</div></div>`}
function provInfo(){const h=selHex;if(h==null)return'<p class="mu" style="margin:0">Select a province on the globe.</p>';const p=P[h],t=TYPE[p.t],u=owner(h);
 let s=`<h3>${esc(p.n)}</h3><div class="mu">${esc(CN[p.ci])}</div><div class="kv"><span>Terrain</span><b>${t.n}</b><span>Output</span><b>${Object.entries(t.p).map(([r,v])=>`${resI(r)} ${v}`).join(' &nbsp; ')}</b><span>Area</span><b>${num(p.a)} km²</b><span>Control</span><b>${u?nmHtml(u)+(W.OWN[h].cap?' <span class="tag">Capital</span>':''):'<span class="mu">Unclaimed</span>'}</b>${u&&u!==uid?`<span>Defense</span><b>${W.OWN[h].cap?'—':num(defense(h))}</b>`:''}${u?`<span>Held for</span><b>${hexAge(h).toFixed(1)} days</b>`:''}</div>`;
 if(!u){if(nbrs(h).some(k=>owner(k)===uid))s+=`<button class="btn ok" style="width:100%" data-act="do" data-a="expand" data-b="${h}" ${ready('expand')?'':'disabled'}>${I('expand')} Settle (${money(expandCost())})</button>${ready('expand')?'':`<p class="mu" style="font-size:12px">Expand Borders available in ${fmtT(left('expand'))}.</p>`}`;else s+='<p class="mu" style="font-size:12.5px;margin:0">Only provinces bordering your territory can be settled.</p>';return s}
 if(u===uid)return s+'<p class="mu" style="font-size:12.5px;margin:0">Provinces held longer are harder to conquer (+5% defense per day, up to +50%).</p>';
 const why=canAttack(h);if(why)return s+`<p class="mu" style="font-size:12.5px;margin:0">${esc(why)}</p>`;
 return s+`<div class="field"><label>Troops to commit (you have ${num(me.troops)})</label><input id="atkX" type="number" min="10" max="${me.troops}" value="${Math.round(me.troops*.6)}"></div><p class="mu" style="font-size:12px;margin:0 0 10px">Strength per soldier: ${atkMult().toFixed(2)}. Costs $25, 0.1 oil and 0.05 food per soldier. Lowers approval, adds aggression, and leaves your army regrouping for 30 minutes.</p><button class="btn dng" style="width:100%" data-act="attack" data-a="${h}">${I('swords')} Launch invasion</button>`}
function pMilitary(){const n=me;const fronts=[];for(const h of myHexes())for(const k of nbrs(h)){const u=owner(k);if(u&&u!==uid&&!fronts.includes(k))fronts.push(k)}
 const bat=[];for(const[u,m]of Object.entries(A))for(const e of m.out||[])if(e.type==='battle'&&(u===uid||e.to===uid))bat.push([u,e]);bat.sort((a,b)=>b[1].t-a[1].t);const rg=(n.regroup||0)>Date.now();
 return`<h1 class="pg">Military</h1><p class="pgsub">Defend your territory and, when diplomacy fails, project force.</p><div class="stats" style="margin-bottom:16px">${stat('Troops',num(n.troops),'',`Limit ${num(n.pop*.05)}`)}${stat('Army power',num(power(uid)))}${stat('Training',n.train+' / '+C.maxTrain(n))}${stat('Fortifications',n.fort)}${stat('Fuel supply',n.res.oil>0?'Supplied':'Depleted',n.res.oil>0?'gn':'rd',n.res.oil>0?'':'Army strength −40%')}${stat('Status',rg?'Regrouping':'Ready',rg?'yl':'gn',rg?fmtT(n.regroup-Date.now())+' remaining':'')}</div>
 ${panel('Border provinces',fronts.length?`<table><thead><tr><th>Province</th><th>Controlled by</th><th class="r">Defense</th><th></th></tr></thead><tbody>${fronts.map(h=>{const why=canAttack(h);return`<tr><td>${esc(pname(h))}</td><td>${nmHtml(owner(h))}</td><td class="r num">${W.OWN[h].cap?'Capital':num(defense(h))}</td><td class="r">${why?`<span class="mu" style="font-size:12px">${esc(why)}</span>`:`<button class="btn sm dng" data-act="selhex" data-a="${h}">Plan invasion</button>`}</td></tr>`}).join('')}</tbody></table>`:'<p class="mu" style="margin:0">No foreign nation borders your territory yet.</p>','','shield')}
 ${panel('Rules of engagement',`<ul style="margin:0;padding-left:18px;color:#aab5c0;line-height:1.75"><li>You must hold the rank of <b>Mayor</b> and formally <b>declare war</b>. Forces mobilize for 10 minutes before the first strike.</li><li>Only provinces bordering your territory can be invaded. Capitals can never be captured.</li><li>Defenders benefit from fortifications, rank, technology, training, allies, and how long they have held the land (up to +50%).</li><li>New nations are protected for ${CFG.protectH} hours. You cannot attack a nation with less than 40% of your score unless it attacked you first.</li><li>Every invasion costs money, oil and food, lowers approval and stability, and adds 25 aggression. At 50 aggression you are <b>sanctioned</b>: worse market prices, no trade agreement benefits, and public discontent.</li><li>After an invasion your army regroups for 30 minutes, reducing your own defense by 25%.</li></ul>`,'','alert')}
 ${panel('Battle record',bat.length?`<div class="log">${bat.slice(0,25).map(([u,e])=>`<div><time>${ago(e.t)}</time><span>${nmHtml(u)} ${e.win?'<span class="tag g">won</span>':'<span class="tag r">lost</span>'} an invasion of ${esc(pname(e.h))} held by ${nmHtml(e.to)} — ${num(e.X)} committed, ${num(e.lossA)} lost; defenders lost ${num(e.lossD)}</span></div>`).join('')}</div>`:'<p class="mu" style="margin:0">No engagements yet.</p>')}`}
function pEconomy(){const pr=prices(),s=spreads(),sp=sanctioned(me);
 return`<h1 class="pg">Economy</h1><p class="pgsub">World prices move with what every nation buys and sells over the past six hours. Exporting lowers a price; importing raises it.</p>
 ${sp?`<div class="motd" style="border-color:#5f2b2e;background:#2a1517;color:#ffc1bd">${I('alert')}<span>Your nation is under international sanctions: export prices −30%, import prices +30%.</span></div>`:''}
 ${panel('World market',`<table><thead><tr><th>Commodity</th><th class="r">Stockpile</th><th class="r">World price</th><th class="r">Import at</th><th class="r">Export at</th><th>Quantity</th><th></th></tr></thead><tbody>${Object.keys(RES).map(r=>{const p=pr[r],ch=p/RES[r].p-1;return`<tr><td>${resI(r)} ${RES[r].n}</td><td class="r num">${num(me.res[r])}</td><td class="r num">${money(p)} <span class="${ch>=0?'gn':'rd'}" style="font-size:11.5px">${ch>=0?'▲':'▼'} ${Math.abs(ch*100).toFixed(0)}%</span></td><td class="r num">${money(p*s.buy)}</td><td class="r num">${money(p*s.sell)}</td><td><input id="q_${r}" type="number" min="1" value="50" style="width:90px"></td><td class="r" style="white-space:nowrap"><button class="btn sm ok" data-act="buy" data-a="${r}">Import</button> <button class="btn sm" data-act="sell" data-a="${r}">Export</button></td></tr>`}).join('')}</tbody></table>`,'','chart')}
 <div class="cols3">${panel('Trade balance',`<div class="stats" style="grid-template-columns:1fr 1fr">${stat('Exports',moneyS(me.exp||0),'gn')}${stat('Imports',moneyS(me.imp||0),'rd')}</div><p style="margin:10px 0 0">Net: <b class="${(me.exp||0)>=(me.imp||0)?'gn':'rd'}">${money((me.exp||0)-(me.imp||0))}</b></p>`)}
 ${panel('Trade agreements',`<p style="margin:0 0 8px"><b>${traders(uid).length}</b> of 5 active</p><p class="mu" style="margin:0;font-size:13px">Each agreement gives both nations +5% tax revenue, +1.5 approval and 3% better market prices. Negotiate them in Diplomacy.</p>`)}
 ${panel('Revenue',`<div class="stats" style="grid-template-columns:1fr 1fr">${stat('Per collection',moneyS(taxIncome()))}${stat('Tax rate',me.tax+'%')}</div><p class="mu" style="margin:10px 0 0;font-size:13px">Adjust taxes in Government.</p>`)}</div>`}
function pGov(){const n=me;return`<h1 class="pg">Government</h1><p class="pgsub">Set national policy and the form of government.</p>
 ${panel('Taxation',`<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><input type="range" id="taxr" min="5" max="50" value="${n.tax}" style="width:280px;max-width:100%"><b id="taxv" style="font-size:20px">${n.tax}%</b><span class="mu">≈ <b id="taxinc">${money(taxIncome())}</b> per collection</span></div><p class="mu" style="margin:10px 0 0;font-size:13px">Rates above 20% reduce approval each time you collect and over time.</p>`,'','coins')}
 ${panel('Form of government',`<div class="govs">${Object.entries(GOV).map(([k,g])=>`<button class="gov ${k===n.gov?'on':''}" data-act="gov" data-a="${k}"><b>${g.n}${k===n.gov?' <span class="tag y" style="margin-left:6px">Current</span>':''}</b><small>${g.d}</small></button>`).join('')}</div><p class="mu" style="margin:12px 0 0;font-size:13px">A change of government causes upheaval: stability −25 and approval −10. You can change at most once every 6 hours.</p>`,'','gov')}
 ${panel('Event log',`<div class="log">${(n.log||[]).map(l=>`<div><time>${ago(l.t)}</time><span>${esc(l.x)}</span></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div>`)}`}
function relTxt(u){const s=[];if(atWar(uid,u))s.push('<span class="tag r">At war</span>');if(pact(uid,u,'ally'))s.push('<span class="tag g">Allied</span>');if(pact(uid,u,'trade'))s.push('<span class="tag b">Trade agreement</span>');if(offered(u,uid,'ally'))s.push('<span class="tag y">Proposes alliance</span>');if(offered(u,uid,'trade'))s.push('<span class="tag y">Proposes trade</span>');if(atWar(uid,u)&&(R(u,uid).peace||0)>warSince(uid,u))s.push('<span class="tag y">Offers peace</span>');return s.join(' ')||'<span class="mu">Neutral</span>'}
function dipBtns(u){const b=[];const w=atWar(uid,u);
 if(w){const mine=(R(uid,u).peace||0)>warSince(uid,u);b.push(mine?'<button class="btn sm" disabled>Peace offered</button>':`<button class="btn sm ok" data-act="dip" data-a="peace" data-b="${esc(u)}">${(R(u,uid).peace||0)>warSince(uid,u)?'Accept peace':'Offer peace'}</button>`)}
 else b.push(`<button class="btn sm dng" data-act="dip" data-a="war" data-b="${esc(u)}">Declare war</button>`);
 if(!w){if(pact(uid,u,'ally'))b.push(`<button class="btn sm" data-act="dip" data-a="unally" data-b="${esc(u)}">End alliance</button>`);else if(offered(uid,u,'ally'))b.push('<button class="btn sm" disabled>Alliance proposed</button>');else b.push(`<button class="btn sm ok" data-act="dip" data-a="ally" data-b="${esc(u)}">${offered(u,uid,'ally')?'Accept alliance':'Propose alliance'}</button>`);
  if(pact(uid,u,'trade'))b.push(`<button class="btn sm" data-act="dip" data-a="untrade" data-b="${esc(u)}">Cancel trade</button>`);else if(offered(uid,u,'trade'))b.push('<button class="btn sm" disabled>Trade proposed</button>');else b.push(`<button class="btn sm ok" data-act="dip" data-a="trade" data-b="${esc(u)}">${offered(u,uid,'trade')?'Accept trade':'Propose trade'}</button>`)}
 b.push(`<button class="btn sm" data-act="dip" data-a="aid" data-b="${esc(u)}">Send aid</button>`);return`<div style="display:flex;gap:6px;flex-wrap:wrap">${b.join('')}</div>`}
function pDiplo(){const os=others().sort((a,b)=>score(b)-score(a));return`<h1 class="pg">Diplomacy</h1><p class="pgsub">Alliances and trade agreements require both parties to agree. War requires only one; peace requires both.</p>
 ${panel('Nations',os.length?`<table><thead><tr><th>Nation</th><th>Leader</th><th>Rank</th><th class="r">Provinces</th><th>Relations</th><th>Actions</th></tr></thead><tbody>${os.map(u=>`<tr><td><span class="dot" style="background:${esc(A[u].color)};display:inline-block;margin-right:8px"></span>${nmHtml(u)}</td><td class="mu">${esc(ruler(u))}</td><td>${esc(rankName(A[u]))}</td><td class="r num">${hexesOf(u).length}</td><td>${relTxt(u)}</td><td>${dipBtns(u)}</td></tr>`).join('')}</tbody></table>`:'<p class="mu" style="margin:0">No other nations yet. Invite others to join.</p>','','dip')}
 ${panel('How it works',`<ul style="margin:0;padding-left:18px;color:#aab5c0;line-height:1.75"><li>Allies commit 10% of their troops to your defense when you are invaded.</li><li>Trade agreements give both sides more revenue, approval and better market prices.</li><li>Declaring war ends any alliance or trade agreement with that nation.</li></ul>`)}`}
function pRank(){const us=Object.keys(A).sort((a,b)=>score(b)-score(a)),onl=onlineSet();
 return`<h1 class="pg">Rankings</h1><p class="pgsub">The world’s nations by overall strength.</p>${panel('World rankings',`<table><thead><tr><th>#</th><th>Nation</th><th>Leader</th><th>Rank</th><th class="r">Provinces</th><th class="r">Population</th><th class="r">Army power</th><th class="r">Score</th></tr></thead><tbody>${us.map((u,i)=>`<tr><td class="mu">${i+1}</td><td><span class="dot" style="background:${esc(A[u].color)};display:inline-block;margin-right:8px"></span>${nmHtml(u)} ${onl.has(u)?'<span class="gn" title="Online" style="font-size:10px">●</span>':''}</td><td class="mu">${esc(ruler(u))}</td><td>${esc(rankName(A[u]))}</td><td class="r num">${hexesOf(u).length}</td><td class="r num">${numS(A[u].pop)}</td><td class="r num">${num(power(u))}</td><td class="r num"><b>${num(score(u))}</b></td></tr>`).join('')}</tbody></table>`,'','trophy')}
 ${panel('World news',`<div class="log">${worldNews().slice(0,40).map(e=>`<div><time>${ago(e.t)}</time><span>${esc(e.x)}</span></div>`).join('')||'<p class="mu">Quiet so far.</p>'}</div>`)}`}
function pHelp(){const step=(t,d)=>`<div class="chk"><span class="cb" style="border-color:var(--ac)"></span><div><b>${t}</b><div class="mu" style="font-size:13px">${d}</div></div></div>`;
 return`<h1 class="pg">Guide</h1><p class="pgsub">Everything you need to know to lead a nation.</p><div class="cols"><div>${panel('The basics',[
 ['Run operations','Operations are on cooldown timers — taxes every 3 minutes, production every 5, and so on. The strip at the top shows each timer and turns green when it is ready.'],
 ['Earn promotions','Every operation and decision earns experience. Each rank raises your province limit by 4, adds 10% output, and strengthens your defenses.'],
 ['Grow your territory','Use Expand Borders to settle unclaimed land next to you, or pick the exact province on the World map.'],
 ['Manage resources','Every 10 minutes your land produces food, oil, steel and goods while your people and army consume them. Export surpluses and import shortages on the market.'],
 ['Make decisions',`Roughly every 40 minutes an issue needs your judgment — ${CARDS.length} possible scenarios, many depending on your situation. Some options are gambles.`],
 ['Practice diplomacy','Form alliances and trade agreements, send aid, or declare war — at a cost.'],
 ['AI nations','Nations marked AI are run by the computer under exactly the same rules as players. Each has a personality — merchants trade, expansionists grab land, warlords fight, isolationists fortify. They step aside as more real leaders join.']].map(([a,b])=>step(a,b)).join(''),'','book')}</div>
 <div>${panel('Province types',Object.values(TYPE).map(t=>`<div style="display:flex;gap:10px;align-items:center;padding:6px 0"><i style="width:14px;height:14px;border-radius:3px;background:${t.col};box-shadow:0 0 0 1px #ffffff30;flex:none"></i><b style="width:140px">${t.n}</b><span class="mu">${Object.entries(t.p).map(([r,v])=>`${v} ${r}`).join(', ')}${t.cash?', +$2,000':''}</span></div>`).join(''))}${panel('Fair play','<p class="mu" style="margin:0">Every action is checked and calculated by the game server, so results cannot be altered from a browser. One account per email address. Your nation keeps producing for two hours after you were last online.</p>')}</div></div>`}
function worldNews(){const r=[];for(const n of Object.values(A))for(const e of n.out||[])if(e.type==='news')r.push(e);return r.sort((a,b)=>b.t-a.t)}
// ================= chat & online =================
function onlineSet(){const s=new Set();const now=Date.now();for(const[u,o]of Object.entries(ON))if(o&&now-o.t<5*MIN&&A[u])s.add(u);if(me&&!document.hidden)s.add(uid);return s}
function renderOnline(){const now=Date.now();const on=[],idle=[];
 for(const[u,o]of Object.entries(ON)){if(!o||!(A[u]||names[u]))continue;const d=now-o.t;if(d<5*MIN&&u!==uid)on.push(u);else if(d<30*MIN&&u!==uid)idle.push(u)}
 if(uid&&(A[uid]||names[uid])&&!document.hidden)on.unshift(uid);
 const allies=uid&&A[uid]?new Set(C.allies(W,uid)):new Set();
 const label=u=>names[u]||(A[u]?A[u].name:'Leader');
 const item=(u,st)=>{const n=A[u];const cls=[st,allies.has(u)?'ally':'',u===uid?'me':''].join(' ');const col=n?n.color:'#8b98a5';const tip=n?`${n.name} — ${rankName(n)}${allies.has(u)?' · your ally':''}${st==='idle'?' · active '+ago(ON[u].t):''}`:'No nation yet';return`<a class="${cls}" style="color:${esc(col)}" ${n?`data-act="prof" data-a="${esc(u)}"`:''} title="${esc(tip)}">${st==='idle'?'*':''}${esc(label(u))}</a>`};
 const total=on.length+idle.length;$('onlCount').textContent=`· ${on.length} online`;
 $('onlstrip').innerHTML=`<div class="oh">${total} Leader${total===1?'':'s'} online in the past 30 minutes:</div><div class="names">${on.map(u=>item(u,'on')).join('')}${idle.map(u=>item(u,'idle')).join('')||''}</div>${total?'<div class="legend"><b>Bold</b> online now · <i>*Italic</i> recently active · <u>Underlined</u> your allies</div>':''}`}
let lastChatKey='';
function renderChat(force){const msgs=[];for(const[u,c]of Object.entries(CH)){if(u==='_system'){for(const m of c.m||[])msgs.push({s:1,t:m.t,x:m.x});continue}if(!A[u])continue;for(const m of c.m||[])msgs.push({u,t:m.t,x:m.x})}
 for(const e of worldNews().slice(0,25))if(!/^A new nation has been founded/.test(e.x))msgs.push({n:1,t:e.t,x:e.x});msgs.sort((a,b)=>a.t-b.t);const show=msgs.slice(-150);const key=show.length+':'+(show.at(-1)?.t||0)+':'+Object.keys(A).length;if(!force&&key===lastChatKey)return;lastChatKey=key;
 const el=$('chat');const atBot=el.scrollHeight-el.scrollTop-el.clientHeight<40;
 el.innerHTML=show.map(m=>{const ts=new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});if(m.s)return`<div class="m sys"><time>${ts}</time><b>Announcement</b> — ${esc(m.x)}</div>`;return m.n?`<div class="m n"><time>${ts}</time><span class="lbl">News</span>${esc(m.x)}</div>`:`<div class="m"><time>${ts}</time><span class="who" data-act="prof" data-a="${esc(m.u)}" style="color:${esc(A[m.u].color)}">${esc(A[m.u].name)}</span>${esc(m.x)}</div>`}).join('')||'<div class="mu">No messages yet.</div>';
 if(atBot||force)el.scrollTop=el.scrollHeight}
function profile(u){if(!A[u])return;const n=A[u];modal(`<header><h2><span class="dot" style="background:${esc(n.color)}"></span>${esc(n.name)}${aiTag(u)}</h2><button class="btn sm ghost" data-act="close">Close</button></header><div class="bd"><div class="stats">${stat('Leader',esc(ruler(u)))}${stat('Rank',esc(rankName(n)))}${stat('Government',GOV[n.gov].n)}${stat('Provinces',hexesOf(u).length)}${stat('Population',numS(n.pop))}${stat('Army power',num(power(u)))}${stat('Tech level',n.tech)}${stat('Score',num(score(u)))}</div>${u!==uid&&me?`<div style="margin:14px 0 8px">${relTxt(u)}</div>${dipBtns(u)}`:''}<div style="margin-top:14px"><button class="btn sm" data-act="fly" data-a="${esc(u)}">${I('globe')} Show on map</button></div></div>`)}
// ================= modal / toast =================
function modal(html){const m=$('mod');m.innerHTML=`<section class="panel">${html}</section>`;m.style.display='flex'}
function closeModal(){$('mod').style.display='none';$('mod').innerHTML=''}
let askFn=null;function ask(title,body,label,fn){askFn=fn;modal(`<header><h2>${title}</h2></header><div class="bd"><p style="margin-top:0">${body}</p><div style="display:flex;gap:8px"><button class="btn dng" data-act="askyes">${label}</button><button class="btn" data-act="close">Cancel</button></div></div>`)}
let toastT;function toast(t){if(!t)return;const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',4000)}
// ================= events =================
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.a,b=el.dataset.b;switch(el.dataset.act){
 case'page':page=a;closeModal();render();$('main').scrollTop=0;if(a==='chat')renderChat(true);break;
 case'do':doAct(a,b);break;
 case'decide':decide(a,+b);break;
 case'gov':if(a===me.gov)break;ask(`Change government to ${GOV[a].n}?`,'The transition will reduce stability by 25 and approval by 10.','Change government',()=>cmd({c:'gov',g:a}));break;
 case'dip':DIP[a](b);break;
 case'aidgo':aidGo(a);break;
 case'buy':trade(a,+$('q_'+a).value,true);break;
 case'sell':trade(a,+$('q_'+a).value,false);break;
 case'attack':attack(+a,+$('atkX').value);break;
 case'selhex':selHex=+a;page='world';render();GL.flyTo(P[+a].c,3);break;
 case'prof':profile(a);break;
 case'fly':{closeModal();if(page!=='world'){page='world';render()}if(A[a]&&P[A[a].cap])GL.flyTo(P[A[a].cap].c,2.6);break}
 case'gz':if(a==='in')GL.zoom(1.35);else if(a==='out')GL.zoom(1/1.35);else if(me)GL.flyTo(P[me.cap].c,2.4);break;
 case'fcol':found_.color=a;keepName();render();break;
 case'fgov':found_.gov=a;keepName();render();break;
 case'found':found();break;
 case'hideguide':cmd({c:'hideguide'},false);break;
 case'askyes':{const f=askFn;askFn=null;closeModal();f&&f();break}
 case'close':closeModal();break;
 case'dock':dockMin=!dockMin;$('dock').classList.toggle('min',dockMin);el.textContent=dockMin?'Show':'Hide';break}});
function keepName(){const el=$('fn_name');if(el)found_.name=el.value}
$('mod').addEventListener('click',e=>{if(e.target.id==='mod')closeModal()});
let taxT;document.addEventListener('input',e=>{if(e.target.id==='taxr'&&me){const t=+e.target.value;$('taxv').textContent=t+'%';const old=me.tax;me.tax=t;$('taxinc').textContent=money(taxIncome());me.tax=old;clearTimeout(taxT);taxT=setTimeout(()=>cmd({c:'tax',t}),500)}});
$('chatin').addEventListener('submit',e=>{e.preventDefault();const i=$('cin');sendChat(i.value);i.value=''});
setInterval(()=>{if(me)updTimers()},1000);
setInterval(()=>{if(loaded)refresh()},30000);
setInterval(heartbeat,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){heartbeat();if(loaded)refresh()}});
window.addEventListener('wp-config',e=>{CFG={...CFG,...e.detail};if(loaded)refresh()});
window.addEventListener('wp-announce',e=>{toast(e.detail.text)});
window.addEventListener('wp-login',()=>{const host=document.getElementById('authGlobe');if(!host)return;refreshW();GL.st.scale=1.25;GL.attach(host,'bg');const spin=()=>{if(!host.isConnected)return;GL.st.rot=[GL.st.rot[0]+.08,-18,0];GL.redraw();requestAnimationFrame(spin)};spin()});
// ================= boot =================
refreshW();
(async()=>{renderSide();
 const lt=setTimeout(()=>{if(!loaded)$('main').innerHTML='<div class="wrap"><p class="mu">Still connecting… The world will load as soon as the server responds.</p></div>'},10000);
 try{[db,U]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 if(!db){clearTimeout(lt);loaded=true;render();return}
 try{uid=await U.id()}catch(e){}
 const mi=WP.me();if(mi&&mi.admin&&mi.adminPath){const al=$('adminLink');al.href=mi.adminPath;al.style.display=''}
 let gotN=false,gotC=false,hadMine=false;
 db.collection('nations').onSnapshot(s=>{N={};s.docs.forEach(d=>{if(d.exists)N[d.id]=d.data()});
  if(!gotN){gotN=true;clearTimeout(lt);loaded=true;heartbeat();refreshW();if(me){page='overview';setTimeout(()=>{if(me&&P[me.cap]){GL.st.rot=[-P[me.cap].c[0],-P[me.cap].c[1],0];GL.st.scale=2;GL.redraw()}},50)}}
  if(N[uid])hadMine=true;else if(hadMine){hadMine=false;toast('Your nation was reset by an administrator.')}
  refresh();loadNames()},()=>{clearTimeout(lt);loaded=true;$('main').innerHTML='<div class="wrap"><p class="rd">Lost connection to the server. Reload the page to reconnect.</p></div>'});
 db.collection('chat').onSnapshot(s=>{CH={};s.docs.forEach(d=>{if(d.exists)CH[d.id]=d.data()});if(uid&&CH[uid]&&!gotC)myChat=(CH[uid].m||[]).slice();gotC=true;if(uid&&myChat.length&&CH[uid])CH[uid]={m:myChat};renderChat();if(page==='chat')markChatSeen();renderSide()},()=>{});
 db.collection('online').onSnapshot(s=>{ON={};s.docs.forEach(d=>{if(d.exists)ON[d.id]=d.data()});loadNames();renderOnline()},()=>{});
})();
let nameKey='';async function loadNames(){if(!U)return;const ids=[...new Set([...Object.keys(A),...Object.keys(ON),uid].filter(Boolean))];const k=ids.sort().join(',');if(k===nameKey)return;nameKey=k;try{const ps=await U.profiles(ids);for(const id of ids)names[id]=(ps&&ps[id]&&ps[id].name)||'';render();renderOnline()}catch(e){}}

</script>
</body></html>
