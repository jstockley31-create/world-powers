<style>

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:.15s}

a{color:var(--bl);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}

.brand b{display:block;letter-spacing:.14em;font-size:14px;font-weight:700;font-family:Cinzel,Georgia,serif;line-height:1.15}.brand .crest{width:30px;height:30px;flex:none}.brand small{display:block;color:var(--ac);font-size:9.5px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin-top:2px}

@media(min-width:821px) and (max-width:1300px){.rkt th,.rkt td{padding:6px 6px;font-size:12.5px}}

.wrap{max-width:1240px;margin:0 auto}.wrap.enter{animation:pgin .18s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.wrap.enter,.confetti,.promo,.shake{animation:none!important}}

}

.op .tx{min-width:0;line-height:1.35}.op .nm{display:flex;align-items:baseline;gap:8px}.op .nm b{font-size:14px;font-weight:600;white-space:nowrap}.op .nm small{color:var(--mu);font-size:11px;white-space:nowrap}
.op .ef{font-size:12.5px;margin-top:1px}.op .gn{color:#8fdca6}.op .cs{color:var(--mu)}
.op .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bg);overflow:hidden}.op .prog i{display:block;height:100%;background:var(--bl)}
.op .btn{width:100%;padding-left:6px;padding-right:6px;font-variant-numeric:tabular-nums}.op .btn:disabled{background:var(--s3);border-color:var(--bd2);color:var(--mu);opacity:1}

.opc .h b{font-size:14.5px;font-weight:600;display:block}.opc .h small{color:var(--mu);font-size:11.5px}.opc .d{color:#aab5c0;font-size:13px;flex:1}.opc .btn{width:100%}

.czhand{margin-bottom:16px}
.czhl{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(241,236,224,.8);margin-bottom:8px}
.czhl span{min-width:30px;text-align:center;font-weight:700;font-size:14px;color:#1a1d22;background:#e9d29a;border-radius:99px;padding:1px 9px}
.czhl em{font-style:normal;color:rgba(241,236,224,.65);font-variant-numeric:tabular-nums}
.czcards{display:flex;gap:10px;min-height:118px;perspective:800px;flex-wrap:wrap}
.czslot{width:80px;height:114px;border-radius:9px;border:1px solid rgba(233,210,154,.25)}
.czcard{--i:0;position:relative;width:80px;height:114px;border-radius:9px;background:linear-gradient(160deg,#fbf9f3,#efe9dc);color:#1a1d22;fill:#1a1d22;
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 14px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.12);animation:czdeal .45s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i) * .09s)}
.czcard.red{color:#a3221c;fill:#a3221c}
.czix{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;align-items:center;line-height:1}
.czix b{font-size:16px;font-weight:700;font-family:Georgia,'Times New Roman',serif}
.czix .czs{width:11px;height:11px;margin-top:2px}
.czix.br{top:auto;left:auto;bottom:6px;right:6px;transform:rotate(180deg)}
.czs{display:block}
.czpips{position:absolute;inset:16px 14px}
.czpips span{position:absolute;width:15px;height:15px;transform:translate(-50%,-50%)}.czpips span.dn{transform:translate(-50%,-50%) rotate(180deg)}
.czpips .czs{width:100%;height:100%}
.czace{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.czace .czs{width:38px;height:38px}
.czface{position:absolute;inset:18px 16px;border:1px solid currentColor;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(180deg,rgba(201,162,74,.12),rgba(201,162,74,.04))}
.czface b{font-family:Cinzel,Georgia,serif;font-size:30px;line-height:1}.czface .czs{width:16px;height:16px}
.czcard.back{background:#7b1a1f;box-shadow:0 6px 14px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.2)}
.czcard.back i{position:absolute;inset:6px;border-radius:5px;border:1px solid rgba(233,210,154,.7);background:repeating-linear-gradient(45deg,rgba(233,210,154,.16) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(233,210,154,.16) 0 2px,transparent 2px 7px)}
.czcard.flip{animation:czflip .6s ease-out both}
@keyframes czdeal{from{opacity:0;transform:translate(160px,-90px) rotate(14deg)}to{opacity:1;transform:none}}
@keyframes czflip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.czres{text-align:center;font-size:15px;font-weight:600;margin:12px auto;padding:9px 14px;max-width:520px;border-radius:10px;background:rgba(0,0,0,.22);color:rgba(241,236,224,.9)}
.czres.w{background:linear-gradient(90deg,rgba(201,162,74,.12),rgba(201,162,74,.28),rgba(201,162,74,.12));color:#f6e6b4;box-shadow:inset 0 0 0 1px rgba(233,210,154,.5)}
.czres.l{color:#f2c2bd}
.czact{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.czbtn{font:inherit;font-size:15px;font-weight:700;min-width:110px;padding:11px 20px;border-radius:10px;cursor:pointer;border:1px solid rgba(233,210,154,.45);background:rgba(0,0,0,.25);color:#f1ece0}
.czbtn.pri{background:linear-gradient(180deg,#e2c178,#c9a24a);border-color:#e9d29a;color:#1a1204;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.czbtn.wide{min-width:220px}
.czbtn:hover:not(:disabled){filter:brightness(1.08)}.czbtn:disabled{opacity:.5;cursor:default}
.czrule{font-size:13px;color:var(--mu);margin:10px 4px 0;max-width:72ch}
.czrlwrap{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;margin-bottom:18px}
.czwheel{--s:290px;position:relative;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:radial-gradient(circle,#2a1d14 0 64%,#3b2a1c 64% 70%,#1a120c 70% 100%);box-shadow:0 0 0 3px #c9a24a,0 0 0 9px #241811,0 0 0 10px rgba(201,162,74,.5),0 18px 40px rgba(0,0,0,.55)}
.czrot{position:absolute;inset:4%;will-change:transform}.czwsvg{width:100%;height:100%;display:block}
.czptr{position:absolute;left:50%;top:-14px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #e9d29a;transform:translateX(-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));z-index:3}
.czcar{position:absolute;inset:0;pointer-events:none;z-index:2}
.czball{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d9d9 55%,#9a9a9a);box-shadow:0 2px 4px rgba(0,0,0,.6);transform:translate(-50%,-50%) translateY(calc(var(--s) * -.36))}
.czrlside{display:flex;flex-direction:column;gap:14px;min-width:230px}
.czwin{display:flex;align-items:center;gap:14px}.czwin .czres{margin:0;text-align:left}
.czmk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 1px rgba(233,210,154,.45)}
.czmk.r{background:#9b1c1c}.czmk.b{background:#16181b}.czmk.g{background:#0f6b43}.czmk.q{background:rgba(0,0,0,.3);color:rgba(241,236,224,.7)}
.czmk.big{width:58px;height:58px;font-size:24px;flex:none;box-shadow:inset 0 0 0 2px #c9a24a}
.czrecent small{display:block;font-size:12px;color:rgba(241,236,224,.6);margin-bottom:6px}.czrecent div{display:flex;gap:5px;flex-wrap:wrap}
.czlayout{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;gap:4px;max-width:760px;margin:0 auto}
.czn{font:inherit;font-size:13px;font-weight:700;color:#f1ece0;border:1px solid rgba(233,210,154,.35);border-radius:4px;padding:10px 0;cursor:pointer;background:transparent;position:relative}
.czn.r{background:rgba(155,28,28,.85)}.czn.b{background:rgba(22,24,27,.85)}.czn.g{background:rgba(15,107,67,.9)}
.czn.z{grid-row:1;border-radius:20px 4px 4px 20px}
.cznums{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.czouts{grid-column:2;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.czo{font:inherit;font-size:13px;font-weight:600;color:#f1ece0;background:transparent;border:1px solid rgba(233,210,154,.35);border-radius:4px;padding:10px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.czo i{display:block;width:20px;height:20px;transform:rotate(45deg)}.czo.red i{background:#b42222}.czo.black i{background:#0d0e10;box-shadow:0 0 0 1px rgba(233,210,154,.5)}
.czn:hover:not(:disabled),.czo:hover:not(:disabled){box-shadow:inset 0 0 0 2px #e9d29a}
.czn:disabled,.czo:disabled{cursor:default}
.czn.pk::after,.czo.pk::after{content:'';position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:50%;background:repeating-conic-gradient(#c9a24a 0 30deg,#f3e2b0 30deg 45deg);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.czmachine{width:max-content;max-width:100%;margin:2px auto 4px;padding:14px;border-radius:16px;background:linear-gradient(180deg,#2a2e34,#15181c);box-shadow:inset 0 0 0 1px rgba(233,210,154,.5),0 12px 28px rgba(0,0,0,.45)}
.czreels{position:relative;display:flex;gap:8px;padding:8px;border-radius:10px;background:#0b0d10}
.czreel{width:96px;height:252px;overflow:hidden;border-radius:6px;background:linear-gradient(180deg,#d8d2c3 0%,#f7f3ea 22%,#fbf9f3 50%,#f7f3ea 78%,#d8d2c3 100%);position:relative}
.czreel::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.35));pointer-events:none}
.czstrip{will-change:transform}
.czsym{height:84px;display:flex;align-items:center;justify-content:center}.czsym svg{width:58px;height:58px}
.czline{position:absolute;left:4px;right:4px;top:50%;height:0;border-top:2px solid rgba(201,162,74,.85);box-shadow:0 0 10px rgba(201,162,74,.6);pointer-events:none}
.czmachine.won{box-shadow:inset 0 0 0 1px #e9d29a,0 0 0 3px rgba(201,162,74,.35),0 0 30px rgba(201,162,74,.35),0 12px 28px rgba(0,0,0,.45)}
.czpay{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 16px;max-width:620px;margin:16px auto 0;font-size:13px}
.czpay div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.18)}
.czpay span{display:flex;gap:1px}.czpay svg{width:20px;height:20px}.czpay b{color:#e9d29a;font-variant-numeric:tabular-nums}
.czdice{display:flex;justify-content:center;gap:34px;padding:16px 0 6px;perspective:700px}
.czdie{width:76px;height:76px;transform:rotateX(-22deg) rotateY(-28deg);transform-style:preserve-3d}
.czcube{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.czf{position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 30% 25%,#fffdf8,#ece6d8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 -4px 8px rgba(0,0,0,.08);backface-visibility:hidden}
.czf i{position:absolute;width:15%;height:15%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3f46,#111316);transform:translate(-50%,-50%)}
.czf.f1 i{background:radial-gradient(circle at 40% 35%,#c9332b,#7d1712);width:20%;height:20%}
.czf.f1{transform:translateZ(38px)}.czf.f6{transform:rotateY(180deg) translateZ(38px)}.czf.f3{transform:rotateY(90deg) translateZ(38px)}.czf.f4{transform:rotateY(-90deg) translateZ(38px)}.czf.f2{transform:rotateX(90deg) translateZ(38px)}.czf.f5{transform:rotateX(-90deg) translateZ(38px)}
.czdbets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:12px auto 0}
.czdb{font:inherit;color:#f1ece0;background:rgba(0,0,0,.22);border:1px solid rgba(233,210,154,.4);border-radius:10px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.czdb b{font-size:15px}.czdb small{font-size:12px;color:rgba(241,236,224,.65)}.czdb em{font-style:normal;font-weight:700;color:#e9d29a;margin-top:4px}
.czdb:hover:not(:disabled){box-shadow:inset 0 0 0 2px #e9d29a}.czdb:disabled{cursor:default;opacity:.7}
.czdb.pk::after{content:'';position:absolute;right:8px;top:8px;width:14px;height:14px;border-radius:50%;background:repeating-conic-gradient(#c9a24a 0 30deg,#f3e2b0 30deg 45deg);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.czhist{margin-top:18px}.czhist h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--tx)}
.czhl2>div{display:grid;grid-template-columns:70px 1fr auto 90px;gap:10px;align-items:center;font-size:13px;padding:7px 2px;border-bottom:1px solid var(--bd)}
.czhl2 time{color:var(--mu);font-size:12px}.czhl2 b{text-align:right}.czhl2 i{font-style:normal}
@media (max-width:760px){.czstat{gap:18px;width:100%;justify-content:space-between}.czstat dd{font-size:17px}.czbar{flex-direction:column;align-items:stretch}.czseg{width:100%}.czseg button{flex:1;padding:8px 6px}
 .czfelt{padding:16px 12px}.czwheel{--s:230px}.czrlside{min-width:0;width:100%}
 .czlayout{grid-template-columns:1fr}.czn.z{grid-row:auto;border-radius:20px 20px 4px 4px}.cznums{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}.cznums .czn{order:var(--o)}.czouts{grid-column:1;grid-template-columns:repeat(3,minmax(0,1fr))}
 .czcard{width:62px;height:90px}.czslot{width:62px;height:90px}.czcards{min-height:92px}.czpips{inset:12px 10px}.czpips span{width:11px;height:11px}.czface b{font-size:22px}.czface{inset:14px 12px}
 .czreel{width:78px;height:210px}.czsym{height:70px}.czsym svg{width:48px;height:48px}.czhl2>div{grid-template-columns:52px 1fr auto;}.czhl2>div>.num:not(b){display:none}}
@media (prefers-reduced-motion:reduce){.czcard,.czcard.flip{animation:none}}

.opbox{border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;background:var(--s2)}
.opbox b{font-size:13.5px}
.opbox span{color:var(--mu);line-height:1.45}
.opbox.on{border-color:rgba(212,166,74,.55);background:rgba(212,166,74,.08)}
.opbox .btn{align-self:flex-start}

/* vote buttons pulse until used (12 hours) */
.votebtn2.vflash{animation:vflash 1.6s ease-in-out infinite;background:rgba(240,195,92,.12)}
@keyframes vflash{0%,100%{box-shadow:0 0 0 0 rgba(240,195,92,0);border-color:#f0c35c55}50%{box-shadow:0 0 0 3px rgba(240,195,92,.35),0 0 14px rgba(240,195,92,.45);border-color:#f0c35c;color:#ffe08a!important}}
@media (prefers-reduced-motion:reduce){.votebtn2.vflash{animation:none;border-color:#f0c35c;box-shadow:0 0 0 2px rgba(240,195,92,.35)}}
#mailBtn.on{color:var(--ac)}

@media (max-width:520px){#natbox{flex:1;min-width:0;padding-left:10px}#natbox>div{min-width:0}#natbox b{max-width:100%;display:block}#natbox small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#logoutBtn .lotx,#adminLink .lotx{display:none}#logoutBtn,#adminLink{padding-left:9px;padding-right:9px}}

/* big Message button on profiles, next to the flag */
.pmsg{margin-left:auto;display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;border:1px solid #e9d29a;background:linear-gradient(180deg,#e2c178,#c9a24a);color:#1a1204;font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);flex:none}
.pmsg .ic{width:22px;height:22px}
.pmsg span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.pmsg small{font-size:11.5px;font-weight:600;opacity:.75;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmsg:hover{filter:brightness(1.07)}.pmsg:focus-visible{outline:2px solid #f5d999;outline-offset:2px}
@media (max-width:520px){.pflag{flex-wrap:wrap}.pmsg{margin-left:0;width:100%;justify-content:center;padding:14px}}

/* seasons */
.seab{display:flex;text-align:left;width:100%;border-color:rgba(201,162,74,.5);background:linear-gradient(90deg,rgba(201,162,74,.12),rgba(201,162,74,.03));color:var(--tx);cursor:pointer;font:inherit}
.seaic{font-size:20px;line-height:1}
.seat{width:100%;border-collapse:collapse;font-size:14px}.seat td{padding:7px 6px;border-bottom:1px solid var(--bd)}.seat tr.mine td{background:rgba(212,166,74,.08)}.seamd{width:34px;text-align:center;font-size:16px}
.seapz{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:13px}.seapz span{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
.hofl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.hofi{display:flex;flex-direction:column;gap:3px;border:1px solid rgba(201,162,74,.3);border-radius:12px;padding:12px 14px;background:linear-gradient(180deg,rgba(201,162,74,.07),transparent)}
.hofn{font-family:Cinzel,Georgia,serif;font-size:12px;color:#c9a24a;letter-spacing:.06em}.hofc{font-size:14px}

.czfelt{padding-top:64px}
.czbrand{position:absolute;top:16px;left:20px;display:flex;align-items:center;gap:9px;color:rgba(233,210,154,.8);pointer-events:none;z-index:1;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.czbrand svg{width:32px;height:32px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.czbrand div{display:flex;flex-direction:column;line-height:1.05;font-family:Cinzel,Georgia,serif}
.czbrand b{font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.czbrand span{font-size:16px;font-weight:700;letter-spacing:.38em;text-transform:uppercase;color:#e9d29a}
@media (max-width:760px){.czfelt{padding-top:56px}.czbrand{top:12px;left:14px}.czbrand svg{width:26px;height:26px}.czbrand b{font-size:10px}.czbrand span{font-size:13.5px}}

/* all-time table record */
.czscore{margin:18px -4px 0;padding:12px 14px 10px;border-radius:12px;background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1px rgba(233,210,154,.22)}
.czsh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:rgba(241,236,224,.7);margin-bottom:8px}.czsh b{font-family:Cinzel,Georgia,serif;letter-spacing:.06em;color:#e9d29a;font-size:13px}
.czsrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.czside{display:flex;flex-direction:column;line-height:1.15;min-width:84px}.czside.r{text-align:right}
.czside small{font-size:11.5px;color:rgba(241,236,224,.65)}.czside b{font-size:17px;font-variant-numeric:tabular-nums}.czside b.up{color:#a8f0c6}.czside b.dn{color:#f2c2bd}
.czsbar{position:relative;display:flex;height:22px;border-radius:99px;overflow:hidden;background:#0b0d10;box-shadow:inset 0 0 0 1px rgba(233,210,154,.3)}
.czsbar i{display:block;height:100%;transition:width .6s ease}.czsbar i.pl{background:linear-gradient(90deg,#1f6b45,#2f8a5a)}.czsbar i.hs{background:linear-gradient(90deg,#7b1a1f,#9b2a2a)}
.czsbar em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.czsfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:rgba(241,236,224,.6)}
@media (max-width:520px){.czside{min-width:64px}.czside b{font-size:14px}.czsfoot span:nth-child(2){display:none}}

/* provably fair */
.czpf{position:absolute;top:18px;right:20px;z-index:1;font-size:12px;font-weight:600;color:#a8f0c6;text-decoration:none;border:1px solid rgba(168,240,198,.45);border-radius:99px;padding:4px 10px;background:rgba(0,0,0,.2)}
.czpf:hover{background:rgba(63,185,80,.15)}
.czfair{margin-top:18px;border:1px solid var(--bd2);border-radius:12px;padding:14px 16px;background:var(--s1)}
.czfair h3{margin:0 0 4px;font-size:15px}.czfair p{margin:0 0 10px;font-size:13px;max-width:75ch}
.czfdl{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) auto;gap:10px 18px;margin:0}

.czbn{font-size:11px;margin-left:4px}.czbn a{color:#a8f0c6}

.czbarr{display:flex;align-items:center;gap:12px;margin-left:auto}
.czfs{width:38px;height:38px;padding:0;border-radius:8px;background:#0f151ccc;border:1px solid var(--bd2);display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.czfs:hover{border-color:#c9a24a;color:#e9c46a}.czfs:focus-visible{outline:2px solid #c9a24a;outline-offset:2px}
.czfcash{font-size:13px;color:#b9a98a;white-space:nowrap}.czfcash b{color:#fff;font-size:16px;margin-left:4px}

(function(){

const QS=new URLSearchParams(location.search);try{if(/^[A-Za-z0-9]{7}$/.test(QS.get('ref')||''))localStorage.setItem('wp_ref',QS.get('ref'))}catch(e){}
const getRef=()=>{try{return localStorage.getItem('wp_ref')||''}catch(e){return''}};
const st={me:null,users:{},cols:{nations:{},chat:{},online:{}},ready:false,subs:[]};

function mkErr(status,msg){const code=status===401?'revoked':status===429?'unavailable':(status>=400&&status<500)?'invalid_argument':'unavailable';return Object.assign(new Error(msg),{code,status})}

const shortfall=p=>{const miss=[];if(me.cash<p.cost.cash)miss.push(`${money(p.cost.cash)} (you have ${money(me.cash)})`);if(me.res.oil<p.cost.oil)miss.push(`${num(p.cost.oil)} oil (you have ${num(me.res.oil)})`);if(me.res.food<p.cost.food)miss.push(`${num(p.cost.food)} food (you have ${num(me.res.food)})`);return miss};
function genLine(t){const a=C.bestGen(me,'attack'),l=C.bestGen(me,'logistics'),d=C.bestGen(t,'defense');const bits=[a?`Your field marshal <b>${esc(a.name)}</b> ${stars(a.stars)} (+${a.stars*4}% attack)`:'',l?`quartermaster <b>${esc(l.name)}</b> ${stars(l.stars)} (−${l.stars*10}% distance penalty)`:'',d?`their defense commander <b>${esc(d.name)}</b> ${stars(d.stars)} (+${d.stars*4}% defense)`:''].filter(Boolean);return bits.length?`<p style="font-size:13px;margin:0 0 10px">${bits.join(' · ')}</p>`:''}

 :`<div class="gapbar hi">${I('check')}<span><b>Tech edge:</b> you (tech ${num(Math.floor(me.tech||0))}) are far ahead of ${esc(d.name)} (tech ${num(Math.floor(d.tech||0))}). Your strikes and heavy weapons do about <b>${pc(g)}</b> of their normal damage, and your invasions fight at <b>${pc(Math.sqrt(g))}</b> strength.</span></div>`}
function strikeBox(v){const why=C.canStrike(W,uid,v),hasMis=(me.tech||0)>=C.MISSILE.tech,D=C.DIRTY,dWhy=C.canDirty(W,uid,v);

const HV_TXT={artillery:H=>`Shell their front line: kills about ${(H.troops*100).toFixed(1)}% of their army (less against heavy fortifications) and knocks their fortifications down a level. Cheap and quick. Adds ${H.aggr} aggression.`,
 cruise:H=>`A precision missile on their most developed province: destroys a development level, infrastructure −${H.infra}, and kills ${Math.round(H.troops*100)}% of their army. A Golden Dome can shoot it down. Adds ${H.aggr} aggression.`,
 carpet:H=>`Send up to 200 of your aircraft over a province: kills up to ${(H.pop*100).toFixed(1)}% of their people and ${Math.round(H.troops*100)}% of their army, infrastructure −1. Their air force shoots some bombers down. Needs ${H.air}+ aircraft and ${H.oilPer} oil per bomber. Adds ${H.aggr} aggression.`,
 sub:H=>`Your submarines torpedo their navy: sinks about ${Math.round(H.sink*100)}% of their warships (more with better tech). You may lose a submarine. Needs ${H.ships}+ warships and a coast. Adds ${H.aggr} aggression.`,
ballistic:H=>`One heavy warhead on a random province: kills ${Math.round(H.pop*100)}% of their people and ${Math.round(H.troops*100)}% of their army, infrastructure −${H.infra}, GDP −${Math.round(H.gdp*100)}%. Hard to intercept: a Golden Dome stops only about half as many as it does cruise missiles. Adds ${H.aggr} aggression.`,
 bombard:H=>`Your fleet shells one of their coastal provinces: kills troops, sinks warships and can wreck infrastructure. The more warships you send, the harder it hits; their navy shoots back. Needs ${H.ships}+ warships, a coast on both sides, and ${H.oilPer} oil per ship. Adds ${H.aggr} aggression.`,
 cyber:H=>`Hackers break into their government networks: tax revenue −${Math.round((1-H.tax)*100)}% and research costs +${Math.round((H.research-1)*100)}% for ${H.h} hours. No one dies. Only a ${Math.round(H.trace*100)}% chance it is traced back to you; if it isn't, it adds no aggression and they never learn who did it.`,
 drones:H=>`A swarm of armed drones hits their troops and airfields: up to ${Math.round(H.troops*100)}% of their army and ${Math.round(H.air*100)}% of their aircraft. A Golden Dome can't stop it, but their air force shoots part of the swarm down. Cheap, and ready every ${H.cdH} hours. Adds ${H.aggr} aggression.`,
 hypersonic:H=>`Too fast for any missile shield: kills ${Math.round(H.pop*100)}% of their people and ${Math.round(H.troops*100)}% of their army, infrastructure −${H.infra}, GDP −${Math.round(H.gdp*100)}%. No Golden Dome can intercept it. Adds ${H.aggr} aggression.`,
 blockade:H=>`Your fleet seals their ports for ${H.h} hours: tax revenue −${Math.round((1-H.tax)*100)}%, GDP −${Math.round((1-H.gdp)*100)}%, and no world market trading. Needs ${H.ships}+ warships, a coast on both sides, and ${H.oilPer} oil per ship; their navy may sink a few of yours. Adds ${H.aggr} aggression.`,
 raid:H=>`Commandos strike their most developed province: steal ${Math.round(H.steal*100)}% of their treasury (up to ${moneyS(H.stealMax)}) and ${Math.round(H.res*100)}% of their biggest stockpile, and wreck a development level. Forts and agents make it harder; if it fails, your commandos are captured and they get a 24-hour just cause. Adds ${H.aggr} aggression.`,

 emp:H=>`A burst high above their capital fries electronics: ${Math.round(H.air*100)}% of their aircraft knocked out, their Golden Dome offline, tax revenue −${Math.round((1-H.tax)*100)}% and GDP −${Math.round(H.gdp*100)}% for ${H.h} hours. No fallout. Adds ${H.aggr} aggression.`};
function heavyBox(v){const HV=C.HEAVY,g=C.gapF(me,A[v]);return`<div style="margin-top:14px"><b style="font-size:15px">Heavy weapons</b><p class="mu" style="font-size:12.5px;margin:4px 0 8px">Serious options short of a nuclear strike. Each has its own cooldown, separate from air and missile strikes, and uses munitions from your stockpile (you have <b>${num(Math.floor(me.res.mun||0))}</b>).${g<.97||g>1.03?' The effects shown already include the tech gap.':''}</p><div class="hvgrid">${Object.keys(HV).sort((a,b)=>HV[a].tech-HV[b].tech).map(k=>{const H=HV[k],why=C.canHeavy(W,uid,v,k),cd=me.cd&&me.cd['hv_'+k]>Date.now()?me.cd['hv_'+k]:0,locked=(me.tech||0)<H.tech;return`<div class="hvcard${locked?' lock':''}"><b>${H.ic} ${H.n}</b><p>${HV_TXT[k](C.hvScale(H,g))}</p><p class="mu" style="font-size:12px">Tech ${H.tech} · ${esc(RANKS[H.rank][1])} · ${esc(C.heavyCostTxt(k))}${H.mun?` · ${num(H.mun)} munitions`:''} · one every ${H.cdH} h</p>${why?`<p class="mu" style="font-size:12px;margin:0 0 6px">${cd?`Ready in <b data-until="${cd}">${fmtT(cd-Date.now())}</b>`:esc(why)}</p>`:''}<button class="btn sm dng" data-act="heavy" data-a="${esc(v)}" data-b="${k}" ${why?'disabled':''}>${H.ic} ${({artillery:'Open fire',cruise:'Fire cruise missile',carpet:'Send the bombers',sub:'Launch torpedoes',cyber:'Launch cyber attack',bombard:'Bombard the coast',emp:'Fire EMP',drones:'Launch drones',hypersonic:'Fire hypersonic missile',blockade:'Blockade their ports',raid:'Send in special forces',orbital:'Order orbital strike'})[k]||'Fire ballistic missile'}</button></div>`}).join('')}</div></div>`}
function dirtyBox(v){const D=C.DIRTY,why=C.canDirty(W,uid,v);return`<div class="dirtybox"><b>☢ Dirty bomb</b><p>A missile with radioactive material: kills ~6% of their troops and 2% of their people, contaminates 10% of their food, and leaves a green radioactive cloud over a random province for ${D.h} hours. Costs ${money(D.cash)}, ${num(D.steel)} steel, ${num(D.oil)} oil, ${num(D.goods)} goods and ${num(D.mun)} munitions. Needs tech ${D.tech}. One every ${D.cdH} hours.</p>${why?`<p class="mu" style="font-size:12.5px;margin:0 0 8px">${esc(why)}</p>`:''}<button class="btn dirty-btn" data-act="dirty" data-a="${esc(v)}" ${why?'disabled':''}>☢ Drop a dirty bomb on ${esc(A[v].name)}</button></div>`}

 else if(fTab==='emblem'){body=`<div class="fchips">${FLAG_EMBLEMS.map(e=>chip(f.e===e,'fl-e',e,e==='none'?'<span class="mu" style="font-size:11px">None</span>':WPCore.flagSVG({l:'solid',c:['#2a3442'],e,ec:'#ffffff',es:3},36,24),FE_NAMES[e]||e)).join('')}</div><div class="mu fname">${esc(FE_NAMES[f.e]||f.e)}</div>`;

  case'fl-ep':if(a)f.ep=a;else delete f.ep;break;case'fl-es':f.es=+a;break;case'fl-ec':f.ec=b;break;case'fl-c':f.c[+a]=b;break;case'fl-slot':fSlot=+a;break;case'fl-swap':[f.c[0],f.c[1]]=[f.c[1],f.c[0]];break;

async function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>1.3e6&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=()=>rej(new Error('That file is not an image.'));img.src=url})}

 SND.siren(Math.ceil((1350+dur+12500)/1000)+10);/* wails for the whole flight and the blast, winding down on the detonation screen */const al=document.createElement('div');al.className='nkalert';al.innerHTML=`<span class="nkdot"></span><b>☢ ${fx.replay?'REPLAY · ':''}MISSILE LAUNCH DETECTED</b><span>${esc(fx.byName)} ${fx.retaliation?'has fired back at':'has launched a nuclear missile at'} ${esc(fx.toName)}</span><span class="nkph" id="nkPh">LAUNCH</span><button class="btn sm" data-nk="skip">Skip</button>`;document.body.appendChild(al);
 const phT=setInterval(()=>{const ph=GL.nukePhase(),el=$('nkPh');if(!el||!al.isConnected){clearInterval(phT);return}if(ph)el.textContent=ph.ph+(ph.left>0?' · impact in '+Math.ceil(ph.left/1000)+'s':'')},250);
 let finished=false;const finish=()=>{if(finished)return;finished=true;clearInterval(phT);al.remove();if(fx.intercepted)interceptFlash(fx);else{nukeFlash(fx,true);if(!fx.replay&&!fx.demo&&P[fx.h])GL.burn(fx.h,Date.now(),20)}setTimeout(()=>{const h=heldToasts.splice(0);nukeNext();h.slice(-1).forEach(t=>toast(t))},2500)};
 al.addEventListener('click',ev=>{if(ev.target.dataset.nk==='skip'){GL.stopMissile();finish()}});
 closeModal&&closeModal();if(page!=='world'){page='world';render()}
 const a=P[fx.from].c,b=P[fx.h].c,mid=d3.geoInterpolate(a,b)(.5),dist=d3.geoDistance(a,b);
 setTimeout(()=>{if(GL.coarse)GL.flyTo(mid,clamp(1.9-dist*.55,.85,2.2));else GL.flyTo(a,clamp(1.9-dist*.4,1.1,2));setTimeout(()=>{if(finished)return;GL.missile(a,b,dur,finish,fx.h,fx.intercepted)},1100)},250)}
function interceptFlash(fx){SND.stopSiren();const o=document.createElement('div');o.className='ntdone icpt';o.innerHTML=`<span class="ic">🛡</span><span><b>NUCLEAR MISSILE INTERCEPTED</b>${esc(fx.toName)}'s Golden Dome destroyed the missile ${esc(fx.byName)} fired at ${esc(fx.place||'')}. ${fx.to===uid?'Your nation is safe.':'No detonation.'}</span><button class="btn sm ghost" data-x="x" aria-label="Close">✕</button>`;o.addEventListener('click',ev=>{if(ev.target.closest('[data-x]'))o.remove()});document.body.appendChild(o);setTimeout(()=>{if(o.isConnected){o.classList.add('out');setTimeout(()=>o.remove(),400)}},12000)}
function nukeFlash(fx,sirenOn){try{const o=document.createElement('div');o.className='nkflash';o.innerHTML=`<div class="nkbox"><div class="nkic">☢</div><div class="nkt">${fx.replay?'REPLAY · ':''}NUCLEAR DETONATION</div><div class="nks">${esc(fx.byName)} ${fx.retaliation?'retaliated against':'struck'} ${esc(fx.toName)} at ${esc(fx.place)}.<br>Fallout is spreading. The world enters a nuclear winter.</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-act="nkclose">See ground zero</button><button class="btn" data-act="nkmute" style="background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.35);color:#fff">🔇 Silence siren</button></div></div>`;document.body.appendChild(o);if(!sirenOn)SND.siren(22);
 o.addEventListener('click',ev=>{if(ev.target.dataset.act==='nkmute'){SND.stopSiren();ev.target.remove();return}SND.stopSiren();o.remove();if(ev.target.dataset.act==='nkclose'&&P[fx.h]){if(page!=='world'){page='world';render()}setTimeout(()=>GL.flyTo(P[fx.h].c,2.4),350)}});setTimeout(()=>o.isConnected&&o.classList.add('fade'),12000);setTimeout(()=>o.remove(),14000)}catch(e){}}
// replays: /play?replay=<launch time> plays back a past launch from /api/nukes; /play?replay=demo&a=<nation>&b=<nation> shows a launch between two
// capitals. Both only animate on this screen; nothing happens in the game.
(()=>{const q=new URLSearchParams(location.search),rp=q.get('replay');if(rp==null)return;let tries=0;
 const ready=async()=>{if(!loaded||!Object.keys(A).length||typeof GL==='undefined'||!GL.missile){if(++tries<80)setTimeout(ready,400);return}
  let fx=null;if(rp==='demo'){const a=A[q.get('a')],b=A[q.get('b')];if(a&&b&&a.cap!=null&&b.cap!=null)fx={byName:a.name,toName:b.name,from:a.cap,h:b.cap,place:pname(b.cap),retaliation:false,demo:true}}
  else{try{const r=await WP.api('GET','/api/nukes');fx=(r.nukes||[]).find(x=>String(x.t)===rp)||null}catch(e){}}
  history.replaceState(null,'',location.pathname);if(!fx)return toast('That launch could not be found.');
  const o=document.createElement('div');o.className='nkflash';o.innerHTML=`<div class="nkbox"><div class="nkic">☢</div><div class="nkt">${fx.demo?'LAUNCH PREVIEW':'REPLAY'}</div><div class="nks">${esc(fx.byName)} → ${esc(fx.toName)} (${esc(fx.place||'')})${fx.t?'<br>'+new Date(fx.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}<br><span style="opacity:.75">Only you see this. Nothing happens in the game.</span></div><div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-x="go">▶ Play with sound</button><button class="btn" data-x="no" style="background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.35);color:#fff">Close</button></div></div>`;
  document.body.appendChild(o);o.addEventListener('click',ev=>{const x=ev.target.dataset.x;if(!x)return;o.remove();if(x==='go')nukeQueue({...fx,replay:true})})};
 setTimeout(ready,800)})();

window.addEventListener('wp-login',()=>{const host=document.getElementById('authGlobe');if(!host)return;refreshW();GL.st.scale=1.25;GL.attach(host,'bg');const spin=()=>{if(!host.isConnected)return;GL.st.rot=[GL.st.rot[0]+.08,-18,0];GL.redraw();requestAnimationFrame(spin)};spin()});
// ================= boot =================
refreshW();
(async()=>{renderSide();
 const lt=setTimeout(()=>{if(!loaded)$('main').innerHTML='<div class="wrap"><p class="mu">Still connecting… The world will load as soon as the server responds.</p></div>'},10000);
 try{[db,U]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
 if(!db){clearTimeout(lt);loaded=true;render();return}
 try{uid=await U.id()}catch(e){}
 const mi=WP.me();if(mi&&mi.admin&&mi.adminPath){const al=$('adminLink');al.href=mi.adminPath;al.style.display=''}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
 let gotN=false,gotC=false,hadMine=false;
 db.collection('nations').onSnapshot(s=>{N={};s.docs.forEach(d=>{if(d.exists)N[d.id]=d.data()});
  if(!gotN){gotN=true;clearTimeout(lt);loaded=true;heartbeat();refreshW();try{for(const b of (WP.extra&&WP.extra.burn)||[])GL.burn(b[0],b[1],b[2]);for(const fx of (WP.extra&&WP.extra.strikes)||[]){GL.strike(fx,true);if(fx.to===uid)HITS.push(fx)}for(const fx of (WP.extra&&WP.extra.ntests)||[])ntestQueue(fx);for(const fx of (WP.extra&&WP.extra.ntestPending)||[])ntWarn(fx)}catch(e){}setTimeout(function away_(){if(nukeBusy||document.querySelector('.nkflash'))return setTimeout(away_,3000);if(me&&$('mod').style.display!=='flex')awaySummary()},1500);if(me){page=location.hash==='#mail'?'mail':'overview';setTimeout(()=>{if(me&&P[me.cap]){GL.st.rot=[-P[me.cap].c[0],-P[me.cap].c[1],0];GL.st.scale=2;GL.redraw()}},50)}}
  if(N[uid])hadMine=true;else if(hadMine){hadMine=false;if(!X().fallen&&!CFG.fresh)toast('Your nation was reset by an administrator.')}
  refreshSoon();loadNames()},()=>{clearTimeout(lt);loaded=true;$('main').innerHTML='<div class="wrap"><p class="rd">Lost connection to the server. Reload the page to reconnect.</p></div>'});
 db.collection('chat').onSnapshot(s=>{CH={};s.docs.forEach(d=>{if(d.exists)CH[d.id]=d.data()});if(uid&&CH[uid]&&!gotC)myChat=(CH[uid].m||[]).slice();gotC=true;if(uid&&myChat.length&&CH[uid])CH[uid]={m:myChat};renderChat();if(page==='chat'||deskChatOpen())markChatSeen();else chatBadge();renderSide()},()=>{});
 db.collection('online').onSnapshot(s=>{ON={};s.docs.forEach(d=>{if(d.exists)ON[d.id]=d.data()});loadNames();renderOnline()},()=>{});
})();
let nameKey='';async function loadNames(){if(!U)return;const ids=[...new Set([...Object.keys(A),...Object.keys(ON),uid].filter(Boolean))];const k=ids.sort().join(',');if(k===nameKey)return;nameKey=k;try{const ps=await U.profiles(ids);for(const id of ids)names[id]=(ps&&ps[id]&&ps[id].name)||'';render();renderOnline()}catch(e){}}
