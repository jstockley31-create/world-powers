<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f151c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>World Powers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--ac2:#b8892f;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;
 --food:#8fbf5a;--oil:#d4a64a;--steel:#8ea4b8;--goods:#b48ce0;--r:8px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;width:100%}
#top>*,#app>*{min-width:0}
button,input,select{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:#3b4b5c;background:#1f2b39}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.pri:hover:not(:disabled){background:#e0b55a}
.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.ok:hover:not(:disabled){background:#23462e}
.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.dng:hover:not(:disabled){background:#46232a}
.btn.sm{padding:4px 9px;font-size:12px}.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}.btn.ghost:hover{color:var(--tx);background:var(--s3)}
input[type=text],input[type=number],input[type=password],input[type=email],input:not([type]),select{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac)}
a{color:var(--bl);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.ac{color:var(--ac)}.yl{color:var(--yl)}
.num{font-variant-numeric:tabular-nums}
/* top */
#top{display:flex;align-items:center;gap:18px;padding:0 16px;height:58px;background:var(--s1);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand .mark{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f6d93,#0f2539 70%);box-shadow:inset 0 0 0 1px #4c7ca5,0 0 12px #2b5a8040;position:relative;overflow:hidden}
.brand .mark:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 6px,#ffffff14 6px 7px)}
.brand b{display:block;letter-spacing:.22em;font-size:13px;font-weight:700}.brand small{display:block;color:var(--mu);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#natbox{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid var(--bd);min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006}
#natbox b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}#natbox small{display:block;color:var(--ac);font-size:11px;font-weight:500}
#kpis{display:flex;gap:4px;margin-left:auto;overflow:hidden}
.kpi{padding:4px 12px;border-left:1px solid var(--bd);min-width:92px}
.kpi span{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}.kpi span .ic{width:12px;height:12px}
.kpi b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.topr{display:flex;gap:6px;align-items:center}
/* timers strip */
#timers{display:flex;gap:6px;padding:6px 16px;background:#0c1117;border-bottom:1px solid var(--bd);overflow-x:auto;min-height:38px;align-items:center}
.tm{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;border:1px solid var(--bd2);background:var(--s2);font-size:12px;cursor:pointer;white-space:nowrap}
.tm b{font:500 11.5px var(--mono)}.tm.rdy{border-color:#2c5a39;background:#13241a;color:#b8f0c4}.tm.rdy b{color:var(--gn)}.tm:not(.rdy) b{color:var(--mu)}
.tm .ic{width:13px;height:13px}
.tm.dec{border-color:#5d4a1f;background:#241c0d;color:#f0d9a4}
/* layout */
#app{display:grid;grid-template-columns:212px 1fr;min-height:0}
#side{background:var(--s1);border-right:1px solid var(--bd);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#side .sec{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;margin:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#b7c2cd;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:13.5px}
.nav:hover{background:var(--s2);color:var(--tx)}.nav.on{background:var(--s3);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav .ic{width:17px;height:17px}.nav .bdg{margin-left:auto;background:var(--ac);color:#17120a;border-radius:10px;font-size:10.5px;font-weight:700;padding:0 6px}
.nav .bdg.g{background:#2c5a39;color:#b8f0c4}
#main{overflow-y:auto;padding:20px 22px 30px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}.wrap.enter{animation:pgin .18s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.wrap.enter,.confetti,.promo,.shake{animation:none!important}}
h1.pg{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}.pgsub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.panel>header h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#c5ced8;display:flex;align-items:center;gap:8px}
.panel>.bd{padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.st span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.st b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.st small{display:block;color:var(--mu);font-size:11.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .5s}
.res{display:inline-flex;align-items:center;gap:6px}.res .ic{width:15px;height:15px}
/* operations */
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.op{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.op.rdy{border-color:#2c4a36}
.op .h{display:flex;align-items:center;gap:10px}.op .h .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--ac)}
.op .h .ico .ic{width:18px;height:18px}.op .h b{font-size:14.5px;font-weight:600;display:block}.op .h small{color:var(--mu);font-size:11.5px}
.op .d{color:#aab5c0;font-size:13px;flex:1}
.op .cost{font-size:12px;color:var(--mu)}
.op .prog{height:3px;background:var(--bg);border-radius:2px;overflow:hidden}.op .prog i{display:block;height:100%;background:var(--bl)}
.op .btn{width:100%}.op .btn:disabled{background:var(--s3);border-color:var(--bd2);color:var(--mu);opacity:1}
/* decisions */
.dec{border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:var(--s2)}
.dec b{font-size:14.5px}.dec p{margin:3px 0 10px;color:#aab5c0}
.dec .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;margin-top:6px;background:var(--s1);border:1px solid var(--bd2);border-radius:6px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.dec .opt:hover{border-color:var(--ac)}.dec .opt span:first-child{font-weight:500}
.eff{display:inline-flex;gap:4px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.chk:last-child{border:0}
.chk .cb{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd2);display:grid;place-items:center;flex:none}.chk.done .cb{background:var(--gn);border-color:var(--gn);color:#06210f}.chk.done .cb .ic{width:12px;height:12px;stroke-width:3}
.chk.done span{color:var(--mu);text-decoration:line-through}
.log{max-height:340px;overflow-y:auto}.log div{padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:10px}.log div time{color:var(--mu2);font:11.5px var(--mono);flex:none;width:62px;padding-top:2px}
/* globe */
.gwrap{position:relative;background:radial-gradient(ellipse at 50% 45%,#0e1d2c 0%,#090d12 70%);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);touch-action:none}
.gwrap canvas{display:block;width:100%;height:100%;cursor:grab}.gwrap canvas.drag{cursor:grabbing}
.gctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.gctl button{width:34px;height:34px;padding:0;border-radius:6px;background:#0f151ccc;border:1px solid var(--bd2);display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.gctl button:hover{border-color:var(--ac)}
.glegend{position:absolute;left:12px;bottom:12px;background:#0f151ccc;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:11.5px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap;backdrop-filter:blur(4px)}
.glegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
#tip{position:fixed;pointer-events:none;background:#0b1118f2;border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;font-size:12.5px;z-index:40;display:none;max-width:260px;box-shadow:0 8px 24px #0008}
#tip b{display:block}
.pinfo h3{margin:0 0 2px;font-size:17px;font-weight:600}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span{color:var(--mu)}.pinfo .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13px}.pinfo .kv span{color:var(--mu)}
/* dock */
#dock{background:var(--s1);border-top:1px solid var(--bd);display:flex;flex-direction:column}
.dockh{display:flex;align-items:center;gap:12px;padding:7px 16px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.dockh .live{width:7px;height:7px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn)}
.dockh .sp{margin-left:auto}
.dockb{display:grid;grid-template-columns:1fr;height:150px}#onl{display:none!important}
#onlstrip{background:#070a0e;border-bottom:1px solid var(--bd);padding:7px 16px 8px;text-align:center;max-height:96px;overflow-y:auto}
#onlstrip .oh{color:#fff;font-weight:600;font-size:13.5px;margin-bottom:3px;letter-spacing:.01em}
#onlstrip .names{line-height:1.65}
#onlstrip a{display:inline-block;margin:0 8px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
#onlstrip a:hover{filter:brightness(1.3)}
#onlstrip a.on{font-weight:700}#onlstrip a.idle{font-style:italic;opacity:.55}#onlstrip a.ally{text-decoration:underline;text-underline-offset:3px}#onlstrip a.me{text-decoration:underline dotted;text-underline-offset:3px}
#onlstrip .legend{color:var(--mu2);font-size:11px;margin-top:2px}
#dock.min .dockb{display:none}
.chatcol{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--bd)}
#chat{flex:1;min-height:0;overflow-y:auto;padding:8px 16px;font-size:13px}
#chat .m{padding:2px 0;line-height:1.5;word-wrap:break-word}#chat .m time{color:var(--mu2);font:11px var(--mono);margin-right:8px}
#chat .m .who{font-weight:600;cursor:pointer;margin-right:6px}
#chat .m.n{color:#d8c79d}#chat .m.n .lbl{color:var(--ac);font-weight:600;margin-right:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#chat .m.sys{color:#f0d9a4;background:#241c0d;border-left:2px solid var(--ac);padding:4px 8px;margin:3px 0;border-radius:3px}
#chatin{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--bd)}#chatin input{flex:1}
#onl{overflow-y:auto;padding:8px 10px}
#onl .o{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:13px}#onl .o:hover{background:var(--s2)}
#onl .o small{margin-left:auto;color:var(--mu2);font-size:11px}#onl .o.idle{opacity:.5}
#onl .lbl2{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin:8px 8px 4px}
/* misc */
#mod{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:16px;backdrop-filter:blur(2px)}
#mod .panel{width:100%;max-width:500px;margin:auto;box-shadow:0 20px 60px #000c}#mod{overflow-y:auto;overscroll-behavior:contain;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202b;border:1px solid var(--bd2);border-left:3px solid var(--ac);padding:10px 16px;border-radius:6px;z-index:50;display:none;max-width:90vw;box-shadow:0 10px 30px #0009;font-size:13.5px}
.motd{background:#241c0d;border:1px solid #5d4a1f;color:#f0d9a4;border-radius:6px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatches button{width:30px;height:30px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}.swatches button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}.swatches button.used{opacity:.25}
.govs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gov{border:1px solid var(--bd2);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--s2);text-align:left}.gov.on{border-color:var(--ac);background:#1f1a10}.gov b{display:block;font-size:13.5px}.gov small{color:var(--mu);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field>label{font-size:12px;color:var(--mu);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
@media(max-width:1100px){.cols{grid-template-columns:1fr}.kpi:nth-child(n+5){display:none}}
@media(max-width:820px){
 body{grid-template-rows:auto auto 1fr}
 #top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px 12px}
 .brand{min-width:0}.brand>div{display:none}
 #natbox{border-left:0;padding-left:0;flex:1 1 0;overflow:hidden}#natbox>div{min-width:0;overflow:hidden}#natbox b{max-width:100%;display:block}
 .topr .btn span,.topr .btn{font-size:12px}#logoutBtn{padding:4px 6px}
 #kpis{display:flex;order:5;width:100%;margin:0;overflow-x:auto;gap:0;scrollbar-width:none}#kpis::-webkit-scrollbar{display:none}
 .kpi{min-width:auto;padding:2px 12px 2px 10px;flex:none}.kpi:first-child{border-left:0;padding-left:0}.kpi:nth-child(n+5){display:block}.kpi b{font-size:14px}
 #timers{padding:6px 12px;scrollbar-width:none}#timers::-webkit-scrollbar{display:none}
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr}
 #side{position:fixed;left:0;right:0;bottom:0;z-index:16;flex-direction:row;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);overflow-x:auto;scrollbar-width:none;background:#0d1319}
 #side::-webkit-scrollbar{display:none}#side .sec{display:none}
 .nav{flex-direction:column;gap:3px;width:auto;min-width:68px;padding:6px 4px;font-size:10.5px;position:relative;justify-content:center;flex:none}
 .nav.on{box-shadow:inset 0 2px 0 var(--ac);background:transparent;color:var(--ac)}.nav .ic{width:21px;height:21px}
 .nav .bdg{position:absolute;top:2px;right:10px;margin:0;font-size:9.5px;padding:0 5px}
 .nav.mob{display:flex!important}
 #main{padding:14px 12px calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
 h1.pg{font-size:19px}.pgsub{font-size:13px}
 .cols,.cols[style]{grid-template-columns:minmax(0,1fr)!important}.cols3{grid-template-columns:1fr}
 .panel>.bd{padding:12px;overflow-x:auto}.panel>header{padding:10px 12px}
 table{min-width:520px}.panel .stats table,.op table{min-width:0}
 th,td{padding:8px 8px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .govs{grid-template-columns:1fr}
 .gwrap{height:62vh!important}.glegend{display:none}
 #dock{display:none}
 body.chatopen #dock{display:flex;position:fixed;left:0;right:0;top:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;border-top:0}
 body.chatopen .dockb{grid-template-columns:1fr;flex:1;height:auto;min-height:0}body.chatopen #onlstrip{max-height:28vh}
 body.chatopen .chatcol{min-height:0;border-right:0}#dockBtn{display:none}
 #chatin input{font-size:16px}
 #toast{bottom:calc(80px + env(safe-area-inset-bottom))}
 input,select{font-size:16px}
 .dec .opt{flex-direction:column;align-items:flex-start}
}
.brand{text-decoration:none;color:inherit}
.ibtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--bd2);background:var(--s2);display:grid;place-items:center;cursor:pointer;color:#c5ced8}
.ibtn:hover{border-color:#3b4b5c;color:#fff}.ibtn .ic{width:18px;height:18px}
.ibtn .cnt{position:absolute;top:-5px;right:-5px;background:var(--rd);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 5px;min-width:17px;text-align:center;line-height:16px;display:none}
.ibtn .cnt.on{display:block}
#bellPanel{position:fixed;right:12px;top:62px;width:min(400px,calc(100vw - 24px));max-height:min(70vh,620px);overflow:auto;background:var(--s1);border:1px solid var(--bd2);border-radius:10px;box-shadow:0 20px 50px #000c;z-index:35;display:none}
#bellPanel.on{display:block}#bellPanel header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1)}

 $('bellPanel').innerHTML=`<header><b>Notifications</b><button class="btn sm ghost" data-act="bell">Close</button></header>${ns.slice(0,40).map(n=>`<div class="nt ${n.read?'':'un'}"><span class="k"></span><div style="flex:1">${esc(n.text)}</div><time>${ago(n.t)}</time></div>`).join('')||'<p class="mu" style="padding:14px;margin:0">No notifications yet.</p>'}
 <header style="position:static"><b>Settings</b></header><div style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">

 <button class="btn" data-act="sound">${I(SND.on?'sound':'mute')} Sound effects: ${SND.on?'on':'off'}</button></div>
 <div class="prefs">${Object.entries(NK).map(([k,l])=>`<label><input type="checkbox" data-pref="${k}" ${pr[k]!==false?'checked':''}> ${l}</label>`).join('')}</div>`}
async function toggleBell(){const p=$('bellPanel');const on=!p.classList.contains('on');p.classList.toggle('on',on);if(on){bellPanel();if((X().notes||[]).some(n=>!n.read)){try{await WP.api('POST','/api/notes/read',{})}catch(e){}(X().notes||[]).forEach(n=>n.read=true);renderBell()}}}
async function togglePush(){try{if(X().pushOn){const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(sub){await WP.api('POST','/api/push/unsubscribe',{endpoint:sub.endpoint});await sub.unsubscribe()}WP.extra.pushOn=false;toast('Notifications turned off.');bellPanel();return}
 const perm=await Notification.requestPermission();if(perm!=='granted')return toast('Notifications were blocked. You can allow them in your browser settings.');
 const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;const key=X().vapid;const raw=Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-key.length%4)%4)),c=>c.charCodeAt(0));
 const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw});await WP.api('POST','/api/push/subscribe',{sub:sub.toJSON()});WP.extra.pushOn=true;toast('Notifications are on.');bellPanel()}catch(e){toast('Could not turn on notifications: '+(e.message||e))}}

 case'mailview':mailState.view=a;mailState.sel=null;if(a==='compose'){mailState.subj='';mailState.body='';}render();break;

 case'maildel':{await WP.api('POST','/api/mail/delete',{id:a}).catch(()=>{});mailState.sel=null;mailState.list=null;render();break}

 case'report':{const who=a,kind=b;modal(`<header><h2>Report ${esc(names[who]||nm(who))}</h2><button class="btn sm ghost" data-act="close">Close</button></header><div class="bd"><p class="mu" style="margin-top:0">Reports go privately to the administrators.</p><div class="field"><label>What happened?</label><textarea id="repText" rows="4" maxlength="300" placeholder="e.g. harassment in chat, offensive name, cheating"></textarea></div><button class="btn pri" data-act="reportgo" data-a="${esc(who)}" data-b="${esc(kind)}">Send report</button></div>`);break}
 case'reportgo':{const sample=(CH[a]&&CH[a].m||[]).slice(0,3).map(m=>m.x).join(' | ');try{await WP.api('POST','/api/report',{id:a,kind:b,reason:$('repText').value,text:b==='chat'?sample:((mailState.list||[]).find(m=>m.id===mailState.sel)||{}).body||''});toast('Thank you — the administrators have been notified.');closeModal()}catch(err){toast(err.message)}break}
 case'bell':toggleMore(false);toggleBell();break;
 case'plan':closeModal();warPlanner(a,b!=null&&b!==''?+b:null);break;

 case'acpw':{const r=await cmd({password:$('acCur').value,next:$('acNew').value},false,'/api/account/password');if(r){toast('Password changed. Your other devices have been signed out.');$('acCur').value='';$('acNew').value=''}break}
