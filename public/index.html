<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Striphe's World Powers</title>
<style>
:root{--bg:#1d1f22;--pn:#2a2d31;--pn2:#34383d;--bd:#4a4f56;--tx:#e6e6e6;--mu:#9aa0a8;--ac:#d9b44a;--rd:#e25555;--gn:#5fd16b;--bl:#58a6ff;--sea:#16324a;--land:#3d4a3f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 Tahoma,Verdana,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:var(--tx)}
button{background:linear-gradient(#4a4f56,#3a3e44);border:1px solid #5a6068;border-radius:3px;padding:4px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
button.go{background:linear-gradient(#3e7c45,#2c5c32);border-color:#4f9a57}
button.war{background:linear-gradient(#8a3434,#642525);border-color:#a84444}
button.gold{background:linear-gradient(#b8922f,#8c6d1f);border-color:#d9b44a;color:#1a1a1a;font-weight:bold}
input,select{background:#202326;border:1px solid var(--bd);border-radius:3px;padding:4px 6px}
input[type=range]{padding:0}
a{color:var(--bl);cursor:pointer;text-decoration:none}
.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.ac{color:var(--ac)}
/* header */
#hdr{background:linear-gradient(#3b3f45,#26292d);border-bottom:2px solid #111;flex:none}
#top{display:flex;align-items:center;gap:14px;padding:5px 10px;flex-wrap:wrap}
#logo{font:bold 20px Georgia,serif;letter-spacing:1px;color:#c9ccd1;text-shadow:0 1px 0 #000;white-space:nowrap}
#logo small{display:block;font:10px Tahoma;color:var(--mu);letter-spacing:2px;text-align:right;margin-top:-3px}
#who{background:#c9ccd1;color:#1a1a1a;font-weight:bold;padding:3px 12px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);white-space:nowrap}
#cashTop{color:#fff;font-weight:bold;white-space:nowrap}
#logoutBtn{font-size:11px;padding:2px 8px}
#timers{margin-left:auto;font:bold 12px monospace;display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
#timers span{cursor:pointer}
#nav{display:flex;flex-wrap:wrap;background:#1a1c1f;padding:0 6px}
#nav button{background:none;border:0;border-right:1px solid #333;border-radius:0;padding:6px 14px;color:#ddd}
#nav button.on{background:#3a3e44;color:var(--ac)}
#nav button .bdg{background:var(--rd);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;margin-left:4px}
/* content */
#main{flex:1;overflow:auto;padding:10px}
.box{background:var(--pn);border:1px solid #111;border-radius:2px;margin:0 auto 10px;max-width:1100px}
.box>h3{margin:0;background:linear-gradient(#41464d,#33373c);padding:5px 10px;font-size:13px;border-bottom:1px solid #111;display:flex;justify-content:space-between;align-items:center}
.box>.in{padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:var(--pn2);border:1px solid #222;padding:6px 8px}
.stat span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.stat b{font-size:16px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.act{background:var(--pn2);border:1px solid #222;padding:8px;display:flex;flex-direction:column;gap:4px}
.act .t{font-weight:bold;font-size:14px;display:flex;justify-content:space-between}
.act .d{color:var(--mu);font-size:12px;flex:1}
.act button{width:100%;padding:7px}
.cd{font:bold 12px monospace}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 7px;border-bottom:1px solid #3a3e44;text-align:left}
th{background:#26292d;color:var(--mu);font-size:11px;text-transform:uppercase}
tr:nth-child(even) td{background:#2e3135}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--pn2);border-left:4px solid var(--ac);padding:8px 10px;margin-bottom:8px}
.card .opts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.card .opts button{text-align:left}
.chip{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;background:#202326;margin:1px}
.bar{height:8px;background:#202326;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--ac)}
.log div{padding:2px 0;border-bottom:1px dotted #3a3e44;font-size:12px}
/* map */
#mapwrap{position:relative;background:var(--sea);border:1px solid #111;height:min(62vh,560px);overflow:hidden;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map .hx{stroke:#0e1a12;stroke-width:.35;fill:var(--land)}
#map .hx.F{fill:#46613f}#map .hx.O{fill:#4f4a3a}#map .hx.M{fill:#4b4f55}#map .hx.I{fill:#4a4258}#map .hx.P{fill:#55603f}
#map .hx.own{stroke-width:.5}
#map .hx.me{stroke:#fff;stroke-width:.7}
#map .hx.sel{stroke:#ffe14d;stroke-width:1.6}
#map .hx.cand{stroke:#ffe14d;stroke-width:.9;stroke-dasharray:1.5 1}
#map .lbl{font-family:Tahoma,sans-serif;font-weight:bold;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:2.2px;text-anchor:middle;pointer-events:none}
#mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
#mapctl button{width:30px;padding:3px}
#legend{position:absolute;left:8px;bottom:8px;background:#000a;padding:4px 8px;font-size:11px;border-radius:3px}
/* bottom: online + chat */
#bot{flex:none;border-top:2px solid #111;background:#000}
#onl{background:#0b0b0b;padding:4px 10px;text-align:center;max-height:74px;overflow:auto}
#onl .h{color:#fff;font-weight:bold;font-size:14px;margin-bottom:2px}
#onl a{font-weight:bold;margin:0 7px;font-size:14px;white-space:nowrap;display:inline-block}
#onl a.idle{opacity:.55;font-weight:normal;font-style:italic}
#chatbar{display:flex;justify-content:space-between;align-items:center;background:#1c1c1c;padding:2px 8px;font-weight:bold;color:#fff}
#chatbar button{padding:0 8px;font-size:11px}
#chat{height:140px;overflow-y:auto;background:#c8ccd2;color:#111;padding:2px 6px;font:13px/1.35 Verdana,sans-serif}
#chat.min{display:none}
#chat .m{padding:1px 0}#chat .m:nth-child(odd){background:#bfc3c9}
#chat .ts{color:#333}#chat .nm{font-weight:bold}#chat .nt{color:#5a1a6a;font-weight:bold}
#chatin{display:flex;gap:4px;padding:4px;background:#111}
#chatin input{flex:1;background:#2b2b2b;border-color:#444}
/* modal / toast */
#mod{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#mod .box{max-width:460px;width:100%;margin:0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111;border:1px solid var(--ac);padding:8px 14px;border-radius:4px;z-index:30;display:none;max-width:90vw}
.flagpick button,.colpick button{padding:3px 6px;margin:2px;font-size:16px}
.colpick button{width:26px;height:26px;padding:0}
.colpick button.on,.flagpick button.on{outline:2px solid var(--ac)}
@media(max-width:700px){#chat{height:120px}#timers{margin-left:0;font-size:11px}#logo{font-size:16px}#nav button{padding:6px 9px}}
</style></head><body>
<div id="hdr">
 <div id="top"><div id="logo">WORLD POWERS<small>STRIPHE PRODUCTIONS</small></div><div id="who">Loading…</div><div id="cashTop"></div><div id="timers"></div><button id="logoutBtn" style="display:none">Log out</button></div>
 <div id="nav"></div>
</div>
<div id="main"><div class="box"><div class="in">Connecting to the world…</div></div></div>
<div id="bot">
 <div id="onl"></div>
 <div id="chatbar"><span>🌐 Global Chat</span><span><button data-act="chatmin">–</button></span></div>
 <div id="chat"></div>
 <form id="chatin"><input id="cin" maxlength="200" placeholder="Say something to the world…" autocomplete="off"><button class="go">Send</button></form>
</div>
<div id="mod"></div><div id="toast"></div>
<script>
(function(){
'use strict';
const st={me:null,users:{},cols:{nations:{},chat:{},online:{}},ready:false,subs:[]};
let resolveAuth;const authed=new Promise(r=>resolveAuth=r);
function snap(col){const m=st.cols[col]||{};const docs=Object.keys(m).map(id=>({id,exists:true,data:()=>m[id],metadata:{fromCache:false,hasPendingWrites:false}}));return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
const fireT={};function fire(col){clearTimeout(fireT[col]);fireT[col]=setTimeout(()=>{const s=snap(col);for(const x of st.subs.slice())if(x.col===col){try{x.cb(s)}catch(e){console.error(e)}}},50)}
function mkErr(status,msg){const code=status===401?'revoked':status===429?'resource_exhausted':(status>=400&&status<500)?'invalid_argument':'unavailable';return Object.assign(new Error(msg),{code,status})}
async function api(method,url,body){let r;try{r=await fetch(url,{method,credentials:'same-origin',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw mkErr(0,'Network error — check your connection.')}let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw mkErr(r.status,j.error||('Error '+r.status));return j}
const db={
 collection(col){return{onSnapshot(cb){const s={col,cb};st.subs.push(s);if(st.ready)setTimeout(()=>cb(snap(col)),0);return()=>{st.subs=st.subs.filter(x=>x!==s)}}}},
 doc(p){const[col,id]=p.split('/');return{
  async set(d){if(!st.cols[col])st.cols[col]={};const prev=st.cols[col][id];st.cols[col][id]=JSON.parse(JSON.stringify(d));fire(col);try{await api('PUT','/api/doc/'+col+'/'+encodeURIComponent(id),d)}catch(e){if(e.code==='invalid_argument'&&e.status===403){}if(prev===undefined)delete st.cols[col][id];else st.cols[col][id]=prev;fire(col);if(e.status===429)e.code='unavailable';throw e}},
  async delete(){await api('DELETE','/api/doc/'+col+'/'+encodeURIComponent(id));if(st.cols[col])delete st.cols[col][id];fire(col)}}}};
const user={id:async()=>st.me.id,isOwner:async()=>!!st.me.admin,canEdit:async()=>!!st.me.admin,can:async()=>true,me:async()=>({id:st.me.id,name:st.me.name}),profiles:async ids=>{const o={};for(const i of ids)o[i]={name:st.users[i]||''};return o}};
window.claude={use:async n=>{await authed;return n==='db'?db:n==='user'?user:null}};
window.WP={ban:id=>api('POST','/api/admin/ban',{id}),me:()=>st.me};
function connect(){const es=new EventSource('/api/stream');
 es.addEventListener('init',e=>{const d=JSON.parse(e.data);st.cols={nations:{},chat:{},online:{},...d.cols};st.users=d.users||{};st.ready=true;for(const c in st.cols)fire(c)});
 es.addEventListener('doc',e=>{const d=JSON.parse(e.data);if(!st.cols[d.col])st.cols[d.col]={};if(d.data==null)delete st.cols[d.col][d.id];else st.cols[d.col][d.id]=d.data;fire(d.col)});
 es.addEventListener('user',e=>{const d=JSON.parse(e.data);st.users[d.id]=d.name});
 es.onerror=async()=>{try{await api('GET','/api/me')}catch(x){if(x.status===401){es.close();location.reload()}}}}
// ---------- login screen ----------
const CSS=`#auth{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#2b3a4a,#111 70%);display:flex;align-items:center;justify-content:center;padding:14px;font:14px Tahoma,Verdana,sans-serif;color:#e6e6e6}
#auth .card{background:#2a2d31;border:1px solid #111;box-shadow:0 10px 40px #000a;width:100%;max-width:380px}
#auth h1{margin:0;padding:18px 20px 4px;font:bold 26px Georgia,serif;letter-spacing:1px;text-align:center;color:#d9b44a}
#auth .sub{text-align:center;color:#9aa0a8;font-size:12px;margin-bottom:12px}
#auth .tabs{display:flex}#auth .tabs button{flex:1;background:#1d1f22;border:0;border-bottom:2px solid transparent;padding:9px;color:#9aa0a8;cursor:pointer;font:inherit}
#auth .tabs button.on{color:#d9b44a;border-bottom-color:#d9b44a;background:#2a2d31}
#auth form{padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px}
#auth label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#9aa0a8}
#auth input{background:#1d1f22;border:1px solid #4a4f56;border-radius:3px;padding:8px;color:#fff;font:inherit}
#auth .go{background:linear-gradient(#3e7c45,#2c5c32);border:1px solid #4f9a57;color:#fff;border-radius:3px;padding:10px;font:bold 15px Tahoma,sans-serif;cursor:pointer}
#auth .err{color:#ff7a7a;min-height:1em;font-size:13px}#auth .fine{color:#9aa0a8;font-size:11px}`;
let mode='login';
function showLogin(){let el=document.getElementById('auth');if(!el){const s=document.createElement('style');s.textContent=CSS;document.head.appendChild(s);el=document.createElement('div');el.id='auth';document.body.appendChild(el)}
 el.innerHTML=`<div class="card"><h1>WORLD POWERS</h1><div class="sub">Rule a nation. Build an empire. Talk to the world.</div><div class="tabs"><button type="button" data-m="login" class="${mode==='login'?'on':''}">Log in</button><button type="button" data-m="signup" class="${mode==='signup'?'on':''}">Sign up</button></div>
 <form id="authf">${mode==='signup'?'<label>Ruler name (shown to other players)<input name="name" maxlength="20" autocomplete="nickname" required></label>':''}<label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password${mode==='signup'?' (8+ characters)':''}<input name="password" type="password" minlength="${mode==='signup'?8:1}" autocomplete="${mode==='signup'?'new-password':'current-password'}" required></label><div class="err" id="autherr"></div><button class="go">${mode==='signup'?'Create my account':'Log in'}</button>${mode==='signup'?'<div class="fine">One account per email address.</div>':'<div class="fine">Forgot your password? Ask the game admin to reset it.</div>'}</form></div>`;
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;showLogin()});
 el.querySelector('#authf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector('.go');btn.disabled=true;document.getElementById('autherr').textContent='';
  try{st.me=await api('POST','/api/'+mode,Object.fromEntries(f));go()}catch(x){document.getElementById('autherr').textContent=x.message;btn.disabled=false}};
 el.querySelector('input').focus()}
function go(){const el=document.getElementById('auth');if(el)el.remove();const lo=document.getElementById('logoutBtn');if(lo){lo.style.display='';lo.title='Logged in as '+st.me.name+' ('+st.me.email+')';lo.onclick=async()=>{try{await api('POST','/api/logout')}catch(e){}location.reload()}}connect();resolveAuth()}
async function start(){try{st.me=await api('GET','/api/me');go()}catch(e){showLogin()}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script>

function pickHex(h){if(!me){if(OWN[h])return toast('Taken — pick empty land.');if(!startOk(h))return toast('Too close to another nation. Pick land at least 3 provinces away.');const nm_=$('fn_name');if(nm_)pendingStart.name=nm_.value;pendingStart.hex=h;render();return}selHex=h;const hi=$('hexinfo');if(hi)hi.innerHTML=hexInfo();document.querySelectorAll('#map .hx.sel').forEach(p=>p.classList.remove('sel'));document.querySelector(`#map [data-h="${h}"]`)?.classList.add('sel')}
// ---------- modal / toast ----------
function modal(html){const m=$('mod');m.innerHTML=`<div class="box">${html}</div>`;m.style.display='flex'}
function closeModal(){$('mod').style.display='none';$('mod').innerHTML=''}
let askFn=null;function ask(t,fn){askFn=fn;modal(`<h3>Are you sure?</h3><div class="in"><p>${t}</p><button class="war" data-act="askyes">Yes, do it</button> <button data-act="close">Cancel</button></div>`)}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',3500)}
// ---------- events ----------
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.a,b=el.dataset.b;switch(el.dataset.act){
 case'page':page=a;if(page!=='map')selHex=selHex;closeModal();render();$('main').scrollTop=0;break;
 case'do':doAct(a,b);break;
 case'decide':decide(a,+b);break;
 case'gov':if(a===me.gov)break;ask(`Switch to ${GOV[a].n}? Stability −25 and approval −10 during the transition.`,()=>{me.gov=a;me.stability=clamp(me.stability-25,0,100);me.approval=clamp(me.approval-10,0,100);news(`${nm(uid)} is now a ${GOV[a].n}.`);save();render()});break;
 case'dip':DIP[a](b);break;
 case'aidgo':aidGo(a);break;
 case'buy':trade(a,+$('q_'+a).value,true);break;
 case'sell':trade(a,+$('q_'+a).value,false);break;
 case'attack':attack(+a,+$('atkX').value);break;
 case'selhex':page='map';selHex=+a;render();focusHex(+a);break;
 case'prof':profile(a);break;
 case'gohome':closeModal();page='map';selHex=null;render();focus(a);break;
 case'zoom':if(a==='in')zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1/1.4);else if(a==='out')zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1.4);else if(a==='home')focus(uid);else{vb={x:0,y:0,w:MAP.W,h:MAP.H};setVB()}break;
 case'fflag':pendingStart.flag=a;keepName();render();break;
 case'fcol':pendingStart.color=a;keepName();render();break;
 case'fgov':pendingStart.gov=a;keepName();render();break;
 case'found':found();break;
 case'kick':ask(`Remove ${esc(nm(a))} from the game? Their nation will be deleted.`,async()=>{try{await db.doc('nations/'+a).delete();toast('Removed.')}catch(err){toast('Could not remove.')}});break;
 case'ban':ask(`Ban the player who rules ${esc(nm(a))}? Their account is locked, their nation and chat are deleted, and they cannot log in again.`,async()=>{try{await WP.ban(a);toast('Banned.')}catch(err){toast(err.message||'Could not ban.')}});break;
 case'askyes':{const f=askFn;askFn=null;closeModal();f&&f();break}
 case'close':closeModal();break;
 case'chatmin':chatMin=!chatMin;$('chat').classList.toggle('min',chatMin);el.textContent=chatMin?'+':'–';break}});
function keepName(){const el=$('fn_name');if(el)pendingStart.name=el.value}
function focusHex(h){const x=HX[h].x,y=HX[h].y;vb.w=200;vb.h=100;vb.x=x-100;vb.y=y-50;setVB()}
$('mod').addEventListener('click',e=>{if(e.target.id==='mod')closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='taxr'&&me){me.tax=+e.target.value;$('taxv').textContent=me.tax+'%';save()}});
document.addEventListener('change',e=>{if(e.target.id==='taxr')render()});
$('chatin').addEventListener('submit',e=>{e.preventDefault();const i=$('cin');sendChat(i.value);i.value=''});
setInterval(()=>{if(me)updTimers()},1000);
setInterval(()=>{if(loaded)refresh()},30000);
setInterval(heartbeat,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){heartbeat();if(loaded)refresh()}});
// ---------- boot ----------
(async()=>{renderNav();
 const lt=setTimeout(()=>{if(!loaded){$('main').innerHTML=box('Still connecting…','The world can’t be reached yet. Check your connection; it will load by itself when it can.')}},10000);
 try{[db,U]=await Promise.all([window.claude?.use?claude.use('db'):null,window.claude?.use?claude.use('user'):null])}catch(e){}
 if(!db){clearTimeout(lt);loaded=true;render();return}
 try{uid=U?await U.id():null}catch(e){}
 if(!uid){clearTimeout(lt);loaded=true;canWrite=false;render();}
 try{isOwner=U?!!(await U.isOwner()):false}catch(e){}
 try{const c=U?await U.can('data.write'):null;if(c===false)canWrite=false}catch(e){}
 let gotN=false,gotC=false,hadMine=false;
 db.collection('nations').onSnapshot(s=>{N={};s.docs.forEach(d=>{if(d.exists)N[d.id]=d.data()});if(!s.metadata.fromCache&&!gotN){gotN=true;clearTimeout(lt);if(N[uid]){me=JSON.parse(JSON.stringify(N[uid]));for(const k of['cards','log','out','proc','trades','seen'])if(!Array.isArray(me[k]))me[k]=[];for(const k of['cd','hexes','rel'])if(!me[k]||typeof me[k]!=='object')me[k]={};me.res={food:0,oil:0,steel:0,goods:0,...(me.res||{})}}loaded=true;if(me)page='actions';heartbeat()}
  if(gotN){if(N[uid])hadMine=true;else if(me&&hadMine&&!saving&&!dirty){me=null;hadMine=false;toast('Your nation was removed by the game owner.')}refresh();loadNames()}},err=>{clearTimeout(lt);loaded=true;$('main').innerHTML=box('Connection lost','The game data stopped responding. Reload the page to reconnect.')});
 db.collection('chat').onSnapshot(s=>{CH={};s.docs.forEach(d=>{if(d.exists)CH[d.id]=d.data()});if(uid&&CH[uid]&&!gotC){myChat=(CH[uid].m||[]).slice()}gotC=true;if(uid&&myChat.length)CH[uid]={m:myChat};renderChat()},()=>{});
 db.collection('online').onSnapshot(s=>{ON={};s.docs.forEach(d=>{if(d.exists)ON[d.id]=d.data()});renderOnline()},()=>{});
})();
let nameKey='';async function loadNames(){if(!U)return;const ids=Object.keys(A);const k=ids.sort().join(',');if(k===nameKey)return;nameKey=k;try{const ps=await U.profiles(ids);for(const id of ids)names[id]=(ps&&ps[id]&&ps[id].name)||'';render();renderOnline()}catch(e){}}
