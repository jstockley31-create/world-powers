<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f151c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>World Powers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--ac2:#b8892f;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;
 --food:#8fbf5a;--oil:#d4a64a;--steel:#8ea4b8;--goods:#b48ce0;--r:8px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden;width:100%}
#top>*,#app>*{min-width:0}
button,input,select{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:#3b4b5c;background:#1f2b39}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.pri:hover:not(:disabled){background:#e0b55a}
.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.ok:hover:not(:disabled){background:#23462e}
.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.dng:hover:not(:disabled){background:#46232a}
.btn.sm{padding:4px 9px;font-size:12px}.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}.btn.ghost:hover{color:var(--tx);background:var(--s3)}
input[type=text],input[type=number],input[type=password],input[type=email],input:not([type]),select{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac)}
a{color:var(--bl);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.ac{color:var(--ac)}.yl{color:var(--yl)}
.num{font-variant-numeric:tabular-nums}
/* top */
#top{display:flex;align-items:center;gap:18px;padding:0 16px;height:58px;background:var(--s1);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand .mark{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3f6d93,#0f2539 70%);box-shadow:inset 0 0 0 1px #4c7ca5,0 0 12px #2b5a8040;position:relative;overflow:hidden}
.brand .mark:after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 6px,#ffffff14 6px 7px)}
.brand b{display:block;letter-spacing:.22em;font-size:13px;font-weight:700}.brand small{display:block;color:var(--mu);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#natbox{display:flex;align-items:center;gap:9px;padding-left:16px;border-left:1px solid var(--bd);min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:0 0 0 1px #0006}
#natbox b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}#natbox small{display:block;color:var(--ac);font-size:11px;font-weight:500}
#kpis{display:flex;gap:4px;margin-left:auto;overflow:hidden;min-width:0;flex:0 1 auto}.rkn{white-space:nowrap}
@media(min-width:821px) and (max-width:1500px){.kpi:nth-child(6){display:none}#natbox b{max-width:170px}.brand{min-width:150px}}
@media(min-width:821px) and (max-width:1340px){.kpi:nth-child(5){display:none}.kpi{min-width:84px;padding:4px 10px}}
@media(min-width:821px) and (max-width:1200px){.kpi:nth-child(3){display:none}#natbox b{max-width:140px}}
.kpi{padding:4px 12px;border-left:1px solid var(--bd);min-width:92px}
.kpi span{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}.kpi span .ic{width:12px;height:12px}
.kpi b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.topr{display:flex;gap:6px;align-items:center}
/* timers strip */
#timers{display:flex;gap:6px;padding:6px 16px;background:#0c1117;border-bottom:1px solid var(--bd);overflow-x:auto;min-height:38px;align-items:center}
@media(min-width:821px){#timers{flex-wrap:wrap;overflow-x:visible;row-gap:5px}}
@media(min-width:821px) and (max-width:1300px){.rkt th,.rkt td{padding:6px 6px;font-size:12.5px}}
.tm{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;border:1px solid var(--bd2);background:var(--s2);font-size:12px;cursor:pointer;white-space:nowrap}
.tm b{font:500 11.5px var(--mono)}.tm.rdy{border-color:#2c5a39;background:#13241a;color:#b8f0c4}.tm.rdy b{color:var(--gn)}.tm:not(.rdy) b{color:var(--mu)}
.tm .ic{width:13px;height:13px}
.tm.dec{border-color:#5d4a1f;background:#241c0d;color:#f0d9a4}
/* layout */
#app{display:grid;grid-template-columns:212px 1fr;min-height:0}
#side{background:var(--s1);border-right:1px solid var(--bd);padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#side .sec{color:var(--mu2);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;margin:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#b7c2cd;cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:13.5px}
.nav:hover{background:var(--s2);color:var(--tx)}.nav.on{background:var(--s3);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nav .ic{width:17px;height:17px}.nav .bdg{margin-left:auto;background:var(--ac);color:#17120a;border-radius:10px;font-size:10.5px;font-weight:700;padding:0 6px}
.nav .bdg.g{background:#2c5a39;color:#b8f0c4}
#main{overflow-y:auto;padding:20px 22px 30px;min-width:0}
.wrap{max-width:1240px;margin:0 auto}.wrap.enter{animation:pgin .18s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.wrap.enter,.confetti,.promo,.shake{animation:none!important}}
h1.pg{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}.pgsub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.panel>header h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#c5ced8;display:flex;align-items:center;gap:8px}
.panel>.bd{padding:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:10px 12px}
.st span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.st b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.st small{display:block;color:var(--mu);font-size:11.5px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .5s}
.res{display:inline-flex;align-items:center;gap:6px}.res .ic{width:15px;height:15px}
/* operations */
.ops{display:grid;grid-template-columns:repeat(auto-fill,minmax(355px,1fr));gap:6px}
.op{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px 10px;display:grid;grid-template-columns:30px minmax(0,1fr) 86px;align-items:center;gap:9px;position:relative;overflow:hidden}
.op.rdy{border-color:#2c4a36}
.op .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--ac)}.op .ico .ic{width:17px;height:17px}
.op .tx{min-width:0;line-height:1.35}.op .nm{display:flex;align-items:baseline;gap:8px}.op .nm b{font-size:14px;font-weight:600;white-space:nowrap}.op .nm small{color:var(--mu);font-size:11px;white-space:nowrap}
.op .ef{font-size:12.5px;margin-top:1px}.op .gn{color:#8fdca6}.op .cs{color:var(--mu)}
.op .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bg);overflow:hidden}.op .prog i{display:block;height:100%;background:var(--bl)}
.op .btn{width:100%;padding-left:6px;padding-right:6px;font-variant-numeric:tabular-nums}.op .btn:disabled{background:var(--s3);border-color:var(--bd2);color:var(--mu);opacity:1}
@media(max-width:820px){.ops{grid-template-columns:1fr}.op{grid-template-columns:28px minmax(0,1fr) 90px}.op .ico{width:28px;height:28px}}
.opc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.opc .h{display:flex;align-items:center;gap:10px}.opc .h .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--s3);color:var(--ac);flex:none}.opc .h .ico .ic{width:18px;height:18px}
.opc .h b{font-size:14.5px;font-weight:600;display:block}.opc .h small{color:var(--mu);font-size:11.5px}.opc .d{color:#aab5c0;font-size:13px;flex:1}.opc .btn{width:100%}
.qchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;max-width:230px}.qchips button{background:var(--s3);border:1px solid var(--bd2);color:#c5ced8;border-radius:5px;font:inherit;font-size:11px;padding:1px 6px;cursor:pointer}.qchips button:hover{border-color:var(--ac);color:#fff}
.qprev{font-size:11px;margin-top:3px;line-height:1.5}.qprev b{color:#c5ced8;font-weight:600}.qprev b.rd{color:var(--rd)}
.nkalert{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9998;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:rgba(40,6,4,.92);border:1px solid #ff5a3c;color:#ffd7cf;padding:10px 16px;border-radius:12px;box-shadow:0 0 40px rgba(255,60,30,.45);font-size:14px;max-width:calc(100vw - 24px);animation:nkpulse 1s ease-in-out infinite alternate}
.nkalert b{color:#fff;letter-spacing:.08em}.nkdot{width:10px;height:10px;border-radius:50%;background:#ff3b2f;box-shadow:0 0 10px #ff3b2f}@keyframes nkpulse{to{box-shadow:0 0 70px rgba(255,60,30,.75)}}
svg.flag{vertical-align:-2px;border-radius:2px;flex:none}h2 svg.flag{margin-right:8px;vertical-align:-4px}
.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}.law{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;background:var(--s2)}.law.on{border-color:#2c4a36;background:#0f1a13}.law b{font-size:13.5px}.law small{display:block;color:var(--mu);font-size:12px;line-height:1.4;margin-top:2px}.law .btn{flex:none}
.fdes{display:flex;gap:18px;flex-wrap:wrap}.fprev{text-align:center;min-width:160px}.fprev svg{border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.45)}.flab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:10px 0 5px}
.fchips{display:flex;flex-wrap:wrap;gap:5px}.fchips button{background:var(--s3);border:1px solid var(--bd2);border-radius:5px;padding:3px;cursor:pointer;line-height:0;min-width:38px;min-height:28px}.fchips button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.fsw{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}.fsw button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}.fsw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.mis{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.mis:last-of-type{border-bottom:0}.mis b{font-size:13.5px}.mbar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin:5px 0 3px}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#3fb950,#7ee2a0)}
.wons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.won{border:1px solid var(--bd);border-radius:8px;padding:10px 11px;background:var(--s2);display:flex;flex-direction:column;gap:3px}.won.own{border-color:#7a5a10;background:#1d1606}.won b{font-size:13.5px}.won small{font-size:12px;line-height:1.4}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.ach{border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--s2);opacity:.45;display:flex;flex-direction:column;gap:2px}.ach.got{opacity:1;border-color:#7a5a10;background:#1d1606}.ach span{font-size:18px}.ach b{font-size:12.5px}.ach small{font-size:11px;color:var(--mu);line-height:1.3}
.offr{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13.5px}.ofgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ofgrid label span{display:block;font-size:11.5px;color:var(--mu);margin-bottom:2px}.ofgrid input{width:100%}
@media(max-width:820px){.ofgrid{grid-template-columns:repeat(3,1fr)}.laws{grid-template-columns:1fr}}
.reqs{border-color:#7a5a10!important;box-shadow:0 0 0 1px rgba(212,166,74,.35),0 8px 30px rgba(212,166,74,.08)}.reqs>header{background:#1d1606}.reqs h2{color:#f0c35c}
.req{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.req:last-child{border-bottom:0}.req .ri{font-size:22px;flex:none}.req .rb{display:flex;gap:6px;flex:none}
@media(max-width:820px){.req{flex-wrap:wrap}.req .rb{width:100%}.req .rb .btn{flex:1}}
tr.hl td{background:#1a1508}tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--ac)}.dipcard.hl{border-color:#7a5a10;background:#1a1508}
.reqban{width:100%;text-align:left;cursor:pointer;border-color:#7a5a10!important;background:#1d1606!important;color:#ffd98a!important;font:inherit}.reqban:hover{border-color:var(--ac)!important}
.bdg.rq{background:#e5534b;color:#fff;animation:rqp 1.6s ease-in-out infinite}@keyframes rqp{50%{box-shadow:0 0 0 4px rgba(229,83,75,.25)}}
.nkflash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,250,220,.95),rgba(255,140,40,.55) 35%,rgba(40,8,0,.88) 75%);animation:nkf 1.6s ease-out;transition:opacity 2s}
.nkflash.fade{opacity:0}@keyframes nkf{0%{background:#fff}12%{background:#fff}100%{}}
.nkflash{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}.nkbox{text-align:center;color:#fff;max-width:560px;padding:26px 30px;text-shadow:0 2px 12px rgba(0,0,0,.6);background:rgba(25,6,0,.55);border:1px solid rgba(255,170,80,.35);border-radius:16px;box-shadow:0 0 80px rgba(255,120,30,.35)}.nkic{font-size:72px;line-height:1;color:#ffe066;animation:nkp 1.2s ease-in-out infinite alternate}@keyframes nkp{to{transform:scale(1.12);color:#ff7a1a}}
.nkt{font-size:28px;font-weight:800;letter-spacing:.12em;margin:10px 0}.nks{font-size:15px;line-height:1.5;margin-bottom:16px}
/* decisions */
.dec{border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:var(--s2)}
.dec b{font-size:14.5px}.dec p{margin:3px 0 10px;color:#aab5c0}
.dec .opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;margin-top:6px;background:var(--s1);border:1px solid var(--bd2);border-radius:6px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.dec .opt:hover{border-color:var(--ac)}.dec .opt span:first-child{font-weight:500}
.eff{display:inline-flex;gap:4px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.chk:last-child{border:0}
.chk .cb{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd2);display:grid;place-items:center;flex:none}.chk.done .cb{background:var(--gn);border-color:var(--gn);color:#06210f}.chk.done .cb .ic{width:12px;height:12px;stroke-width:3}
.chk.done span{color:var(--mu);text-decoration:line-through}
.log{max-height:340px;overflow-y:auto}.log div{padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:10px}.log div time{color:var(--mu2);font:11.5px var(--mono);flex:none;width:62px;padding-top:2px}
/* globe */
.gwrap{position:relative;background:radial-gradient(ellipse at 50% 45%,#0e1d2c 0%,#090d12 70%);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);touch-action:none}
.gwrap canvas{display:block;width:100%;height:100%;cursor:grab}.gwrap canvas.drag{cursor:grabbing}
.gctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.gctl button{width:34px;height:34px;padding:0;border-radius:6px;background:#0f151ccc;border:1px solid var(--bd2);display:grid;place-items:center;cursor:pointer;color:var(--tx)}
.gctl button:hover{border-color:var(--ac)}
.glegend{position:absolute;left:12px;bottom:12px;background:#0f151ccc;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:11.5px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap;backdrop-filter:blur(4px)}
.glegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
#tip{position:fixed;pointer-events:none;background:#0b1118f2;border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;font-size:12.5px;z-index:40;display:none;max-width:260px;box-shadow:0 8px 24px #0008}
#tip b{display:block}
.pinfo h3{margin:0 0 2px;font-size:17px;font-weight:600}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}.kv span{color:var(--mu)}.pinfo .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13px}.pinfo .kv span{color:var(--mu)}
/* dock */
#dock{background:var(--s1);border-top:1px solid var(--bd);display:flex;flex-direction:column}
.dockh{display:flex;align-items:center;gap:12px;padding:7px 16px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.dockh .live{width:7px;height:7px;border-radius:50%;background:var(--gn);box-shadow:0 0 8px var(--gn)}
.dockh .sp{margin-left:auto}
.dockb{display:grid;grid-template-columns:1fr;height:150px}#onl{display:none!important}
#onlstrip{background:#070a0e;border-bottom:1px solid var(--bd);padding:7px 16px 8px;text-align:center;max-height:96px;overflow-y:auto}

<script>
(function(){
'use strict';
const QS=new URLSearchParams(location.search);try{if(/^[A-Za-z0-9]{7}$/.test(QS.get('ref')||''))localStorage.setItem('wp_ref',QS.get('ref'))}catch(e){}
const getRef=()=>{try{return localStorage.getItem('wp_ref')||''}catch(e){return''}};
const st={me:null,users:{},cols:{nations:{},chat:{},online:{}},ready:false,subs:[]};
let resolveAuth;const authed=new Promise(r=>resolveAuth=r);
function snap(col){const m=st.cols[col]||{};const docs=Object.keys(m).map(id=>({id,exists:true,data:()=>m[id],metadata:{fromCache:false,hasPendingWrites:false}}));return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
const fireT={};function fire(col){clearTimeout(fireT[col]);fireT[col]=setTimeout(()=>{const s=snap(col);for(const x of st.subs.slice())if(x.col===col){try{x.cb(s)}catch(e){console.error(e)}}},50)}
function mkErr(status,msg){const code=status===401?'revoked':status===429?'unavailable':(status>=400&&status<500)?'invalid_argument':'unavailable';return Object.assign(new Error(msg),{code,status})}
async function api(method,url,body){if(st.me&&st.me.viewAs&&method!=='GET')throw mkErr(403,'Read-only view: you are viewing the game as '+st.me.name+'.');let r;try{r=await fetch(url,{method,credentials:'same-origin',headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw mkErr(0,'Network error — check your connection.')}let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw mkErr(r.status,j.error||('Error '+r.status));return j}
const db={

 doc(p){const[col,id]=p.split('/');return{
  async set(d){if(!st.cols[col])st.cols[col]={};const prev=st.cols[col][id];st.cols[col][id]=JSON.parse(JSON.stringify(d));fire(col);try{await api('PUT','/api/doc/'+col+'/'+encodeURIComponent(id),d)}catch(e){if(prev===undefined)delete st.cols[col][id];else st.cols[col][id]=prev;fire(col);throw e}},
  async delete(){await api('DELETE','/api/doc/'+col+'/'+encodeURIComponent(id));if(st.cols[col])delete st.cols[col][id];fire(col)}}}};
const user={id:async()=>st.me.id,isOwner:async()=>!!st.me.admin,canEdit:async()=>!!st.me.admin,can:async()=>true,me:async()=>({id:st.me.id,name:st.me.name}),profiles:async ids=>{const o={};for(const i of ids)o[i]={name:st.users[i]||''};return o}};
window.claude={use:async n=>{await authed;return n==='db'?db:n==='user'?user:null}};
window.WP={me:()=>st.me,api,extra:{}};
const emit=(n,d)=>window.dispatchEvent(new CustomEvent(n,{detail:d}));
const setCfg=c=>{if(c)window.dispatchEvent(new CustomEvent('wp-config',{detail:c}))};
function applyInit(d){st.cols={nations:{},chat:{},online:{},...d.cols};st.users=d.users||{};st.ready=true;setCfg(d.config);WP.extra={strikes:d.strikes||[],council:d.council,event:d.event,notes:d.notes||[],mailUnread:d.mailUnread||0,prefs:d.prefs||{},muted:d.muted||[],vapid:d.vapid,pushOn:d.pushOn,fallen:d.fallen||null,fallenList:d.fallenList||[],awaySince:d.awaySince||0};emit('wp-extra',WP.extra);for(const c in st.cols)fire(c)}
function connect(){const es=new EventSource('/api/stream');
 es.addEventListener('init',e=>applyInit(JSON.parse(e.data)));
 es.addEventListener('note',e=>{const n=JSON.parse(e.data);WP.extra.notes=[n,...(WP.extra.notes||[])].slice(0,100);emit('wp-note',n)});
 es.addEventListener('mail',e=>{WP.extra.mailUnread=JSON.parse(e.data).unread;emit('wp-mail',WP.extra.mailUnread)});
 es.addEventListener('fallen',e=>{WP.extra.fallen=JSON.parse(e.data);emit('wp-fallen',WP.extra.fallen)});
 es.addEventListener('fallenlist',e=>{WP.extra.fallenList=JSON.parse(e.data);emit('wp-extra',WP.extra)});
 es.addEventListener('council',e=>{WP.extra.council=JSON.parse(e.data);emit('wp-council',WP.extra.council)});
 es.addEventListener('event',e=>{WP.extra.event=JSON.parse(e.data);emit('wp-event',WP.extra.event)});
 es.addEventListener('doc',e=>{const d=JSON.parse(e.data);if(!st.cols[d.col])st.cols[d.col]={};if(d.data==null)delete st.cols[d.col][d.id];else st.cols[d.col][d.id]=d.data;fire(d.col)});
 es.addEventListener('user',e=>{const d=JSON.parse(e.data);if(d.name==null)delete st.users[d.id];else st.users[d.id]=d.name});
 es.addEventListener('config',e=>setCfg(JSON.parse(e.data)));
 es.addEventListener('reload',()=>setTimeout(()=>location.reload(),300+Math.random()*2500));
 es.addEventListener('nuke',e=>window.dispatchEvent(new CustomEvent('wp-nuke',{detail:JSON.parse(e.data)})));
 es.addEventListener('strike',e=>window.dispatchEvent(new CustomEvent('wp-strike',{detail:JSON.parse(e.data)})));
 es.addEventListener('announce',e=>window.dispatchEvent(new CustomEvent('wp-announce',{detail:JSON.parse(e.data)})));
 let downT=null,wasDown=false;const nb=(t,ok)=>{const b=document.getElementById('netbar');if(!b)return;b.querySelector('span').textContent=t;b.classList.toggle('ok',!!ok);b.classList.add('on')};
 es.onopen=()=>{clearTimeout(downT);downT=null;if(wasDown){wasDown=false;nb('Back online',true);setTimeout(()=>{const b=document.getElementById('netbar');if(b)b.classList.remove('on')},1800)}};
 es.onerror=async()=>{if(!downT&&!wasDown)downT=setTimeout(()=>{wasDown=true;nb('Reconnecting… the game is updating or your connection dropped')},2500);try{await api('GET','/api/me')}catch(x){if(x.status===401||x.status===403){es.close();location.href='/play'}}}}

@media(max-width:820px){#auth{grid-template-columns:1fr}#auth .left{display:none}}`;

function showLogin(){let el=document.getElementById('auth');const first=!el;

 go()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();

 // air-raid siren, modelled on a rotating mechanical town siren: slow spin-up, two rotor tones a minor third apart,

 let sir=null;const siren=(secs=22)=>{try{if(localStorage.getItem('wp_sound')==='0')return}catch(e){}try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();stopSiren();

async function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>1.3e6&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=()=>rej(new Error('That file is not an image.'));img.src=url})}

function chart(pts,label,fmt,col){if(pts.length<2)return`<div class="st"><span>${label}</span><p class="mu" style="font-size:12.5px;margin:6px 0 0">Collecting data — check back in an hour or two.</p></div>`;

 const P_=pts.map(p=>[((p.t-x0)/((x1-x0)||1))*(W_-4)+2,H_-6-((p.y-y0)/dy)*(H_-16)]),d=P_.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const ch=ys[0]?(ys[ys.length-1]/ys[0]-1)*100:0;
 return`<div class="st"><span>${label} <span class="${ch>=0?'gn':'rd'}" style="text-transform:none;letter-spacing:0">${ch>=0?'▲':'▼'} ${Math.abs(ch).toFixed(1)}%</span></span><b>${fmt(ys[ys.length-1])}</b><svg viewBox="0 0 ${W_} ${H_}" style="width:100%;height:90px;display:block;margin-top:6px" preserveAspectRatio="none"><path d="${d} L${W_-2} ${H_} L2 ${H_} Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><small>${fmt(y0)} – ${fmt(y1)} over ${Math.round((x1-x0)/HOUR)} hours</small></div>`}

 <div class="cols"><div>${panel('Budget',`<p class="mu" style="margin-top:0;font-size:13px">Spending is paid from the treasury every 10 minutes. Health raises population growth and approval; education raises GDP and research; infrastructure raises GDP and lowers unemployment; the military share pays upkeep and morale.</p>
 ${sl('spend','Total spending (% GDP)',5,40)}<div style="height:8px"></div>${sl('mil','Military',0,100)}${sl('health','Health',0,100)}${sl('edu','Education',0,100)}${sl('infra','Infrastructure',0,100)}
 <p class="mu" style="font-size:12.5px" id="bsum">${budgetSum(b)}</p><div class="row" style="display:flex;gap:8px"><button class="btn pri" data-act="budget">Approve budget</button><button class="btn" data-act="budgetreset">Reset</button></div>`,'','bank')}</div>
 <div>${panel('Government bonds',`<p class="mu" style="margin-top:0;font-size:13px">Borrow by issuing bonds. Interest is charged every 10 minutes and rises as debt grows. Above 200% of GDP — or if the treasury falls deep into the red — your nation <b>defaults</b>: debt is written down, but the economy crashes and lenders refuse you for 48 hours.</p>

 ${panel('World market',`<table class="mkt"><thead><tr><th>Commodity</th><th class="r">Stockpile</th><th class="r">World price</th><th class="r">Import at</th><th class="r">Export at</th><th>Quantity</th><th></th></tr></thead><tbody>${Object.keys(RES).map(r=>{const p=pr[r],ch=p/RES[r].p-1;return`<tr><td class="mk-n">${resI(r)} ${RES[r].n}</td><td class="r num" data-l="Stockpile">${num(n.res[r])}</td><td class="r num" data-l="World price">${money(p)} <span class="${ch>=0?'gn':'rd'}" style="font-size:11.5px">${ch>=0?'▲':'▼'} ${Math.abs(ch*100).toFixed(0)}%</span></td><td class="r num" data-l="Import at">${money(p*s.buy)}</td><td class="r num" data-l="Export at">${money(p*s.sell)}</td><td class="mk-q"><input id="q_${r}" data-qr="${r}" type="number" min="1" value="50" style="width:96px"><div class="qchips">${[[50,'50'],[250,'250'],[1000,'1K'],[5000,'5K']].map(([v,l])=>`<button data-act="qset" data-a="${r}" data-b="${v}">${l}</button>`).join('')}<button data-act="qset" data-a="${r}" data-b="max" title="The most you can import at a fair price, keeping 15% of your treasury">Max buy</button><button data-act="qset" data-a="${r}" data-b="all" title="The most you can export before the price drops a lot">Max sell</button></div><div class="qprev mu" id="qp_${r}"></div></td><td class="r mk-b" style="white-space:nowrap"><button class="btn sm ok" data-act="buy" data-a="${r}"${isRogue(uid)?' disabled title="Embargoed: rogue state"':''}>Import</button> <button class="btn sm" data-act="sell" data-a="${r}"${isRogue(uid)?' disabled title="Embargoed: rogue state"':''}>Export</button></td></tr>`}).join('')}</tbody></table><p class="mu" style="margin:10px 0 0;font-size:12.5px">Prices move with what every nation buys and sells over the past six hours, and with world events.</p>`,'','chart')}

 case'launch':{const v=a,t=A[v];if(!t)break;const opts=hexesOf(v).map(h=>`<option value="${h}" ${h==t.cap?'selected':''}>${esc(pname(h))}${h==t.cap?' (capital)':''}</option>`).join('');ask(`☢ Launch a nuclear strike on ${esc(t.name)}?`,`There is no undo. 25% of ${esc(t.name)}'s people and half its army will die, its GDP falls 40% and its taxes stop for ${C.WARHEAD.nukedH} hours. Fallout will hit every nation within ${num(C.WARHEAD.km)} km — possibly your own — and the whole world enters a nuclear winter. You will be a rogue state for 72 hours, your allies will leave you${C.warheadReady(W,t)?`, and <b>${esc(t.name)} has an armed warhead that will fire back at your capital</b>`:''}.<br><br><label class="mu" style="font-size:13px">Target province</label><br><select id="nkH" style="width:100%;margin-top:4px">${opts}</select>`,'☢ LAUNCH',()=>{});const sel=()=>$('nkH')&&$('nkH').value;askFn=null;const yes=document.querySelector('[data-act=askyes]');if(yes){yes.dataset.act='launchgo';yes.dataset.a=v}break}

 case'mention':{closeModal();if(isMob()){page='chat';render();renderChat(true)}const i=$('cin');i.value=(i.value?i.value.trim()+' ':'')+'@'+names[a]+' ';i.focus();break}
 case'rkmetric':rkMetric=a;render();break;case'rkrange':rkRange=+a;render();break;case'rkfilt':rkFilter=a;render();break;case'rkfocus':rkFocus=rkFocus===a?null:a;render();break;

 case'nclear':WP.extra.notes=[];renderBell();bellPanel();WP.api('POST','/api/notes/clear',{}).catch(()=>{});break;

 el.addEventListener('click',ev=>{const k=ev.target.closest('[data-sk]');if(!k)return;el.remove();if(k.dataset.sk==='show'&&P[fx.h]){if(page!=='world'){page='world';render()}setTimeout(()=>GL.flyTo(P[fx.h].c,Math.max(GL.st.scale,1.8)),page==='world'?0:350)}});
 document.body.appendChild(el);setTimeout(()=>{if(el.isConnected){el.classList.add('out');setTimeout(()=>el.remove(),400)}},8000)}
// a launch plays out for everyone online: siren, a launch alert, the missile flying across the globe, the impact, then the detonation screen
function nukeQueue(fx){nukeQ.push(fx);if(!nukeBusy)nukeNext()}
function nukeNext(){const fx=nukeQ.shift();if(!fx){nukeBusy=false;return}nukeBusy=true;
 if(fx.from==null||!P[fx.from]||!P[fx.h]){nukeFlash(fx);setTimeout(nukeNext,3000);return}
 SND.siren(26);const al=document.createElement('div');al.className='nkalert';al.innerHTML=`<span class="nkdot"></span><b>☢ ${fx.replay?'REPLAY · ':''}MISSILE LAUNCH DETECTED</b><span>${esc(fx.byName)} ${fx.retaliation?'has fired back at':'has launched a nuclear missile at'} ${esc(fx.toName)}</span><button class="btn sm" data-nk="skip">Skip</button>`;document.body.appendChild(al);
 let finished=false;const finish=()=>{if(finished)return;finished=true;al.remove();nukeFlash(fx,true);setTimeout(()=>{const h=heldToasts.splice(0);nukeNext();h.slice(-1).forEach(t=>toast(t))},2500)};

 closeModal&&closeModal();if(page!=='world'){page='world';render()}
 const a=P[fx.from].c,b=P[fx.h].c,mid=d3.geoInterpolate(a,b)(.5),dist=d3.geoDistance(a,b);
 setTimeout(()=>{GL.flyTo(mid,clamp(1.9-dist*.55,.85,2.2));setTimeout(()=>{if(finished)return;GL.missile(a,b,clamp(3500+dist*1400,3500,7000),finish,fx.h)},1000)},250)}
function nukeFlash(fx,sirenOn){try{const o=document.createElement('div');o.className='nkflash';o.innerHTML=`<div class="nkbox"><div class="nkic">☢</div><div class="nkt">${fx.replay?'REPLAY · ':''}NUCLEAR DETONATION</div><div class="nks">${esc(fx.byName)} ${fx.retaliation?'retaliated against':'struck'} ${esc(fx.toName)} at ${esc(fx.place)}.<br>Fallout is spreading. The world enters a nuclear winter.</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-act="nkclose">See ground zero</button><button class="btn" data-act="nkmute" style="background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.35);color:#fff">🔇 Silence siren</button></div></div>`;document.body.appendChild(o);if(!sirenOn)SND.siren(22);
 o.addEventListener('click',ev=>{if(ev.target.dataset.act==='nkmute'){SND.stopSiren();ev.target.remove();return}SND.stopSiren();o.remove();if(ev.target.dataset.act==='nkclose'&&P[fx.h]){if(page!=='world'){page='world';render()}setTimeout(()=>GL.flyTo(P[fx.h].c,2.4),350)}});setTimeout(()=>o.isConnected&&o.classList.add('fade'),12000);setTimeout(()=>o.remove(),14000)}catch(e){}}
// replays: /play?replay=<launch time> plays back a past launch from /api/nukes; /play?replay=demo&a=<nation>&b=<nation> shows a launch between two
// capitals. Both only animate on this screen; nothing happens in the game.
(()=>{const q=new URLSearchParams(location.search),rp=q.get('replay');if(rp==null)return;let tries=0;
 const ready=async()=>{if(!loaded||!Object.keys(A).length||typeof GL==='undefined'||!GL.missile){if(++tries<80)setTimeout(ready,400);return}
  let fx=null;if(rp==='demo'){const a=A[q.get('a')],b=A[q.get('b')];if(a&&b&&a.cap!=null&&b.cap!=null)fx={byName:a.name,toName:b.name,from:a.cap,h:b.cap,place:pname(b.cap),retaliation:false,demo:true}}
  else{try{const r=await WP.api('GET','/api/nukes');fx=(r.nukes||[]).find(x=>String(x.t)===rp)||null}catch(e){}}
  history.replaceState(null,'',location.pathname);if(!fx)return toast('That launch could not be found.');
  const o=document.createElement('div');o.className='nkflash';o.innerHTML=`<div class="nkbox"><div class="nkic">☢</div><div class="nkt">${fx.demo?'LAUNCH PREVIEW':'REPLAY'}</div><div class="nks">${esc(fx.byName)} → ${esc(fx.toName)} (${esc(fx.place||'')})${fx.t?'<br>'+new Date(fx.t).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}<br><span style="opacity:.75">Only you see this. Nothing happens in the game.</span></div><div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-x="go">▶ Play with sound</button><button class="btn" data-x="no" style="background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.35);color:#fff">Close</button></div></div>`;
  document.body.appendChild(o);o.addEventListener('click',ev=>{const x=ev.target.dataset.x;if(!x)return;o.remove();if(x==='go')nukeQueue({...fx,replay:true})})};
 setTimeout(ready,800)})();
