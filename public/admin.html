<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Powers — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bl);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#3b4b5c}.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.sm{padding:4px 9px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}input:focus,textarea:focus{border-color:var(--ac)}
header.top{display:flex;align-items:center;gap:8px 16px;padding:8px 22px;min-height:58px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header.top b{letter-spacing:.22em;font-size:13px}header.top .tag{margin-left:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-left:24px;min-width:0;flex:0 1 auto}.tabs button{white-space:nowrap}.top>.btn,#upd{flex:none}@media(max-width:1300px){#upd{display:none}}.tabs button{background:none;border:0;padding:8px 14px;border-radius:6px;color:var(--mu);cursor:pointer;font-weight:500}.tabs button.on{background:var(--s3);color:var(--tx)}.tabs .n{background:var(--rd);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;margin-left:5px;font-weight:700}
.sp{margin-left:auto}.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.yl{color:var(--yl)}.ac{color:var(--ac)}
main{max-width:1300px;margin:0 auto;padding:22px}
h1{font-size:21px;margin:0 0 4px;font-weight:600}.sub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.panel>header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:8px}.panel>header h2{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:#c5ced8}
.panel>.bd{padding:16px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px 16px}
.card span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.card b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}.card small{color:var(--mu);font-size:12px}
.card.ok{border-left:3px solid var(--gn)}.card.warn{border-left:3px solid var(--yl)}.card.bad{border-left:3px solid var(--rd)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr{cursor:default}tbody tr.click{cursor:pointer}tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cols>*{min-width:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mono{font:12px var(--mono)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--s1);border-left:1px solid var(--bd2);box-shadow:-20px 0 60px #000a;z-index:20;overflow-y:auto;transform:translateX(105%);transition:transform .2s}
#drawer.open{transform:none}#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1);z-index:2}#drawer .db{padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202b;border:1px solid var(--bd2);border-left:3px solid var(--ac);padding:10px 16px;border-radius:6px;z-index:50;display:none}
#gate{max-width:420px;margin:15vh auto;text-align:center}
.log div{padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:12px}.log time{color:var(--mu2);font:11.5px var(--mono);width:120px;flex:none}
@media(max-width:900px){.cols{grid-template-columns:1fr}.tabs{margin-left:0;max-width:100%}header.top{flex-wrap:wrap;height:auto;padding:10px}}
.kv{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}.kv span{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}.kv b{font-size:17px}
</style></head><body>
<header class="top"><b>WORLD POWERS</b><span class="tag y">ADMIN</span><nav class="tabs" id="tabs"></nav><span class="sp mu" id="upd"></span><a class="btn sm" href="/">Back to game</a><meta name="robots" content="noindex"></header>
<main id="main"><p class="mu">Loading…</p></main>
<aside id="drawer"></aside><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':Math.round(v).toLocaleString('en-US');
const money=v=>v==null?'—':(v<0?'−$':'$')+Math.round(Math.abs(v)).toLocaleString('en-US');
const ago=t=>{if(!t)return'never';const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const dur=ms=>{const s=ms/1e3;return s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'};
const bytes=b=>b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB';
const when=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const RANKS=['Chieftain','Elder','Mayor','Governor','Senator','Prime Minister','President','Sovereign','Emperor','Supreme Leader','World Power'];
let D=null,tab='dash',q='',sel=null,dirtyForm=false;
async function api(method,url,body){const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Error '+r.status),{status:r.status});return j}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}
async function load(){try{D=await api('GET','/api/admin/overview');$('upd').textContent='Updated '+new Date().toLocaleTimeString();render()}catch(e){if(e.status===401||e.status===403){$('tabs').innerHTML='';$('main').innerHTML=`<div id="gate"><h1>Admins only</h1><p class="mu">${e.status===401?'Sign in to the game with an admin account first.':'Your account does not have admin access.'}</p><a class="btn pri" href="/">Go to the game</a></div>`;return}$('upd').innerHTML='<span class="rd">Connection problem</span>'}}
const TABS=[['dash','Dashboard'],['war','War room'],['players','Players'],['cheat','Cheat watch'],['stats','Analytics'],['mod','Moderation'],['boss','⚠ Rising Power'],['crisis','🌍 World events'],['fin','💵 Money'],['polls','📋 Polls'],['seasons','🏆 Seasons'],['casino','🎰 Casino'],['bugs','Bugs'],['ideas','Ideas'],['world','World'],['settings','Game settings'],['log','Activity log']];
function render(){const fc=D.flags.filter(f=>Date.now()-f.t<864e5).length;$('tabs').innerHTML=TABS.map(([k,t])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${t}${k==='cheat'&&fc?`<span class="n">${fc}</span>`:''}${k==='mod'&&D.reports.filter(r=>!r.done).length?`<span class="n">${D.reports.filter(r=>!r.done).length}</span>`:''}${k==='bugs'&&(D.bugs||[]).filter(b=>!b.done).length?`<span class="n">${D.bugs.filter(b=>!b.done).length}</span>`:''}${k==='ideas'&&(D.ideas||[]).filter(b=>!b.done).length?`<span class="n">${D.ideas.filter(b=>!b.done).length}</span>`:''}</button>`).join('');
 const a=document.activeElement;if(a&&$('main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(dirtyForm&&(tab==='settings'||tab==='boss'||tab==='crisis'||tab==='fin'||tab==='seasons'))return;
 const keep={};$('main').querySelectorAll('select[id]:not([id^=c_]):not([id^=fn_])').forEach(x=>keep[x.id]=x.value); // the 10-second refresh keeps choices you've made
 $('main').innerHTML=({dash,war,players,cheat,stats,mod,boss,crisis,fin:finTab,polls:pollsTab,seasons:seasTab,casino:casTab,bugs,ideas,world,settings,log})[tab]();
 for(const [k,v] of Object.entries(keep)){const x=$(k);if(x&&[...x.options].some(o=>o.value===v))x.value=v}}
// Polls: questions sent to every player (each sees a pop-up once); results update here
let POLLS=null,POLLN=0,pollsAt=0,pdraft={title:'',intro:'',hours:'0',qs:[{q:'',opts:'',multi:false,other:false}]},pOpen={};
async function pollsLoad(){pollsAt=Date.now();try{const j=await api('POST','/api/admin/poll',{op:'list'});POLLS=j.polls;POLLN=j.players;if(tab==='polls')render()}catch(e){toast(e.message)}}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function pollsTab(){if(!POLLS||Date.now()-pollsAt>8000)pollsLoad();const L='ABCDEFGH';
 const qb=pdraft.qs.map((Q,i)=>`<div style="border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Question ${i+1}</b>${pdraft.qs.length>1?`<button class="btn" data-act="pdel" data-id="${i}">Remove</button>`:''}</div>
  <input id="pd_q_${i}" style="width:100%" maxlength="300" placeholder="Would you rather have…" value="${esc(Q.q)}">
  <label class="mu" style="display:block;font-size:12px;margin:8px 0 4px">Answers, one per line (they show as A, B, C, D…)</label><textarea id="pd_o_${i}" rows="4" style="width:100%" placeholder="More nations to fight
More trade options
Bigger world events
New weapons">${esc(Q.opts)}</textarea>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px"><label><input type="checkbox" id="pd_m_${i}" ${Q.multi?'checked':''}> Players can pick more than one</label><label><input type="checkbox" id="pd_w_${i}" ${Q.other?'checked':''}> Let players write their own answer</label></div></div>`).join('');
 const form=panel('New poll',`<div style="display:grid;gap:8px"><input id="pd_title" maxlength="120" placeholder="Title, e.g. Help choose the next update" value="${esc(pdraft.title)}">
  <textarea id="pd_intro" rows="2" maxlength="600" placeholder="Optional message to players">${esc(pdraft.intro)}</textarea>
  <label class="mu" style="font-size:12px">Open for <select id="pd_hours">${[['0','Until I close it'],['24','24 hours'],['72','3 days'],['168','7 days']].map(([v,l])=>`<option value="${v}" ${pdraft.hours===v?'selected':''}>${l}</option>`).join('')}</select></label>
  ${qb}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="padd" ${pdraft.qs.length>=10?'disabled':''}>+ Add another question</button><button class="btn pri" data-act="psend">Send to all players</button></div>
  <p class="mu" style="font-size:12px;margin:0">Every player sees it as a pop-up once (online players right away, others when they next play). They can answer or skip.</p></div>`);
 const list=(POLLS||[]).map(q=>{const ans=Object.values(q.answers||{}),n=ans.length,sk=Object.keys(q.skips||{}).length,open=q.active&&(!q.ends||q.ends>Date.now());
  const qs=q.questions.map((Q,i)=>{const cnt=Q.opts.map((_,j)=>ans.filter(a=>a.a[i]&&a.a[i].pick.includes(j)).length),max=Math.max(1,...cnt),writ=ans.filter(a=>a.a[i]&&a.a[i].other).map(a=>[a.name||a.nation,a.a[i].other]);
   return`<div style="margin:10px 0"><b>${q.questions.length>1?`${i+1}. `:''}${esc(Q.q)}</b>${Q.multi?' <span class="mu">(pick any)</span>':''}${Q.opts.map((o,j)=>`<div style="display:grid;grid-template-columns:22px minmax(0,1fr) 90px;gap:8px;align-items:center;margin-top:5px;font-size:13px"><b>${L[j]}</b><div><div>${esc(o)}</div><div style="height:6px;border-radius:3px;background:var(--s3);margin-top:3px"><div style="height:6px;border-radius:3px;background:${cnt[j]===max&&cnt[j]?'var(--ac)':'#5b7fa6'};width:${pct(cnt[j],n)}%"></div></div></div><span style="text-align:right">${cnt[j]} · ${pct(cnt[j],n)}%</span></div>`).join('')}
   ${writ.length?`<details style="margin-top:6px"><summary class="mu" style="cursor:pointer;font-size:13px">Written answers (${writ.length})</summary>${writ.map(([w,t])=>`<div style="font-size:13px;margin:4px 0"><b>${esc(w)}:</b> ${esc(t)}</div>`).join('')}</details>`:''}</div>`}).join('');
  const rows=Object.values(q.answers||{}).sort((a,b)=>b.t-a.t).map(a=>`<tr><td>${esc(a.name)}${a.nation?` <span class="mu">(${esc(a.nation)})</span>`:''}</td>${q.questions.map((Q,i)=>`<td>${(a.a[i]?a.a[i].pick.map(j=>L[j]).join(', '):'')}${a.a[i]&&a.a[i].other?` <i>“${esc(a.a[i].other)}”</i>`:''}</td>`).join('')}<td class="mu" style="white-space:nowrap">${new Date(a.t).toLocaleString()}</td></tr>`).join('');
  return panel(`${esc(q.title)} ${open?'<span class="gn">· open</span>':'<span class="mu">· closed</span>'}`,`<div class="mu" style="font-size:13px">Sent ${new Date(q.t).toLocaleString()} by ${esc(q.by)}${q.ends?` · ${q.ends>Date.now()?'closes':'closed'} ${new Date(q.ends).toLocaleString()}`:''} · <b style="color:var(--tx)">${n}</b> answered of ${POLLN} players · ${sk} skipped</div>${q.intro?`<p class="mu" style="font-size:13px">${esc(q.intro)}</p>`:''}${qs}
   ${n?`<details ${pOpen[q.id]?'open':''} data-pd="${q.id}"><summary style="cursor:pointer;font-size:13px">Each player's answers (${n})</summary><div style="overflow-x:auto"><table><thead><tr><th>Player</th>${q.questions.map((_,i)=>`<th>Q${i+1}</th>`).join('')}<th>When</th></tr></thead><tbody>${rows}</tbody></table></div></details>`:''}`,
   `${open?`<button class="btn" data-act="pclose" data-id="${q.id}">Close poll</button>`:`<button class="btn" data-act="preopen" data-id="${q.id}">Reopen</button>`} <button class="btn dng" data-act="pdelete" data-id="${q.id}">Delete</button>`)}).join('');
 return`<h1>📋 Polls</h1><p class="sub">Ask every player a question and see the answers here.</p>${form}${POLLS?(list||'<p class="mu">No polls sent yet.</p>'):'<p class="mu">Loading…</p>'}`}
function pdSync(){pdraft.title=$('pd_title')?$('pd_title').value:pdraft.title;pdraft.intro=$('pd_intro')?$('pd_intro').value:pdraft.intro;pdraft.hours=$('pd_hours')?$('pd_hours').value:pdraft.hours;pdraft.qs.forEach((Q,i)=>{if($('pd_q_'+i)){Q.q=$('pd_q_'+i).value;Q.opts=$('pd_o_'+i).value;Q.multi=$('pd_m_'+i).checked;Q.other=$('pd_w_'+i).checked}})}


// Casino: how much is bet, what the house keeps, by game and by day, plus the biggest winners
let CAS=null,casAt=0;async function casLoad(){casAt=Date.now();try{CAS=await api('GET','/api/admin/casino');if(tab==='casino')render()}catch(e){toast(e.message)}}
const msS=v=>{const a=Math.abs(v),sg=v<0?'−$':'$';return a>=1e12?sg+(a/1e12).toFixed(2)+'T':a>=1e9?sg+(a/1e9).toFixed(2)+'B':a>=1e6?sg+(a/1e6).toFixed(2)+'M':a>=1e3?sg+(a/1e3).toFixed(1)+'K':sg+Math.round(a)};
function casTab(){if(!CAS||Date.now()-casAt>15000)casLoad();if(!CAS)return'<h1>🎰 Casino</h1><p class="mu">Loading…</p>';
 const G={bj:'Blackjack',roulette:'Roulette',slots:'Slots',dice:'Dice'},T=CAS.tot||{},all=T.all||{plays:0,wag:0,net:0,wins:0},house=-all.net;
 const kv=(l,v,sub,cls='')=>`<div class="kv"><span>${l}</span><b class="${cls}">${v}</b>${sub?`<small class="mu" style="display:block;font-size:12px">${sub}</small>`:''}</div>`;
 const hero=`<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:14px">${kv('House profit',msS(house),'what players lost overall',house>=0?'gn':'rd')}${kv('Total wagered',msS(all.wag),`${all.plays.toLocaleString('en-US')} plays`)}${kv('Paid back to players',msS(all.wag+all.net),all.wag?`${((all.wag+all.net)/all.wag*100).toFixed(1)}% of bets`:'')}${kv('Win rate',all.plays?`${(all.wins/all.plays*100).toFixed(1)}%`:'—','plays that made money')}${kv('Players who played',String((CAS.players||[]).filter(p=>!p.ai).length),'all time')}${kv('Average bet',all.plays?msS(all.wag/all.plays):'—')}</div>`;
 const games=`<table><thead><tr><th>Game</th><th style="text-align:right">Plays</th><th style="text-align:right">Wagered</th><th style="text-align:right">House profit</th><th style="text-align:right">House edge</th><th style="text-align:right">Player win rate</th></tr></thead><tbody>${Object.keys(G).map(k=>{const x=T[k]||{plays:0,wag:0,net:0,wins:0};return`<tr><td>${G[k]}</td><td style="text-align:right">${x.plays.toLocaleString('en-US')}</td><td style="text-align:right">${msS(x.wag)}</td><td style="text-align:right" class="${-x.net>=0?'gn':'rd'}">${msS(-x.net)}</td><td style="text-align:right">${x.wag?((-x.net/x.wag)*100).toFixed(1)+'%':'—'}</td><td style="text-align:right">${x.plays?(x.wins/x.plays*100).toFixed(0)+'%':'—'}</td></tr>`}).join('')}</tbody></table><p class="mu" style="font-size:12px;margin:8px 0 0">Expected house edge is about 3–7% per game. Short-term results swing a lot, especially with big bets.</p>`;
 const days=Object.keys(CAS.days||{}).sort().slice(-30),dv=days.map(d=>({d,w:(CAS.days[d].all||{}).wag||0,h:-((CAS.days[d].all||{}).net||0),p:(CAS.days[d].all||{}).plays||0})),mx=Math.max(1,...dv.map(x=>Math.abs(x.h)));
 const chart=dv.length?`<div style="display:flex;align-items:center;justify-content:center;gap:3px;height:150px;border-bottom:1px solid var(--bd);position:relative">${dv.map(x=>`<div title="${x.d}: house ${msS(x.h)} · wagered ${msS(x.w)} · ${x.p} plays" style="flex:1;max-width:34px;height:100%;display:flex;flex-direction:column;justify-content:center"><div style="height:50%;display:flex;align-items:flex-end"><i style="display:block;width:100%;height:${x.h>0?Math.max(2,x.h/mx*100):0}%;background:#3fb950;border-radius:3px 3px 0 0"></i></div><div style="height:50%"><i style="display:block;width:100%;height:${x.h<0?Math.max(2,-x.h/mx*100):0}%;background:#f85149;border-radius:0 0 3px 3px"></i></div></div>`).join('')}</div><div class="mu" style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px"><span>${dv[0].d}</span><span>Green: house won · Red: players won · hover a day for details</span><span>${dv[dv.length-1].d}</span></div>`:'<p class="mu">No plays recorded yet.</p>';
