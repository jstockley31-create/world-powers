<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Powers — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bl);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#3b4b5c}.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.sm{padding:4px 9px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}input:focus,textarea:focus{border-color:var(--ac)}
header.top{display:flex;align-items:center;gap:8px 16px;padding:8px 22px;min-height:58px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header.top b{letter-spacing:.22em;font-size:13px}header.top .tag{margin-left:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-left:24px;min-width:0;flex:0 1 auto}.tabs button{white-space:nowrap}.top>.btn,#upd{flex:none}@media(max-width:1300px){#upd{display:none}}.tabs button{background:none;border:0;padding:8px 14px;border-radius:6px;color:var(--mu);cursor:pointer;font-weight:500}.tabs button.on{background:var(--s3);color:var(--tx)}.tabs .n{background:var(--rd);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;margin-left:5px;font-weight:700}
.sp{margin-left:auto}.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.yl{color:var(--yl)}.ac{color:var(--ac)}
main{max-width:1300px;margin:0 auto;padding:22px}
h1{font-size:21px;margin:0 0 4px;font-weight:600}.sub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.panel>header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:8px}.panel>header h2{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:#c5ced8}
.panel>.bd{padding:16px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px 16px}
.card span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.card b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}.card small{color:var(--mu);font-size:12px}
.card.ok{border-left:3px solid var(--gn)}.card.warn{border-left:3px solid var(--yl)}.card.bad{border-left:3px solid var(--rd)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr{cursor:default}tbody tr.click{cursor:pointer}tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cols>*{min-width:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mono{font:12px var(--mono)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--s1);border-left:1px solid var(--bd2);box-shadow:-20px 0 60px #000a;z-index:20;overflow-y:auto;transform:translateX(105%);transition:transform .2s}
#drawer.open{transform:none}#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1);z-index:2}#drawer .db{padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202b;border:1px solid var(--bd2);border-left:3px solid var(--ac);padding:10px 16px;border-radius:6px;z-index:50;display:none}
#gate{max-width:420px;margin:15vh auto;text-align:center}
.log div{padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:12px}.log time{color:var(--mu2);font:11.5px var(--mono);width:120px;flex:none}
@media(max-width:900px){.cols{grid-template-columns:1fr}.tabs{margin-left:0;max-width:100%}header.top{flex-wrap:wrap;height:auto;padding:10px}}
</style></head><body>
<header class="top"><b>WORLD POWERS</b><span class="tag y">ADMIN</span><nav class="tabs" id="tabs"></nav><span class="sp mu" id="upd"></span><a class="btn sm" href="/">Back to game</a><meta name="robots" content="noindex"></header>
<main id="main"><p class="mu">Loading…</p></main>
<aside id="drawer"></aside><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':Math.round(v).toLocaleString('en-US');
const money=v=>v==null?'—':(v<0?'−$':'$')+Math.round(Math.abs(v)).toLocaleString('en-US');
const ago=t=>{if(!t)return'never';const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const dur=ms=>{const s=ms/1e3;return s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'};
const bytes=b=>b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB';
const when=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const RANKS=['Chieftain','Elder','Mayor','Governor','Senator','Prime Minister','President','Sovereign','Emperor','Supreme Leader','World Power'];
let D=null,tab='dash',q='',sel=null,dirtyForm=false;
async function api(method,url,body){const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Error '+r.status),{status:r.status});return j}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}
async function load(){try{D=await api('GET','/api/admin/overview');$('upd').textContent='Updated '+new Date().toLocaleTimeString();render()}catch(e){if(e.status===401||e.status===403){$('tabs').innerHTML='';$('main').innerHTML=`<div id="gate"><h1>Admins only</h1><p class="mu">${e.status===401?'Sign in to the game with an admin account first.':'Your account does not have admin access.'}</p><a class="btn pri" href="/">Go to the game</a></div>`;return}$('upd').innerHTML='<span class="rd">Connection problem</span>'}}
const TABS=[['dash','Dashboard'],['war','War room'],['players','Players'],['cheat','Cheat watch'],['stats','Analytics'],['mod','Moderation'],['bugs','Bugs'],['world','World'],['settings','Game settings'],['log','Activity log']];
function render(){const fc=D.flags.filter(f=>Date.now()-f.t<864e5).length;$('tabs').innerHTML=TABS.map(([k,t])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${t}${k==='cheat'&&fc?`<span class="n">${fc}</span>`:''}${k==='mod'&&D.reports.filter(r=>!r.done).length?`<span class="n">${D.reports.filter(r=>!r.done).length}</span>`:''}${k==='bugs'&&(D.bugs||[]).filter(b=>!b.done).length?`<span class="n">${D.bugs.filter(b=>!b.done).length}</span>`:''}</button>`).join('');
 const a=document.activeElement;if(a&&$('main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(dirtyForm&&tab==='settings')return;
 const keep={};$('main').querySelectorAll('select[id]:not([id^=c_])').forEach(x=>keep[x.id]=x.value); // the 10-second refresh keeps choices you've made
 $('main').innerHTML=({dash,war,players,cheat,stats,mod,bugs,world,settings,log})[tab]();
 for(const [k,v] of Object.entries(keep)){const x=$(k);if(x&&[...x.options].some(o=>o.value===v))x.value=v}}
const card=(l,v,cls='',s='')=>`<div class="card ${cls}"><span>${l}</span><b>${v}</b>${s?`<div><small>${s}</small></div>`:''}</div>`;
const panel=(t,b,r='')=>`<section class="panel"><header><h2>${t}</h2><div>${r}</div></header><div class="bd">${b}</div></section>`;
function dash(){const h=D.health;const saveOk=!h.saveError&&Date.now()-h.lastSave<10*60e3;const vol=h.onVolume;const recentFlags=D.flags.filter(f=>Date.now()-f.t<864e5);
 const issues=[];if(h.saveError)issues.push(['bad','Saving is failing: '+h.saveError]);if(vol===false)issues.push(['bad',`Data is NOT on the Railway volume (${esc(h.dataDir)}). Progress will be lost on restart. Set DATA_DIR to ${esc(h.volume)}.`]);if(vol===null)issues.push(['warn','No Railway volume detected. If this is running on Railway, add a volume mounted at /data.']);if(h.errors24)issues.push(['warn',`${h.errors24} server error(s) in the last 24 hours — see Activity log.`]);if(recentFlags.length)issues.push(['warn',`${recentFlags.length} suspicious activity flag(s) in the last 24 hours — see Cheat watch.`]);if(D.shared.length)issues.push(['warn',`${D.shared.length} network(s) shared by multiple accounts — possible duplicate accounts.`]);
 return`<h1>Dashboard</h1><p class="sub">Health of the game server and the world at a glance. Refreshes every 10 seconds.</p>
 ${issues.length?panel('Needs attention',issues.map(([c,t])=>`<div class="row" style="padding:5px 0"><span class="tag ${c==='bad'?'r':'y'}">${c==='bad'?'Problem':'Check'}</span><span>${t}</span></div>`).join('')):`<div class="card ok" style="margin-bottom:16px"><b style="font-size:15px">All systems healthy</b><div><small>Server running, saving normally${vol?', data stored on the persistent volume':''}.</small></div></div>`}
 <div class="grid">${card('Server','Online','ok','Up for '+dur(h.uptime))}${card('Last save',ago(h.lastSave),saveOk?'ok':'bad',h.saveError?esc(h.saveError):'Saves within seconds of changes')}${card('Storage',vol?'Volume':vol===false?'Not on volume':'Local disk',vol?'ok':vol===false?'bad':'warn',esc(h.dataDir))}${card('Data size',bytes(h.dataBytes),'')}
 ${card('Memory',h.memoryMB+' MB',h.memoryMB>400?'warn':'ok','Heap '+h.heapMB+' MB')}${card('Requests (5 min)',num(h.reqs5))}${card('Errors (24 h)',h.errors24,h.errors24?'warn':'ok')}${card('Node.js',h.node,'','Load '+h.load.toFixed(2))}</div>
 <div class="grid">${card('Accounts',h.accounts)}${card('Nations',h.nations,'',D.bots.length+' AI-controlled')}${card('Online now',h.online,'',h.streams+' open connection(s)')}${card('Active sessions',h.sessions)}${card('Game actions',num(h.cmds),'','Since server start')}${card('Flags (24 h)',recentFlags.length,recentFlags.length?'warn':'ok')}${card('Decision scenarios',h.scenarios)}${card('Push subscribers',h.pushSubs)}${card('Last nightly backup',h.lastBackup?ago(h.lastBackup):'Not yet',h.lastBackup&&Date.now()-h.lastBackup<30*36e5?'ok':'warn','Kept for 7 days')}</div>
 ${panel('Top nations',table(D.players.filter(p=>p.nation).sort((a,b)=>score(b)-score(a)).slice(0,10)))}`}
const score=p=>p.nation?p.nation.score:0;
function table(rows){return`<table><thead><tr><th>Player</th><th>Nation</th><th>Rank</th><th class="r">Cash</th><th class="r">Troops</th><th class="r">Prov.</th><th>Last seen</th><th>Status</th></tr></thead><tbody>${rows.map(p=>`<tr class="click" data-p="${esc(p.id)}"><td><b>${esc(p.name)}</b><div class="mu" style="font-size:12px">${esc(p.email)}</div></td><td>${p.nation?`<span class="dot" style="background:${esc(p.nation.color)}"></span>${esc(p.nation.name)}`:'<span class="mu">No nation</span>'}</td><td>${p.nation?RANKS[p.nation.rank]:'—'}</td><td class="r num">${p.nation?money(p.nation.cash):'—'}</td><td class="r num">${p.nation?num(p.nation.troops):'—'}</td><td class="r num">${p.nation?p.nation.provinces:'—'}</td><td>${ago(p.lastSeen)}</td><td>${p.banned?'<span class="tag r">Banned</span>':''}${p.admin?'<span class="tag y">Admin</span> ':''}${p.guest?'<span class="tag b">Guest</span> ':''}${p.flags?`<span class="tag r">${p.flags} flag${p.flags>1?'s':''}</span> `:''}${p.shared?'<span class="tag b">Shared network</span>':''}</td></tr>`).join('')||'<tr><td colspan="8" class="mu">No players.</td></tr>'}</tbody></table>`}
function aiPanel(){return panel(`AI nations (${D.bots.length})`,D.bots.length?`<table><thead><tr><th>Nation</th><th>Personality</th><th>Rank</th><th class="r">Provinces</th><th class="r">Troops</th><th class="r">Score</th><th>At war with</th><th></th></tr></thead><tbody>${D.bots.sort((a,b)=>b.score-a.score).map(b=>`<tr><td><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)}</td><td>${esc(b.p)}</td><td>${RANKS[b.rank]}</td><td class="r num">${b.provinces}</td><td class="r num">${num(b.troops)}</td><td class="r num">${num(b.score)}</td><td>${b.wars.map(esc).join(', ')||'<span class="mu">—</span>'}</td><td class="r"><button class="btn sm dng" data-act="botrm" data-bot="${esc(b.id)}">Remove</button></td></tr>`).join('')}</tbody></table>`:'<p class="mu" style="margin:0">No AI nations.</p>',`<button class="btn sm ok" data-act="botadd">Add AI nation</button>`)}
function players(){const f=q.toLowerCase();const rows=D.players.filter(p=>!f||[p.name,p.email,p.nation?.name].some(x=>(x||'').toLowerCase().includes(f))).sort((a,b)=>b.lastSeen-a.lastSeen);
 return`<h1>Players</h1><p class="sub">Click a player to view details, edit their nation, or take action.</p><div class="row" style="margin-bottom:14px"><input id="q" placeholder="Search name, email or nation" value="${esc(q)}" style="width:320px"><span class="mu">${rows.length} of ${D.players.length}</span></div>${panel('All players',table(rows))}${aiPanel()}`}
function cheat(){const by={};for(const f of D.flags)(by[f.uid]=by[f.uid]||[]).push(f);const pl=id=>D.players.find(p=>p.id===id);
 return`<h1>Cheat watch</h1><p class="sub">All game rules run on the server, so players cannot edit their numbers. This page flags behavior that suggests cheating anyway: bots clicking faster than a person can, second accounts on the same network, and aid sent between them. A flag is a lead, not proof — review before acting.</p>
 ${panel('Flagged players',Object.keys(by).length?`<table><thead><tr><th>Player</th><th>Nation</th><th class="r">Flags</th><th>Most recent</th><th>Latest reason</th><th></th></tr></thead><tbody>${Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([id,fs])=>{const p=pl(id);return`<tr class="click" data-p="${esc(id)}"><td><b>${esc(p?.name||'Deleted account')}</b><div class="mu" style="font-size:12px">${esc(p?.email||'')}</div></td><td>${esc(p?.nation?.name||'—')}</td><td class="r"><span class="tag r">${fs.length}</span></td><td>${ago(fs[0].t)}</td><td>${esc(fs[0].r)}</td><td class="r"><button class="btn sm" data-act="clearflags" data-id="${esc(id)}">Dismiss</button></td></tr>`}).join('')}</tbody></table>`:'<p class="mu" style="margin:0">No suspicious activity detected.</p>',D.flags.length?'<button class="btn sm" data-act="clearflags">Dismiss all</button>':'')}
 ${panel('Possible duplicate accounts',D.shared.length?`<p class="mu" style="margin-top:0;font-size:13px">These accounts have signed in from the same network. Family members or roommates can legitimately share a network, so check before banning.</p><table><thead><tr><th>Network (IP)</th><th>Accounts</th></tr></thead><tbody>${D.shared.map(s=>`<tr><td class="mono">${esc(s.ip)}</td><td>${s.ids.map(id=>{const p=pl(id);return p?`<a href="#" data-p="${esc(id)}">${esc(p.name)}</a> <span class="mu">(${esc(p.email)})</span>`:''}).join(', ')}</td></tr>`).join('')}</tbody></table>`:'<p class="mu" style="margin:0">No shared networks detected.</p>')}
 ${panel('Recent flags',`<div class="log">${D.flags.slice(0,80).map(f=>`<div><time>${when(f.t)}</time><span><b>${esc(pl(f.uid)?.name||'?')}</b> — ${esc(f.r)}</span></div>`).join('')||'<p class="mu" style="margin:0">None.</p>'}</div>`)}`}
function bars(rows,key,col){const mx=Math.max(1,...rows.map(r=>r[key]));return`<div style="display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px">${rows.map(r=>`<div title="${r.d}: ${r[key]}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end"><small class="mu" style="font-size:10px">${r[key]||''}</small><div style="width:100%;max-width:26px;background:${col};border-radius:3px 3px 0 0;height:${Math.max(2,r[key]/mx*90)}px"></div><small class="mu" style="font-size:9.5px">${r.d.slice(5)}</small></div>`).join('')}</div>`}
function stats(){const A=D.analytics,t=A.days.at(-1)||{},y=A.days.at(-2)||{};const wk=A.days.slice(-7);const wau=wk.reduce((a,d)=>a+d.active,0);
 return`<h1>Analytics</h1><p class="sub">Daily activity over the last 14 days (UTC). Active = signed-in players who did anything that day.</p>
 <div class="grid">${card('Active today',t.active,'',`Yesterday ${y.active||0}`)}${card('Sign-ups today',t.signups,'',`Yesterday ${y.signups||0}`)}${card('Day-1 retention',A.d1==null?'—':A.d1+'%',A.d1==null?'':A.d1>=30?'ok':'warn','Came back the day after joining')}${card('Avg daily active (7 d)',(wau/7).toFixed(1))}${card('Game actions today',num(t.cmds))}${card('Chat messages today',num(t.chat))}${card('Mail sent today',num(t.mail))}</div>
 <div class="cols">${panel('Daily active players',bars(A.days,'active','#4c9aff'))}${panel('Sign-ups',bars(A.days,'signups','#3fb950'))}</div>
 <div class="cols">${panel('Game actions',bars(A.days,'cmds','#d4a64a'))}${panel('Chat messages',bars(A.days,'chat','#a371f7'))}</div>
 ${panel('Day-1 retention by sign-up day',`<table><thead><tr><th>Signed up</th><th class="r">New players</th><th class="r">Returned next day</th><th class="r">Rate</th></tr></thead><tbody>${A.ret.filter(r=>r.cohort).length?'':'<tr><td colspan="4" class="mu">Retention appears here the day after your first players sign up.</td></tr>'}${A.ret.filter(r=>r.cohort).reverse().map(r=>`<tr><td>${r.d}</td><td class="r num">${r.cohort}</td><td class="r num">${r.back}</td><td class="r num">${r.cohort?Math.round(r.back/r.cohort*100)+'%':'—'}</td></tr>`).join('')}</tbody></table>`)}`}
function mod(){const open=D.reports.filter(r=>!r.done),done=D.reports.filter(r=>r.done).slice(0,30);const pl=id=>D.players.find(p=>p.id===id);const muted=D.players.filter(p=>p.mutedUntil>Date.now());
 const row=r=>`<tr><td>${ago(r.t)}</td><td>${esc(r.byName||'?')}</td><td><a href="#" data-p="${esc(r.about)}"><b>${esc(r.aboutName||'Deleted')}</b></a></td><td><span class="tag">${esc(r.kind)}</span></td><td>${esc(r.reason)}${r.text?`<div class="mu mono" style="font-size:12px;white-space:pre-wrap;max-width:420px">${esc(r.text.slice(0,300))}</div>`:''}</td><td class="r" style="white-space:nowrap">${r.done?'<span class="tag g">Closed</span>':`<button class="btn sm" data-act="mute" data-id="${esc(r.about)}">Mute</button> <button class="btn sm" data-act="kick" data-id="${esc(r.about)}">Kick</button> <button class="btn sm ok" data-act="repdone" data-r="${esc(r.id)}">Close</button>`}</td></tr>`;
 const th='<thead><tr><th>When</th><th>Reported by</th><th>Player</th><th>Type</th><th>Reason</th><th></th></tr></thead>';
 return`<h1>Moderation</h1><p class="sub">Player reports from chat and mail. Profanity is filtered automatically; muted players cannot chat or send mail. Click a name for ban and other options.</p>
 ${panel(`Open reports (${open.length})`,open.length?`<table>${th}<tbody>${open.map(row).join('')}</tbody></table>`:'<p class="mu" style="margin:0">No open reports.</p>')}

function world(){const ev=D.event,cs=D.council||{props:[]};const open=cs.props.filter(p=>p.status==='open');const nm=id=>D.players.find(p=>p.id===id)?.nation?.name||D.bots.find(b=>b.id===id)?.name||'?';

function war(){const X=D.war||{wars:[],hot:[],strikes:[],fires:0,pacts:[]},ai=b=>b?' <span class="tag b" style="font-size:10px;padding:0 5px">AI</span>':'';
 const all=[...D.players.filter(p=>p.nation).map(p=>({id:p.id,n:p.nation.name})),...D.bots.map(b=>({id:b.id,n:b.name}))].sort((a,b)=>a.n.localeCompare(b.n)),opt=all.map(x=>`<option value="${esc(x.id)}">${esc(x.n)}</option>`).join('');

 <div class="cols"><div>${panel(`Wars in progress (${X.wars.length})`,X.wars.length?`<div style="overflow:auto;max-height:620px"><table><thead><tr><th>Started by</th><th>Against</th><th>Since</th><th class="r">Battles (24 h)</th><th class="r">Aggression</th><th></th></tr></thead><tbody>${X.wars.map(w=>`<tr><td><b>${esc(w.byName)}</b>${ai(w.byAI)}</td><td>${esc(w.vsName)}${ai(w.vsAI)}${w.pact?' <span class="tag g" style="font-size:10px;padding:0 5px">pact</span>':''}</td><td class="mu">${ago(w.since)}</td><td class="r">${w.battlesBy} / ${w.battlesVs}</td><td class="r">${w.aggrBy} / ${w.aggrVs}</td><td><button class="btn sm" data-act="peace" data-a="${esc(w.by)}" data-b="${esc(w.vs)}">Force peace</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="mu" style="margin:0">No wars right now.</p>')}
 ${panel(`Aggression watch (${X.hot.length})`,X.hot.length?`<p class="mu" style="margin-top:0;font-size:13px">Nations at 20+ aggression. 35 brings an automatic Council condemnation vote, 50 automatic sanctions, 75 rogue status. Defending yourself adds no aggression at all, so a high number here means they keep starting fights.</p><table><thead><tr><th>Nation</th><th class="r">Aggression</th><th class="r">Wars</th><th>Status</th></tr></thead><tbody>${X.hot.map(h=>`<tr${h.ai?'':` class="click" data-p="${esc(h.id)}"`}><td><b>${esc(h.name)}</b>${ai(h.ai)}${h.boss?' <span class="tag r" style="font-size:10px;padding:0 5px">Rising Power</span>':''}</td><td class="r">${h.aggr}</td><td class="r">${h.wars}</td><td>${st(h)}</td></tr>`).join('')}</tbody></table>`:'<p class="mu" style="margin:0">Nobody is close to sanctions.</p>')}
</div>

function tlRender(id,T,f){const box=$('tl');if(!box)return;const H=T.hist,K=[['cash','Cash',money],['prov','Provinces',num],['troops','Troops',num],['ap','Approval',v=>v+'%']];
 const spark=(k,l,fm)=>{const v=H.filter(h=>!h.gone&&h[k]!=null).map(h=>h[k]);if(v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),w=220,hh=40,pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(hh-2-(mx===mn?.5:(x-mn)/(mx-mn))*(hh-4)).toFixed(1)}`).join(' ');return`<div style="min-width:220px"><div class="mu" style="font-size:11px">${l.toUpperCase()} · now ${fm(v[v.length-1])}</div><svg width="${w}" height="${hh}" style="display:block"><polyline points="${pts}" fill="none" stroke="var(--ac,#6aa9ff)" stroke-width="1.6"/></svg><div class="mu" style="font-size:11px;display:flex;justify-content:space-between"><span>low ${fm(mn)}</span><span>high ${fm(mx)}</span></div></div>`};
 const rows=H.slice().reverse().map((h,i,a)=>{const p=a[i+1];const bad=p&&!h.gone&&!p.gone&&(h.prov<p.prov||h.cash<p.cash*.6||h.troops<p.troops*.6);return`<tr${bad?' style="background:rgba(255,80,80,.08)"':''}><td>${h.now?'<b>Now</b>':when(h.t)}</td>${h.gone?'<td colspan="5" class="mu">No nation</td>':`<td class="r num">${money(h.cash)}</td><td class="r num">${money(h.debt)}</td><td class="r num">${h.prov}</td><td class="r num">${num(h.troops)}</td><td class="r num">${h.ap}%</td>`}<td class="r">${h.snap&&!h.gone?`<button class="btn sm" data-act="restore" data-id="${esc(id)}" data-s="${esc(h.snap)}" data-w="${esc(when(h.t))}">Restore</button>`:''}</td></tr>`}).join('');
 const KINDS=[['all','All'],['action','Actions'],['refused','Refused'],['game','Nation news'],['note','Notifications'],['chat','Chat'],['admin','Admin'],['flag','Flags'],['report','Reports'],['nuke','Nukes']];
 const ev=T.events.filter(e=>(f.k==='all'||e.k===f.k)&&(!f.q||e.x.toLowerCase().includes(f.q.toLowerCase())));

 box.innerHTML=`<div class="row" style="gap:16px;flex-wrap:wrap;margin-bottom:12px">${K.map(k=>spark(...k)).join('')||'<span class="mu">History appears once a couple of snapshots exist.</span>'}</div>
 <details style="margin-bottom:12px"><summary style="cursor:pointer"><b>Hourly history</b> <span class="mu">— rows in red show a big drop. “Restore” puts just this nation back (cash, stockpiles, army, stats and any provinces nobody else holds now); everyone else is untouched, and you can undo it with “Undo” under Game settings → Roll back the world.</span></summary><div style="overflow:auto;max-height:300px"><table><thead><tr><th>Time</th><th class="r">Cash</th><th class="r">Debt</th><th class="r">Prov.</th><th class="r">Troops</th><th class="r">Approval</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></details>
 <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">${KINDS.map(([k,l])=>`<button class="btn sm ${f.k===k?'pri':''}" data-act="tlk" data-k="${k}" data-id="${esc(id)}">${l} <span class="mu">${k==='all'?T.events.length:T.events.filter(e=>e.k===k).length}</span></button>`).join('')}<input id="tlq" placeholder="Search…" value="${esc(f.q||'')}" style="flex:1;min-width:120px"></div>
 <div class="log" style="max-height:420px;overflow:auto">${ev.slice(0,400).map(e=>`<div><time>${when(e.t)}</time><span><span class="tag ${col[e.k]||''}" style="font-size:10.5px">${e.k}</span> ${esc(e.x)}</span></div>`).join('')||'<div class="mu">Nothing matches.</div>'}</div>`}

keTest?'':'selected'}>Off — normal rules (24 h wait, 12 h assembly, 7-day lockout)</option><option value="1" ${c.nukeTest?'selected':''}>On — no rank needed (Senator/President), no 24 h wait, warheads arm in 1 minute, no lockout</option></select></div><div class="field"><label>Conquest (nations can fall)</label><select id="c_conquest"><option value="1" ${c.conquest!==false?'selected':''}>On</option><option value="0" ${c.conquest===false?'selected':''}>Off — capitals can never be taken</option></select></div><div class="field"><label>Last-stand warning (hours)</label><input id="c_lastStandH" type="number" min="0" max="168" value="${c.lastStandH??24}"><small class="mu">Time before a player's capital can be besieged (AI nations get none)</small></div><div class="field"><label>Random world events</label><select id="c_eventsOn"><option value="1" ${c.eventsOn?'selected':''}>On (every 10–18 h)</option><option value="0" ${c.eventsOn?'':'selected'}>Off</option></select></div></div>

 ${panel('Private admin link',`<p class="mu" style="margin-top:0;font-size:13px">This page lives at a secret address that only admin accounts can open — everyone else gets “Not found”. Bookmark it. If you think someone learned the address, change it.</p><div class="mono" style="background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:8px 10px;margin-bottom:10px;word-break:break-all">${esc(location.origin+location.pathname)}</div><button class="btn" data-act="rotate">Change secret link</button>`)}
 ${panel('Backups',`<p class="mu" style="margin-top:0;font-size:13px">Download a complete copy of the game — accounts, nations, chat and settings.</p><a class="btn" href="/api/admin/backup">Download current state</a><p class="mu" style="font-size:13px;margin:14px 0 6px">Nightly backups (kept 7 days):</p>${D.backups.map(b=>`<div class="row" style="justify-content:space-between;padding:4px 0"><span class="mono">${esc(b.name)}</span><span class="mu">${bytes(b.size)}</span><a class="btn sm" href="/api/admin/backups/${encodeURIComponent(b.name)}">Download</a></div>`).join('')||'<span class="mu">None yet — the first runs tonight.</span>'}`)}
 ${panel('Roll back the world',`<p class="mu" style="margin-top:0;font-size:13px">Puts every nation, the World Council and world events back to how they were. Accounts, chat, mail and settings are not touched, and nobody is logged out — everyone's screen refreshes. A snapshot is saved every 10 minutes and kept for 26 hours, and one is taken right before any rollback so you can undo it.</p><div class="row" style="gap:6px;flex-wrap:wrap">${[[30,'30 min'],[60,'1 hour'],[180,'3 hours'],[360,'6 hours'],[1440,'1 day']].map(([m,l])=>`<button class="btn dng" data-act="rollback" data-m="${m}">⏪ ${l}</button>`).join('')}</div>${(()=>{const u=(D.snaps||[]).find(x=>x.tag==='undo');return u?`<div style="margin-top:10px"><button class="btn" data-act="rollsnap" data-s="${esc(u.name)}">↩ Undo the last rollback or restore (back to ${when(u.t)})</button></div>`:''})()}<details style="margin-top:12px"><summary class="mu" style="cursor:pointer;font-size:13px">Pick an exact snapshot (${(D.snaps||[]).length})</summary><div style="max-height:240px;overflow:auto;margin-top:6px">${(D.snaps||[]).map(x=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span>${when(x.t)} ${x.tag==='undo'?'<span class="tag y">before rollback</span>':''}</span><button class="btn sm" data-act="rollsnap" data-s="${esc(x.name)}">Restore</button></div>`).join('')||'<span class="mu">None yet — the first is taken within a minute of this update going live.</span>'}</div></details>`)}
 ${panel('Danger zone',`<div class="row" style="justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--bd)"><div><b>Clear World Chat</b><div class="mu" style="font-size:13px">Deletes every chat message.</div></div><button class="btn dng" data-act="clearchat">Clear chat</button></div><div class="row" style="justify-content:space-between;padding-top:12px"><div><b>Wipe the world</b><div class="mu" style="font-size:13px">Deletes every nation and all chat. Accounts are kept so players can start fresh. A backup is saved on the server first.</div></div><button class="btn dng" data-act="wipe">Wipe world</button></div>`)}</div></div>`}
function log(){return`<h1>Activity log</h1><p class="sub">Every admin action and recent server errors.</p><div class="cols">${panel('Admin actions',`<div class="log">${D.audit.map(a=>`<div><time>${when(a.t)}</time><span><b>${esc(a.by)}</b> — ${esc(a.action)}${a.target?` · <b>${esc(a.target)}</b>`:''}${a.detail?`<div class="mu" style="font-size:12px">${esc(a.detail)}</div>`:''}</span></div>`).join('')||'<p class="mu" style="margin:0">No actions yet.</p>'}</div>`)}${panel('Server errors',`<div class="log">${D.errors.map(e=>`<div><time>${when(e.t)}</time><span class="mono" style="white-space:pre-wrap;word-break:break-word">${esc(e.msg)}</span></div>`).join('')||'<p class="mu" style="margin:0">No errors. </p>'}</div>`)}</div>`}
async function drawer(id,keep){sel=id;let P;const pl=D.players.find(x=>x.id===id);try{P=await api('POST','/api/admin/player',{id})}catch(e){toast(e.message);return}const n=P.nation;const el=$('drawer');
 if(keep&&el.contains(document.activeElement))return;
 el.innerHTML=`<div class="dh"><div><b style="font-size:16px">${esc(P.name)}</b> ${P.admin?'<span class="tag y">Admin</span>':''} ${P.banned?'<span class="tag r">Banned</span>':''} ${pl&&pl.guest?'<span class="tag b">Guest</span>':''}<div class="mu" style="font-size:12.5px">${esc(P.email||'No email (guest)')}${pl&&pl.invitedBy?` · invited by ${esc(pl.invitedBy)}`:''}</div></div><span class="row" style="gap:6px"><a class="btn sm" href="/play?viewas=${encodeURIComponent(id)}" target="_blank">View as player</a><button class="btn sm" data-act="close">Close</button></span></div><div class="db">
 <div class="fgrid" style="margin-bottom:16px"><div><span class="mu" style="font-size:11px">JOINED</span><div>${P.created?when(P.created):'—'}</div></div><div><span class="mu" style="font-size:11px">LAST SEEN</span><div>${ago(P.meta.lastSeen)}</div></div><div><span class="mu" style="font-size:11px">NETWORKS</span><div class="mono">${(P.meta.ips||[]).slice(0,3).map(esc).join('<br>')||'—'}</div></div></div>
 ${n?panel(`<span class="dot" style="background:${esc(n.color)}"></span>${esc(n.name)}`,`<div class="fgrid">${[['name','Nation name','text'],['cash','Cash'],['pop','Population'],['troops','Troops'],['xp','XP'],['tech','Tech'],['train','Training'],['infra','Infrastructure'],['fort','Fortifications'],['tax','Tax %'],['approval','Approval'],['stability','Stability'],['aggr','Aggression']].map(([k,l,t])=>`<div class="field"><label>${l}</label><input data-f="${k}" type="${t||'number'}" value="${esc(t?n[k]:Math.round((n[k]||0)*100)/100)}"></div>`).join('')}${['food','oil','steel','goods'].map(r=>`<div class="field"><label>${r}</label><input data-r="${r}" type="number" value="${Math.round(n.res?.[r]||0)}"></div>`).join('')}</div>
 <div class="row"><button class="btn pri" data-act="savenation" data-id="${esc(id)}">Save changes</button><button class="btn" data-act="resetcd" data-id="${esc(id)}">Reset cooldowns</button><button class="btn dng" data-act="resetnation" data-id="${esc(id)}">Reset nation</button></div><p class="mu" style="font-size:12px;margin:10px 0 0">Edits take effect immediately, even if the player is online. Every edit is recorded in the Activity log.</p>`):panel('Nation','<p class="mu" style="margin:0">This player has not founded a nation.</p>')}
 ${panel('Account',`<div class="field"><label>Set a new password</label><div class="row"><input id="newpw" type="text" placeholder="8+ characters" style="flex:1"><button class="btn" data-act="setpw" data-id="${esc(id)}">Set password</button></div><small class="mu">Signs them out everywhere. Tell them the new password.</small></div>
 <div class="row">${P.banned?`<button class="btn ok" data-act="unban" data-id="${esc(id)}">Unban</button>`:`<button class="btn dng" data-act="ban" data-id="${esc(id)}">Ban</button>`}<button class="btn" data-act="mute" data-id="${esc(id)}">${P.mutedUntil>Date.now()?'Change mute':'Mute'}</button><button class="btn" data-act="kick" data-id="${esc(id)}">Kick (sign out)</button><button class="btn" data-act="clearuserchat" data-id="${esc(id)}">Delete their chat</button><button class="btn dng" data-act="delacct" data-id="${esc(id)}">Delete account</button>${P.flags.length?`<button class="btn" data-act="clearflags" data-id="${esc(id)}">Dismiss flags</button>`:''}</div>`)}
 ${panel('What happened',`<p class="mu" style="margin-top:0;font-size:13px">Everything about this player in one place: what they clicked (including actions the game refused and why), their nation's news, notifications, chat, admin edits and an hourly history of their nation for the last 26 hours. Use it when someone reports a problem.</p><div id="tl"><button class="btn" data-act="tl" data-id="${esc(id)}">Show timeline</button></div>`)}
 ${P.flags.length?panel(`Cheat flags (${P.flags.length})`,`<div class="log">${P.flags.map(f=>`<div><time>${when(f.t)}</time><span>${esc(f.r)}</span></div>`).join('')}</div>`):''}</div>`;el.classList.add('open')}
async function act(fn,msg){try{await fn();toast(msg);await load();if(sel&&$('drawer').classList.contains('open'))drawer(sel)}catch(e){toast(e.message)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;dirtyForm=false;render();return}
 const pr=e.target.closest('[data-p]');if(pr&&!e.target.closest('[data-act]')){e.preventDefault();drawer(pr.dataset.p);return}
 const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;const name=D.players.find(p=>p.id===id)?.name||'';
 switch(b.dataset.act){
 case'close':sel=null;$('drawer').classList.remove('open');break;
 case'savenation':{const patch={res:{}};$('drawer').querySelectorAll('[data-f]').forEach(i=>patch[i.dataset.f]=i.value);$('drawer').querySelectorAll('[data-r]').forEach(i=>patch.res[i.dataset.r]=i.value);act(()=>api('POST','/api/admin/nation',{id,patch}),'Nation updated.');break}
 case'resetcd':act(()=>api('POST','/api/admin/nation',{id,resetCooldowns:true}),'Cooldowns reset.');break;
 case'resetnation':if(confirm(`Reset ${name}'s nation? They will start over from scratch.`))act(()=>api('POST','/api/admin/reset-nation',{id}),'Nation reset.');break;
 case'ban':if(confirm(`Ban ${name}? Their nation and chat are deleted and they cannot sign in.`))act(()=>api('POST','/api/admin/ban',{id}),'Player banned.');break;
 case'unban':act(()=>api('POST','/api/admin/unban',{id}),'Player unbanned.');break;
 case'delacct':if(confirm(`Permanently delete ${name}'s account? This cannot be undone. (Their email can then sign up again.)`))act(async()=>{await api('POST','/api/admin/delete-account',{id});sel=null;$('drawer').classList.remove('open')},'Account deleted.');break;
 case'setpw':{const pw=$('newpw').value;act(()=>api('POST','/api/admin/password',{id,password:pw}),'Password changed.');break}
 case'mute':{const h=prompt(`Mute ${name} in chat and mail for how many hours? (0 to unmute)`,'24');if(h!=null)act(()=>api('POST','/api/admin/mute',{id,hours:+h}),+h?'Player muted.':'Player unmuted.');break}
 case'kick':if(confirm(`Sign ${name} out of every device?`))act(()=>api('POST','/api/admin/kick',{id}),'Player signed out.');break;
 case'clearuserchat':act(()=>api('POST','/api/admin/clear-user-chat',{id}),'Their chat messages were deleted.');break;
 case'repdone':act(()=>api('POST','/api/admin/report-done',{report:b.dataset.r}),'Report closed.');break;
 case'bugdone':act(()=>api('POST','/api/admin/bug-done',{bug:b.dataset.r}),'Updated.');break;
 case'schedadd':{const st=new Date($('scStart').value).getTime();act(()=>api('POST','/api/admin/schedule-add',{type:$('scType').value,start:st,hours:+$('scHours').value,label:$('scLabel').value}),'Scheduled.');break}
 case'schedcancel':if(confirm('Cancel or end this scheduled event?'))act(()=>api('POST','/api/admin/schedule-cancel',{id:b.dataset.r}),'Cancelled.');break;
 case'evstart':{const k=$('evk').value;if(confirm('Start this world event for every nation now?'))act(()=>api('POST','/api/admin/event-start',{key:k}),'World event started.');break}
 case'evend':act(()=>api('POST','/api/admin/event-end',{}),'World event ended.');break;
 case'peace':if(confirm('Force peace between these two nations now?'))act(()=>api('POST','/api/admin/peace',{a:b.dataset.a,b:b.dataset.b}),'Peace imposed.');break;
 case'peacepick':{const pa=$('pzA').value,pb=$('pzB').value;if(pa===pb){toast('Pick two different nations.');break}if(confirm('Force peace between these two nations now?'))act(()=>api('POST','/api/admin/peace',{a:pa,b:pb}),'Peace imposed.');break}
 case'firesout':if(confirm('Put out every fire on the globe for everyone?'))act(()=>api('POST','/api/admin/fires-out',{}),'All fires put out.');break;
 case'ccancel':if(confirm('Cancel this Council vote?'))act(()=>api('POST','/api/admin/council-cancel',{prop:b.dataset.r}),'Vote cancelled.');break;
 case'clearflags':act(()=>api('POST','/api/admin/clear-flags',{id}),'Flags dismissed.');break;
 case'savecfg':dirtyForm=false;act(()=>api('POST','/api/admin/config',{config:{cd:$('c_cd').value,income:$('c_income').value,xp:$('c_xp').value,protectH:$('c_protectH').value,electionH:$('c_electionH').value,eventsOn:$('c_eventsOn').value==='1',conquest:$('c_conquest').value==='1',weakRule:$('c_weakRule').value==='1',nukeTest:$('c_nukeTest').value==='1',councilAuto:$('c_councilAuto').value==='1',aiBoss:$('c_aiBoss').value==='1',lastStandH:$('c_lastStandH').value,war:$('c_war').value==='1',signups:$('c_signups').value==='1',motd:$('c_motd').value,bots:$('c_bots').value,botWar:$('c_botWar').value,botRetire:$('c_botRetire').value==='1'}}),'Settings saved.');break;
 case'announce':{const t=$('ann').value;act(async()=>{await api('POST','/api/admin/announce',{text:t});$('ann').value=''},'Announcement posted.');break}
 case'clearchat':if(confirm('Delete every chat message?'))act(()=>api('POST','/api/admin/clear-chat',{}),'Chat cleared.');break;
 case'botadd':act(()=>api('POST','/api/admin/bot-add',{}),'AI nation added.');break;
 case'botrm':{const bid=b.dataset.bot;if(confirm('Remove this AI nation? Its land becomes free.'))act(()=>api('POST','/api/admin/bot-remove',{bot:bid}),'AI nation removed.');break}
 case'rotate':if(confirm('Change the secret admin link? The current address will stop working and you will be taken to the new one.'))api('POST','/api/admin/rotate-link',{}).then(r=>{location.href=r.adminPath}).catch(e=>toast(e.message));break;
 case'rollback':{const m=+b.dataset.m;const c=prompt(`Roll the whole world back ${b.textContent.replace('⏪','').trim()}? Every nation goes back; everyone's screen refreshes. Type ROLLBACK to confirm.`);if(c==='ROLLBACK')act(()=>api('POST','/api/admin/rollback',{minutes:m,confirm:'ROLLBACK'}),'World rolled back.');break}
 case'rollsnap':{const c=prompt('Restore the world to this snapshot? Type ROLLBACK to confirm.');if(c==='ROLLBACK')act(()=>api('POST','/api/admin/rollback',{snap:b.dataset.s,confirm:'ROLLBACK'}),'World restored.');break}
 case'tl':tlLoad(id);break;
 case'tlk':if(TL&&TL.id===id){TL.f.k=b.dataset.k;tlRender(id,TL.T,TL.f)}break;
 case'restore':{const c=prompt(`Restore ${name}'s nation to ${b.dataset.w}? Only this nation changes. Type RESTORE to confirm.`);if(c==='RESTORE')api('POST','/api/admin/restore-nation',{id,snap:b.dataset.s,confirm:'RESTORE'}).then(r=>{toast(r.revived?'Nation brought back.':`Nation restored${r.skipped?` — ${r.skipped} province(s) now held by others were left with them`:''}.`);load();tlLoad(id)}).catch(e=>toast(e.message));break}
 case'nkdemo':{const a=$('nkA').value,bb=$('nkB').value;if(a===bb){toast('Pick two different nations.');break}window.open(`/play?replay=demo&a=${encodeURIComponent(a)}&b=${encodeURIComponent(bb)}`,'_blank');break}
 case'wipe':{const c=prompt('This deletes EVERY nation. Type WIPE to confirm.');if(c==='WIPE')act(()=>api('POST','/api/admin/wipe-world',{confirm:'WIPE'}),'World wiped. A backup was saved.');break}}});
document.addEventListener('input',e=>{if(tab==='settings'&&/^c_/.test(e.target.id))dirtyForm=true;if(e.target.id==='tlq'&&TL){TL.f.q=e.target.value;const pos=e.target.selectionStart;tlRender(TL.id,TL.T,TL.f);const i=$('tlq');i.focus();i.setSelectionRange(pos,pos);return}if(e.target.id==='q'){q=e.target.value;const pos=e.target.selectionStart;$('main').innerHTML=players();const i=$('q');i.focus();i.setSelectionRange(pos,pos)}});
load();setInterval(()=>{if(!document.hidden)load()},10000);
</script></body></html>
