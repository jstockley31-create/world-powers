<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#090d12;--s1:#0f151c;--s2:#141c25;--s3:#1a2430;--bd:#1f2a36;--bd2:#2a3746;--tx:#e6edf3;--mu:#8b98a5;--mu2:#5d6b79;--ac:#d4a64a;--bl:#4c9aff;--gn:#3fb950;--rd:#f85149;--yl:#e3b341;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bl);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--bd2);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#3b4b5c}.btn.pri{background:var(--ac);border-color:var(--ac);color:#17120a;font-weight:600}.btn.dng{background:#3a1d1f;border-color:#5f2b2e;color:#ffc1bd}.btn.ok{background:#1d3a26;border-color:#2c5a39;color:#b8f0c4}.btn.sm{padding:4px 9px;font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;outline:none}input:focus,textarea:focus{border-color:var(--ac)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-left:24px;min-width:0;flex:0 1 auto}.tabs button{white-space:nowrap}.top>.btn,#upd{flex:none}@media(max-width:1300px){#upd{display:none}}.tabs button{background:none;border:0;padding:8px 14px;border-radius:6px;color:var(--mu);cursor:pointer;font-weight:500}.tabs button.on{background:var(--s3);color:var(--tx)}.tabs .n{background:var(--rd);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px;margin-left:5px;font-weight:700}
.sp{margin-left:auto}.mu{color:var(--mu)}.gn{color:var(--gn)}.rd{color:var(--rd)}.yl{color:var(--yl)}.ac{color:var(--ac)}
main{max-width:1300px;margin:0 auto;padding:22px}
h1{font-size:21px;margin:0 0 4px;font-weight:600}.sub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}.hdwrap{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}.hdl{max-height:70vh;overflow-y:auto}.hdi{padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}.hdi:hover{background:var(--s2,var(--s3))}.hdi.sel{background:var(--s3);box-shadow:inset 3px 0 0 var(--ac)}.hdth{max-height:52vh;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:10px}.hdm{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;max-width:88%}.hdm.me{align-self:flex-end;border-color:#24456e;background:#0f1d30}textarea#hdReply{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit;box-sizing:border-box}@media(max-width:900px){.hdwrap{grid-template-columns:1fr}.hdl{max-height:40vh}}
.panel>header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap;gap:8px}.panel>header h2{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:#c5ced8}
.panel>.bd{padding:16px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px 16px}
.card span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.card b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}.card small{color:var(--mu);font-size:12px}
.card.ok{border-left:3px solid var(--gn)}.card.warn{border-left:3px solid var(--yl)}.card.bad{border-left:3px solid var(--rd)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--s2)}
tbody tr{cursor:default}.aud{border-left:3px solid;padding:8px 10px;margin:6px 0;background:var(--bg);border-radius:0 6px 6px 0}.auditems{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-top:4px}.fxl{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13.5px;flex-wrap:wrap}.fxl input[type=checkbox]{width:16px;height:16px;flex:none}tbody tr.click{cursor:pointer}tbody tr:hover td{background:#121a23}
td.r,th.r{text-align:right}.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd2);background:var(--s2);white-space:nowrap}
.tag.g{border-color:#2c5a39;color:#9fe0ae;background:#13241a}.tag.r{border-color:#5f2b2e;color:#ffb4ae;background:#2a1517}.tag.y{border-color:#5d4a1f;color:#f0d9a4;background:#241c0d}.tag.b{border-color:#24456e;color:#a9cdfd;background:#0f1d30}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.mono{font:12px var(--mono)}

#drawer.open{transform:none}#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--s1);z-index:2}#drawer .db{padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16202b;border:1px solid var(--bd2);border-left:3px solid var(--ac);padding:10px 16px;border-radius:6px;z-index:50;display:none}
#gate{max-width:420px;margin:15vh auto;text-align:center}
.log div{padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;display:flex;gap:12px}.log time{color:var(--mu2);font:11.5px var(--mono);width:120px;flex:none}
@media(max-width:900px){.cols{grid-template-columns:1fr}.tabs{margin-left:0;max-width:100%}header.top{flex-wrap:wrap;height:auto;padding:10px}}
.kv{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02)}.kv span{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}.kv b{font-size:17px}

.cw-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}.cw-tile{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#0c1218;border-top:3px solid var(--bd2)}.cw-tile b{display:block;font-size:26px;line-height:1.1}.cw-tile span{font-size:12.5px;color:var(--mu)}.cw-tile.red{border-top-color:#e5534b}.cw-tile.red b{color:#ff8f87}.cw-tile.amber{border-top-color:#d4a64a}.cw-tile.amber b{color:#f0c674}.cw-tile.green{border-top-color:#3fb950}.cw-tile.green b{color:#7ee08f}.cw-tile.lock{border-top-color:#a371f7}.cw-tile.lock b{color:#c9a8ff}
.cw-sec{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:15px;font-weight:700}.cw-sec small{font-weight:400;color:var(--mu);font-size:12.5px}
.cw-case{border:1px solid var(--bd);border-left:5px solid var(--bd2);border-radius:10px;padding:12px 14px;margin:0 0 10px;background:#0c1218}.cw-case.red{border-left-color:#e5534b;background:linear-gradient(90deg,#24111299,#0c1218 50%)}.cw-case.amber{border-left-color:#d4a64a;background:linear-gradient(90deg,#211a0b99,#0c1218 50%)}.cw-case.green{border-left-color:#3fb950}
.cw-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cw-h .nm{font-size:16px;font-weight:700}.cw-pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 9px;letter-spacing:.02em}.cw-pill.red{background:#3a1416;color:#ff9b94;border:1px solid #7a2d2d}.cw-pill.amber{background:#2a2110;color:#f0c674;border:1px solid #6b5521}.cw-pill.green{background:#10261a;color:#7ee08f;border:1px solid #2b6b3c}.cw-pill.conf{background:#16202b;color:#c5ced8;border:1px solid var(--bd2)}
.cw-rec{margin:10px 0;padding:9px 11px;border-radius:8px;background:#121b25;border:1px solid var(--bd2);font-size:14px;line-height:1.5}.cw-rec b{color:#fff}
.cw-ev{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}.cw-ev li{margin:3px 0}.cw-ev.strong li::marker{color:#ff8f87}
.cw-spark{display:flex;align-items:flex-end;gap:1px;height:34px;margin:8px 0 2px}.cw-spark i{flex:1;background:#2b4a6b;border-radius:1px 1px 0 0;min-height:1px}.cw-spark i.z{background:#1a2430}
.cw-chart text{font:12px Inter,system-ui,sans-serif;fill:#c5ced8}.cw-chart .ax{fill:#8b98a5;font-size:11px}
details.cw-more summary{cursor:pointer;color:var(--mu);font-size:13px;margin-top:6px}
.vbox{border:1px solid #2a3746;border-left:4px solid #2a3746;border-radius:10px;padding:12px 14px;margin:0 0 10px;background:#0c1218}
.vbox.vred{border-color:#6b2a2d;border-left-color:#e5534b;background:linear-gradient(90deg,#2a1214,#0c1218 55%)}.vbox.vamber{border-color:#5d4a1f;border-left-color:#d4a64a;background:linear-gradient(90deg,#211a0b,#0c1218 55%)}.vbox.vok{border-left-color:#3fb950}
.vh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.vt{font-weight:800;font-size:17px;letter-spacing:.01em}.vred .vt{color:#ff8f87}.vamber .vt{color:#f0c674}.vok .vt{color:#7ee08f}
.vs{font-size:12px;color:#8b98a5;border:1px solid #2a3746;border-radius:20px;padding:1px 8px}.vn{font-size:15px}
.vsub{margin:4px 0 6px;color:#c5ced8;font-size:13.5px}.vwhy{margin:0 0 6px;padding-left:20px;font-size:13px;color:#e6edf3}.vwhy li{margin:2px 0}.vnet{margin:0 0 6px;font-size:13px;color:#f0c674}
.vdec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #1d2731;padding-top:8px;margin-top:6px}.vdec .sp{flex:1}
.tblw{overflow-x:auto}

.co [data-act="savenation"],.co [data-act="resetcd"],.co [data-act="resetnation"],.co [data-act="giftone"],.co [data-act="setpw"],.co [data-act="delacct"],.co .field:has(#newpw){display:none!important}
.co section.panel:has([data-act="giftone"]),.co section.panel:has([data-act="setrogue"]),.co section.panel:has([data-act="fixapply"]){display:none!important}
.co section.panel:has([data-act="savenation"]) input,.co section.panel:has([data-act="savenation"]) select{pointer-events:none;background:transparent;border-color:transparent}
.co [data-act="clearflags"],.co [data-act="hcset"],.co [data-act="rollback"],.co [data-act="rollsnap"],.co [data-act="restore"],.co [data-act="wipe"],.co [data-act="rotate"],.co [data-act="savecfg"],.co [data-act="giftall"],.co [data-act="bosscmd"],.co [data-act="bossgrant"],.co [data-act="bossnow"],.co [data-act="bossraise"],.co [data-act="bossretire"],.co [data-act="bosssave"],.co [data-act="botadd"],.co [data-act="botrm"],.co [data-act="fixrogue"],.co [data-act="hcfix"],.co [data-act="wfix"],.co [data-act="nukeacc"],.co [data-act="nkdemo"],.co [data-act="pkcash"],.co [data-act="findel"],.co [data-act="finedit"],.co [data-act="finsave"],.co [data-act="fincancel"],.co [data-act="snstart"],.co [data-act="snend"],.co [data-act="snext"],.co [data-act="sncancel"],.co [data-act="snrename"],.co [data-act="snrestore"],.co [data-act="cdsave"],.co [data-act="cdoff"],.co [data-act="cdseason"],.co [data-act="cdremind"],.co [data-act="dstrike"],.co [data-act="dsave"],.co [data-act="bldisband"]{display:none!important}
</style></head><body>
<header class="top"><b>WORLD POWERS</b><span class="tag y">ADMIN</span><nav class="tabs" id="tabs"></nav><span class="sp mu" id="upd"></span><a class="btn sm" href="/">Back to game</a><meta name="robots" content="noindex"></header>
<main id="main"><p class="mu">Loading…</p></main>
<aside id="drawer"></aside><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':Math.round(v).toLocaleString('en-US');
const money=v=>v==null?'—':(v<0?'−$':'$')+Math.round(Math.abs(v)).toLocaleString('en-US');
const ago=t=>{if(!t)return'never';const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+'m ago':s<86400?Math.floor(s/3600)+'h ago':Math.floor(s/86400)+'d ago'};
const dur=ms=>{const s=ms/1e3;return s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m':Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h'};
const bytes=b=>b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(1)+' KB';
const when=t=>new Date(t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const RANKS=['Chieftain','Elder','Mayor','Governor','Senator','Prime Minister','President','Sovereign','Emperor','Supreme Leader','World Power'];
let D=null,tab=location.hash==='#helpdesk'?'helpdesk':'dash',q='',sel=null,dirtyForm=false;
async function api(method,url,body){const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Error '+r.status),{status:r.status});return j}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3500)}
async function load(){try{D=await api('GET','/api/admin/overview');$('upd').textContent='Updated '+new Date().toLocaleTimeString();render()}catch(e){if(e.status===401||e.status===403){$('tabs').innerHTML='';$('main').innerHTML=`<div id="gate"><h1>Admins only</h1><p class="mu">${e.status===401?'Sign in to the game with an admin account first.':'Your account does not have admin access.'}</p><a class="btn pri" href="/">Go to the game</a></div>`;return}$('upd').innerHTML='<span class="rd">Connection problem</span>'}}
const TABS=[['dash','Dashboard'],['war','War room'],['repair','🛠 Repair'],['alliances','🛡 Alliances'],['players','Players'],['cheat','Cheat watch'],['stats','Analytics'],['mod','Moderation'],['boss','⚠ Rising Power'],['crisis','🌍 World events'],['fin','💵 Money'],['sup','💛 Supporters'],['polls','📋 Polls'],['seasons','🏆 Seasons'],['casino','🎰 Casino'],['helpdesk','❓ Helpdesk'],['lab','🧪 Test lab'],['chaos','💥 Chaos world'],['market','🛒 World market'],['bugs','Bugs'],['ideas','Ideas'],['world','World'],['settings','Game settings'],['log','Activity log']];
const CO_TABS=['players','mod','cheat','polls','bugs','ideas'];const isCo=()=>D&&D.role==='coadmin';const myTabs=()=>isCo()?[...TABS.filter(([k])=>CO_TABS.includes(k)),['finale','☢ Finale']]:[...TABS,['coad','👥 Co-admins']];
function render(){if(isCo()&&!CO_TABS.includes(tab)&&tab!=='finale')tab='players';{const tg=document.querySelector('header.top .tag');if(tg)tg.textContent=isCo()?'CO-ADMIN':'ADMIN'}document.body.classList.toggle('co',isCo());const fc=D.flags.filter(f=>Date.now()-f.t<864e5).length;$('tabs').innerHTML=myTabs().map(([k,t])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${t}${k==='cheat'&&fc?`<span class="n">${fc}</span>`:''}${k==='mod'&&D.reports.filter(r=>!r.done).length?`<span class="n">${D.reports.filter(r=>!r.done).length}</span>`:''}${k==='sup'&&SUPD&&SUPD.claims.filter(c=>c.st==='wait').length?`<span class="n">${SUPD.claims.filter(c=>c.st==='wait').length}</span>`:''}${k==='helpdesk'&&D.hd?`<span class="n">${D.hd}</span>`:''}${k==='bugs'&&(D.bugs||[]).filter(b=>!b.done).length?`<span class="n">${D.bugs.filter(b=>!b.done).length}</span>`:''}${k==='ideas'&&(D.ideas||[]).filter(b=>!b.done).length?`<span class="n">${D.ideas.filter(b=>!b.done).length}</span>`:''}</button>`).join('');
 const a=document.activeElement;if(a&&$('main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(dirtyForm&&(tab==='settings'||tab==='boss'||tab==='crisis'||tab==='fin'||tab==='seasons'))return;
 const KEEP={};$('main').querySelectorAll('input[data-keep][id]').forEach(x=>KEEP[x.id]=x.type==='checkbox'?x.checked:x.value);
 const keep={};$('main').querySelectorAll('select[id]:not([id^=c_]):not([id^=fn_])').forEach(x=>keep[x.id]=x.value); // the 10-second refresh keeps choices you've made
 $('main').innerHTML=({dash,war,repair:repairTab,alliances:alliancesTab,players,cheat,stats,mod,boss,crisis,fin:finTab,sup:supTab,coad:coadTab,finale:finaleTab,polls:pollsTab,seasons:seasTab,casino:casTab,bugs,ideas,helpdesk:hdTab,lab:labTab,chaos:chaosTab,market:marketTab,world,settings,log})[tab]();
 for(const [k,v] of Object.entries(keep)){const x=$(k);if(x&&[...x.options].some(o=>o.value===v))x.value=v}
 for(const [k,v] of Object.entries(KEEP))if(document.getElementById(k)&&$('main').contains($(k))){const x=$(k);if(x.type==='checkbox')x.checked=v;else x.value=v}}
// Polls: questions sent to every player (each sees a pop-up once); results update here
let OPV=[],POLLS=null,POLLN=0,pollsAt=0,pdraft={title:'',intro:'',hours:'0',qs:[{q:'',opts:'',multi:false,other:false}]},pOpen={};
async function pollsLoad(){pollsAt=Date.now();try{const j=await api('POST','/api/admin/poll',{op:'list'});POLLS=j.polls;POLLN=j.players;OPV=j.opVotes||[];if(tab==='polls')render()}catch(e){toast(e.message)}}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function pollsTab(){if(!POLLS||Date.now()-pollsAt>8000)pollsLoad();const L='ABCDEFGH';
 const qb=pdraft.qs.map((Q,i)=>`<div style="border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Question ${i+1}</b>${pdraft.qs.length>1?`<button class="btn" data-act="pdel" data-id="${i}">Remove</button>`:''}</div>
  <input id="pd_q_${i}" style="width:100%" maxlength="300" placeholder="Would you rather have…" value="${esc(Q.q)}">
  <label class="mu" style="display:block;font-size:12px;margin:8px 0 4px">Answers, one per line (they show as A, B, C, D…)</label><textarea id="pd_o_${i}" rows="4" style="width:100%" placeholder="More nations to fight
More trade options
Bigger world events
New weapons">${esc(Q.opts)}</textarea>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px"><label><input type="checkbox" id="pd_m_${i}" ${Q.multi?'checked':''}> Players can pick more than one</label><label><input type="checkbox" id="pd_w_${i}" ${Q.other?'checked':''}> Let players write their own answer</label></div></div>`).join('');
 const form=panel('New poll',`<div style="display:grid;gap:8px"><input id="pd_title" maxlength="120" placeholder="Title, e.g. Help choose the next update" value="${esc(pdraft.title)}">
  <textarea id="pd_intro" rows="2" maxlength="600" placeholder="Optional message to players">${esc(pdraft.intro)}</textarea>
  <label class="mu" style="font-size:12px">Open for <select id="pd_hours">${[['0','Until I close it'],['24','24 hours'],['72','3 days'],['168','7 days']].map(([v,l])=>`<option value="${v}" ${pdraft.hours===v?'selected':''}>${l}</option>`).join('')}</select></label>

function world(){const ev=D.event,cs=D.council||{props:[]};const open=cs.props.filter(p=>p.status==='open');const nm=id=>D.players.find(p=>p.id===id)?.nation?.name||D.bots.find(b=>b.id===id)?.name||'?';

 <div class="cols"><div>${panel(`Wars in progress (${X.wars.length})`,X.wars.length?`<div style="overflow:auto;max-height:620px"><table><thead><tr><th>Started by</th><th>Against</th><th>Since</th><th class="r">Battles (24 h)</th><th class="r">Aggression</th><th></th></tr></thead><tbody>${X.wars.map(w=>`<tr><td><b>${esc(w.byName)}</b>${ai(w.byAI)}</td><td>${esc(w.vsName)}${ai(w.vsAI)}${w.pact?' <span class="tag g" style="font-size:10px;padding:0 5px">pact</span>':''}</td><td class="mu">${ago(w.since)}</td><td class="r">${w.battlesBy} / ${w.battlesVs}</td><td class="r">${w.aggrBy} / ${w.aggrVs}</td><td><button class="btn sm" data-act="peace" data-a="${esc(w.by)}" data-b="${esc(w.vs)}">Force peace</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="mu" style="margin:0">No wars right now.</p>')}
 ${panel(`Aggression watch (${X.hot.length})`,X.hot.length?`<p class="mu" style="margin-top:0;font-size:13px">Nations at 20+ aggression. 35 brings an automatic Council condemnation vote, 50 automatic sanctions, 75 rogue status. Defending yourself adds no aggression at all, so a high number here means they keep starting fights.</p><table><thead><tr><th>Nation</th><th class="r">Aggression</th><th class="r">Wars</th><th>Status</th><th></th></tr></thead><tbody>${X.hot.map(h=>`<tr${h.ai?'':` class="click" data-p="${esc(h.id)}"`}><td><b>${esc(h.name)}</b>${ai(h.ai)}${h.boss?' <span class="tag r" style="font-size:10px;padding:0 5px">Rising Power</span>':''}</td><td class="r">${h.aggr}</td><td class="r">${h.wars}</td><td>${st(h)}</td><td class="r">${h.rogue||h.sanctioned?`<button class="btn sm" data-act="fixrogue" data-id="${esc(h.id)}" data-n="${esc(h.name)}">Clear</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<p class="mu" style="margin:0">Nobody is close to sanctions.</p>')}
</div>
 <div>${panel('Emergency tools',`<p class="mu" style="margin-top:0;font-size:13px"><b>Force peace</b> ends a war between two nations right away and tells the world in chat. Use it to stop griefing or a war started by mistake; either side can declare war again later.</p><div class="row" style="gap:6px;flex-wrap:wrap"><select id="pzA" style="max-width:100%">${opt}</select><span class="mu">and</span><select id="pzB" style="max-width:100%">${opt}</select><button class="btn" data-act="peacepick">Force peace</button></div>
 <p class="mu" style="font-size:13px;margin:16px 0 6px"><b>Put out all fires</b> removes every burning province and its smoke from the globe for everyone (${X.fires} burning now). The damage already done stays.</p><button class="btn dng" data-act="firesout" ${X.fires?'':'disabled'}>Put out all fires</button>`)}

function nukesPanel(){const L=D.nukes||[],all=[...D.players.filter(p=>p.nation).map(p=>({id:p.id,n:p.nation.name})),...D.bots.map(b=>({id:b.id,n:b.name}))].sort((a,b)=>a.n.localeCompare(b.n));const opt=sel=>all.map((x,i)=>`<option value="${esc(x.id)}" ${i===sel?'selected':''}>${esc(x.n)}</option>`).join('');

function tlRender(id,T,f){const box=$('tl');if(!box)return;const H=T.hist,K=[['cash','Cash',money],['prov','Provinces',num],['troops','Troops',num],['ap','Approval',v=>v+'%']];
 const spark=(k,l,fm)=>{const v=H.filter(h=>!h.gone&&h[k]!=null).map(h=>h[k]);if(v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),w=220,hh=40,pts=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(hh-2-(mx===mn?.5:(x-mn)/(mx-mn))*(hh-4)).toFixed(1)}`).join(' ');return`<div style="min-width:220px"><div class="mu" style="font-size:11px">${l.toUpperCase()} · now ${fm(v[v.length-1])}</div><svg width="${w}" height="${hh}" style="display:block"><polyline points="${pts}" fill="none" stroke="var(--ac,#6aa9ff)" stroke-width="1.6"/></svg><div class="mu" style="font-size:11px;display:flex;justify-content:space-between"><span>low ${fm(mn)}</span><span>high ${fm(mx)}</span></div></div>`};
 const rows=H.slice().reverse().map((h,i,a)=>{const p=a[i+1];const bad=p&&!h.gone&&!p.gone&&(h.prov<p.prov||h.cash<p.cash*.6||h.troops<p.troops*.6);return`<tr${bad?' style="background:rgba(255,80,80,.08)"':''}><td>${h.now?'<b>Now</b>':when(h.t)}</td>${h.gone?'<td colspan="5" class="mu">No nation</td>':`<td class="r num">${money(h.cash)}</td><td class="r num">${money(h.debt)}</td><td class="r num">${h.prov}</td><td class="r num">${num(h.troops)}</td><td class="r num">${h.ap}%</td>`}<td class="r">${h.snap&&!h.gone?`<button class="btn sm" data-act="restore" data-id="${esc(id)}" data-s="${esc(h.snap)}" data-w="${esc(when(h.t))}">Restore</button>`:''}</td></tr>`}).join('');
 const KINDS=[['all','All'],['action','Actions'],['refused','Refused'],['game','Nation news'],['note','Notifications'],['chat','Chat'],['admin','Admin'],['flag','Flags'],['report','Reports'],['nuke','Nukes']];
 const ev=T.events.filter(e=>(f.k==='all'||e.k===f.k)&&(!f.q||e.x.toLowerCase().includes(f.q.toLowerCase())));
 const col={action:'g',refused:'r',game:'b',note:'',chat:'',admin:'y',flag:'r',report:'r',nuke:'r'};
 box.innerHTML=`<div class="row" style="gap:16px;flex-wrap:wrap;margin-bottom:12px">${K.map(k=>spark(...k)).join('')||'<span class="mu">History appears once a couple of snapshots exist.</span>'}</div>
 <details style="margin-bottom:12px"><summary style="cursor:pointer"><b>Hourly history</b> <span class="mu">— rows in red show a big drop. “Restore” puts just this nation back (cash, stockpiles, army, stats and any provinces nobody else holds now); everyone else is untouched, and you can undo it with “Undo” under Game settings → Roll back the world.</span></summary><div style="overflow:auto;max-height:300px"><table><thead><tr><th>Time</th><th class="r">Cash</th><th class="r">Debt</th><th class="r">Prov.</th><th class="r">Troops</th><th class="r">Approval</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></details>
 <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">${KINDS.map(([k,l])=>`<button class="btn sm ${f.k===k?'pri':''}" data-act="tlk" data-k="${k}" data-id="${esc(id)}">${l} <span class="mu">${k==='all'?T.events.length:T.events.filter(e=>e.k===k).length}</span></button>`).join('')}<input id="tlq" placeholder="Search…" value="${esc(f.q||'')}" style="flex:1;min-width:120px"></div>
 <div class="log" style="max-height:420px;overflow:auto">${ev.slice(0,400).map(e=>`<div><time>${when(e.t)}</time><span><span class="tag ${col[e.k]||''}" style="font-size:10.5px">${e.k}</span> ${esc(e.x)}</span></div>`).join('')||'<div class="mu">Nothing matches.</div>'}</div>`}
let TL=null;async function tlLoad(id){const box=$('tl');if(box)box.innerHTML='<span class="mu">Loading…</span>';try{TL={id,T:await api('POST','/api/admin/timeline',{id}),f:{k:'all',q:''}};tlRender(id,TL.T,TL.f)}catch(e){if(box)box.innerHTML=`<span class="mu">${esc(e.message)}</span>`}}
