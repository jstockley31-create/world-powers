<h1>Updates</h1>
<p class="lede">The latest changes to World Powers, newest first. Have an idea? Send it from the game's menu with “Report a bug or idea”.</p>
<div id="list"></div>
</div>
<script>
/* newest first; keep the last 10 */
const UPDATES=[
 {when:'Nov 22',title:'Bigger, rarer jackpots',items:[
  'Both casino jackpots now hit about <b>5× less often</b>, so they build up much bigger: around $50B on average instead of $10B. Every bet still adds 1% to the pot.']},
 {when:'Nov 22',title:'Expeditions overhaul',items:[
  'Expeditions now cost and pay in line with your economy, so they are worth it at any size.',
  'Choose <b>Careful</b>, <b>Standard</b> or <b>Daring</b>. Each card shows your exact chances and usual haul before you send it.',
  'Halfway decisions: when your team hits a sealed temple, a storm or a rival ship, you choose to push on or play it safe.',
  'Teams earn up to 5 stars at each destination. There are 10 artifacts to collect, each adding 1% to all expedition rewards, and rare legendary finds pay about six times the cost.']},
 {when:'Nov 22',title:'Rising Power fix',items:[
  'Fixed a bug where the <b>Rising Power</b> could quietly lose its status minutes after rising. Once a Rising Power appears, it now stays until the world brings it down.']},
 {when:'Nov 22',title:'New voting site',items:[
  '<b>Apex Web Gaming</b> replaces MPOG 100 as the last vote coin in the menu. It pays the same treasury bonus, every 6 hours.']},
 {when:'Nov 22',title:'World money on the Rankings page',items:[
  '<b>World money at a glance.</b> The Rankings leaderboard now opens with a World money strip: all the money in the world how much players and AI nations hold, world GDP and both casino jackpots, each with a small green or red arrow showing the change over the last 24 hours. Totals only: no nation\'s treasury is shown.',
  '<b>All world statistics</b> on the strip opens the World tab, with the money-over-time chart and more.']},
 {when:'Nov 22',title:'Casino: jackpot, weekly tournament, a new machine and poker opponents',items:[
  '<b>A shared slots jackpot.</b> 1% of every slot stake goes into one pot, shown live at the top of the casino. Any spin on any machine can win all of it; bigger stakes have a better chance. It starts at $1B.',
  '<b>A tables jackpot too.</b> Blackjack, roulette, baccarat, craps, dice, video poker and crash share a second pot that works the same way: 1% of every stake, starting at $1B, and any bet can win it.',
  '<b>Weekly slots tournament.</b> The three best single win multipliers of the week share a prize pool (60% / 30% / 10%) that grows with every spin. Stakes of $1M or more count, so small nations can win it. Monday to Monday, UTC.',
  '<b>Big-win celebrations.</b> Wins of 20× or more get a banner, a counting total and a coin shower: Big win, Mega win (50×), Epic win (100×).',
  '<b>Big wins feed.</b> The top of the casino lists recent wins of 5× or more by any nation.',
  '<b>One short strip.</b> Both jackpots, the tournament and the latest big win sit in one compact row at the top of the casino. Press <b>Details</b> for the full boards and how each one works.',
  '<b>New machine: Victory Wheel.</b> Five reels, ten lines, and a 16-wedge bonus wheel worth 8× to 500× your stake.',
  '<b>Poker always has a game.</b> Sit down alone and house players take the empty seats. They leave when you do.']},
 {when:'Nov 22',title:'See where your money goes',items:[
  '<b>Money in and out.</b> The top of the Economy page now shows where your treasury came from and where it went: taxes, province income, market sales and casino wins on one side; each part of your budget, war costs, upkeep, interest, building, attacks, market purchases and casino losses on the other. Biggest amounts first, and it names your biggest drain.',
  '<b>Today, Yesterday or the last 7 days.</b> Switch with the buttons on the panel. Tracking starts with this update, so earlier days are empty at first.',
  '<b>Private.</b> Only you can see your own numbers. Thanks to the player who suggested this.']},
 {when:'Nov 21',title:'New Development page: build up your nation',items:[
  '<b>A new Development page</b> in the menu, with eight lasting ways to improve your nation. Every bonus is small, and prices grow with your own income, so they are a real choice for small and large nations alike.',
  '<b>Prices:</b> see the new Development price list at the top of this page.',
  '<b>The World Casino has doubled in size.</b> Four new games and four new slot machines, all at the same $5B table limit.',
  '<b>Bring a friend, get paid properly.</b> Invite rewards are now worth having. When a friend joins through your link and founds a nation, you get 10 tax collections of your own income (at least $10M) and they start with an extra $25M. When they reach Governor, you get another 40 tax collections (at least $50M). Your link is on the Overview page and under Account. Rewards are not given for players on your own network.',
  '<b>Played Season 1 only?</b> If you joined during the season, your season nation ended with it. The founding screen now explains this, and your season reward is added the moment you found a nation in the permanent world.',
  '<b>Development prices are now the same for every nation.</b> Before, the price depended on your own income, so big nations paid hundreds of billions for a level that a small nation could buy for almost nothing and keep for good. Now there is one price list, and it climbs steeply by level.',
  '<b>Ministries:</b> level 1 costs $100M and each level costs 3 times the last ($300M, $900M, $2.7B and so on, up to $1.97T for level 10). <b>Other upgrades:</b> level 1 costs $1B and each level costs 5 times the last, up to $625B for level 5. <b>Infrastructure programs:</b> your first costs $25B, then $100B, $400B and $1.6T. Trade routes are unchanged.',
  'Levels you already own stay yours. Nothing is refunded or taken away.',
  '<b>Six digital slot machines, six different games.</b> They no longer share the same reels with different pictures. Each one now plays the way a different kind of online casino slot does, and each pays back about 94% over time.',
  '<b>Neon Empire:</b> the classic. Five reels, ten paylines, wilds, and free spins that pay double.',
  '<b>War Chest:</b> 243 ways to win. Symbols only have to be on neighbouring reels, not on a line. Three bonus symbols let you open a prize crate.',
  '<b>Oil Baron:</b> cascading reels. Winning symbols are removed, new ones drop in, and every cascade in a row raises the multiplier: ×1, ×2, ×3, ×5. In free spins it is ×2, ×4, ×6, ×10.',
  '<b>Spy Vault:</b> expanding wilds. A wild on the middle reels fills its whole reel, locks, and gives a free respin. Three bonus symbols open the safe-cracking bonus.',
  '<b>World Tour:</b> six reels that each show 2 to 6 symbols on every spin, for up to 46,656 ways to win, with cascades. Three bonus symbols spin the bonus wheel for up to 250×.',
  '<b>Nuclear Winter:</b> a 6 by 5 grid with no lines at all. Eight or more of the same symbol anywhere pays, and wins cascade. In free spins, multiplier bombs of ×2 to ×100 land and multiply the whole spin.',
  '<b>Bonus rounds you actually play:</b> open a crate, crack safes until the alarm goes off, or spin the wheel yourself. One spin can pay at most 1,000× your stake.',
  '<b>Baccarat:</b> bet on Player, Banker or Tie, dealt by the standard casino rules.',
  '<b>Video poker:</b> Jacks or Better. Hold the cards you want, draw once, and get paid from the table. A royal flush pays 250×.',
  '<b>Craps:</b> pass line and don\'t pass with odds bets of up to 2× that pay at the true chance, plus the one-roll field bet.',
  '<b>Crash:</b> a multiplier climbs from 1.00× until it crashes. Cash out in time to win, or set an auto cash-out. Rounds stop at 100×.',
  '<b>Auto spin stops for a bonus.</b> If a bonus round lands while the slots are on auto spin, auto spin stops so you can play the bonus yourself.',
  '<b>Roulette: bet on as many spots as you like.</b> Tap the layout to place chips, tap a spot again to add more, then press Spin. Undo and Clear are next to it, and your chips stay on the table for the next spin.',
  '<b>Development complete notice:</b> when an infrastructure program finishes you get a notification and a line in your recent events.',
  'Every new game is provably fair like the others, and the bonus prizes on the slot machines are drawn by the server when the bonus starts, so which safe or crate you open does not change what you win.',
  '<b>Fixed:</b> voting with the gold coins now pays your bonus and the coin stops flashing. Before this fix the coins opened the voting site but the game did not count the vote. If you voted with a coin earlier today, vote again when it lights up to get your bonus.',
  '<b>Leader names are now private.</b> Other players only see your nation\'s name, or "New leader" before you found one. You still see your own leader name, and the game staff can see it for moderation. To mention someone in chat, type @ and their nation\'s name.',
  '<b>No more waiting to launch a nuke.</b> Once you are at war and your warhead is armed, you can launch it straight away (after the usual 10 minutes of mobilizing that every attack has). The 12- and 24-hour war requirements are gone.',
  '<b>Casino limit is now $5B</b> on blackjack, roulette, slots and dice (was $25B). The Sovereign poker table now has blinds of $25M/$50M and a buy-in of $1B to $5B.',
  '<b>Fixed:</b> the GDP change in the top bar and on the Economy page now always show the same number, both measured over the last 24 hours.',
  '<b>Founding a nation is easier on a computer:</b> on a short window the Establish nation button used to sit below the bottom of the screen. It is now pinned in view.',
  '<b>Voting is now a row of small coins</b> at the bottom of the side menu on computers, one per voting site. A coin flashes when that site\'s bonus is ready and can only be clicked then. A dim coin shows how long is left when you point at it.',
  '<b>Fixed:</b> Rankings is back in the side menu on computers, and the whole menu now fits without scrolling on most windows.',
  '<b>Ministries:</b> Treasury, Defense, Interior, Foreign Affairs and Science, each from level 1 to 10. Per level: +1% tax revenue, +1% attack and defence strength, 3% fewer far-province breakaways, 3% less aggression from your attacks, and 1.5% cheaper research.',
  '<b>Infrastructure programs</b> (built once, one at a time): a power grid (production +6%), a rail network (army upkeep −8%), universities (research −8%) and deep-water ports (trade routes +25%, daily import limit +20%).',
  '<b>Warehouses and strategic reserve:</b> bigger munitions depots, part of every stockpile made safe from bombing, sabotage and raids, and a higher daily import limit.',
  '<b>Refineries and processing:</b> turn oil into goods, or surplus food into population growth, every hour. They never touch the reserve your nation needs to run.',
  '<b>Trade routes:</b> open a standing route with an ally. You are both paid every hour while you stay allied; a blockade on either of you cuts it.',
  '<b>Civil defence:</b> up to 30% less damage from air strikes, missiles, heavy weapons, dirty bombs and nuclear strikes.',
  '<b>Counter-intelligence bureau:</b> enemy spy operations fail more often against you and are identified more often.',
  '<b>Reserves:</b> cheap part-time soldiers with low upkeep. When you are at war or have just been attacked, one call-up moves them all into your army at once.']},
 {when:'Nov 21',title:'More for phones',items:[
  '<b>Choose your bottom bar:</b> under More → Phone options you can now pick which four pages sit on the bar at the bottom of the screen, and in what order.',
  '<b>Swipe between pages:</b> swipe left or right on a page to go to the next or previous one. It does not trigger on the globe, in chat, in the casino or in boxes that scroll sideways, and you can switch it off under More.',
  '<b>One-thumb war room:</b> on a phone, picking an attack now shows a big Fire button pinned at the bottom of the screen. The description is folded away behind a Details button, so more of the attack list stays visible.']},
 {when:'Nov 21',title:'Smoother on phones',items:[
  '<b>More room on screen:</b> on a phone, the stats strip at the top now tucks away while you scroll down a page and comes straight back when you scroll up or change page.',
  '<b>Easier to tap:</b> the lock buttons on Operations and the quick-amount buttons on the market are bigger, and small buttons everywhere are a little taller.',
  '<b>No more accidental zooming or reloads:</b> tapping a button twice quickly no longer zooms the page, and pulling down at the top of a page no longer reloads the game.',
  '<b>War room on phones:</b> the attack list drops the Tier column so weapon names fit; the tier now shows as the colour of the name.',
  '<b>Credit ratings table:</b> on narrow phones it now scrolls sideways inside its box, so nothing is cut off.']},
 {when:'Nov 21',title:'Dome breakdowns and higher casino limits',items:[
  '<b>A Golden Dome left offline can break for good.</b> When an EMP knocks your dome out it still comes back by itself, but if it is still down after 3 hours, every further hour brings an 8% chance that it breaks down completely. A broken dome is gone and has to be rebuilt from scratch.',
  '<b>Emergency repair:</b> a knocked-out dome now has a repair button on your Military page that brings it back at once (from $160M, more for higher levels and bigger nations). You are notified the moment it is knocked out. Higher-level domes come back sooner on their own, so they are at risk for less time.',
  '<b>Casino limits raised:</b> the table limit on blackjack, roulette, slots and dice is now <b>$25B</b> (was $1B), and there is a new <b>$5B chip</b>. Poker has a new <b>Sovereign Table</b>: blinds $125M/$250M, buy-in $5B to $25B.',
  '<b>Chaos world countdown:</b> when a Chaos world is coming you will now see a countdown at the top of the game and reminders in chat, so you have time to get ready.',
  '<b>Chaos world ignores Council peace laws:</b> a World Council truce, nuclear ban or non-proliferation treaty no longer stops wars and nukes inside a Chaos world. They stay in force in the real world, which comes back with them still running when Chaos world ends.',
  '<b>Fairer Chaos worlds:</b> every nation now starts a Chaos world with at least 500,000 troops, 2,000 aircraft and 300 warships. Nations that already have more keep their army, so new and small nations are no longer left with nothing to fight with.',
  '<b>Duel opt-out any time:</b> the box on your Intelligence page that turns duel mini-games on or off can now be changed whenever you like (it used to be once a day).',
  '<b>Chat space bar fixed:</b> after playing Sharpshooter range, the space bar could stop working in chat and other boxes until you reloaded the page. It now works normally.',
  '<b>Two new voting sites:</b> MMORPG 100 and MPOG 100 join the vote buttons in the menu. Like the others, each pays a treasury bonus each time its button lights up (every 6 hours).']},
 {when:'Nov 21',title:'New slot machines, alliance defence and nuclear prices',items:[
  '<b>Three new slot machines</b> next to Lucky Sevens. <b>Liberty Bell</b> is old school: three reels with a wild bell that doubles your win. <b>Neon Empire</b> and <b>War Chest</b> are digital: five reels, ten lines and a bonus round. Neon Empire gives free spins that pay double; War Chest opens a chest worth 5× to 100× your stake. All four machines pay back about 94%, the same as before.',
  '<b>Smoother reels:</b> the slot reels could flicker or seem to skip while spinning, in full screen and out of it, whenever the page refreshed in the background. That is fixed.',
  '<b>An attack on one is an attack on all:</b> attack any member of an alliance and every other member gets a just cause against you for 24 hours, so they can hit back with no aggression. All of them are notified, you are told how many you provoked, and it goes in the world news.',
  '<b>Dirty bombs and nuclear weapons cost far more.</b> Dirty bomb: at least $500M (was $15M). Nuclear deterrent: at least $5B (was $500M). Launchable warhead: at least $25B (was $2B). Each also grows with your tax income (4, 10 and 20 collections), so they are expensive for the biggest nations too. Weapons you already own are not affected.']},
 {when:'Nov 21',title:'New war room',items:[
  '<b>Attack now opens a full war room</b> instead of a pop-up. Every attack is listed on the left, from a ground assault to the superweapons, and the live globe fills the right side, so you can fire and watch it land without closing anything.',
  '<b>Aim on the globe:</b> spin and zoom it as usual, and click one of their provinces to plan a ground assault there. Click a province of a different nation to switch target, or use the Target box at the top.',
  '<b>Find what you need fast:</b> filter the list by small attacks, large attacks or what is ready right now. Click any attack to see what it does, what it costs and why it is locked, then press Fire.',
  '<b>Battle feed:</b> results of your attacks appear under the globe.',
  '<b>Amber night view:</b> tick the box on the globe to tint it amber. It stays on until you untick it.',
  '<b>On a phone</b> the globe sits on top and the attack list below. Press Exit war room or Esc to leave.',
  'Nothing about the attacks themselves changed: same costs, same rules, same cooldowns.']},
 {when:'Nov 21',title:'Advanced spy operations are now tiered',items:[
  '<b>Three operations moved to their own "Advanced operations" section</b> and are tiered like the heavy weapons. Each needs research and rank, and its price grows with your own income, so it stays expensive for big nations.',
  '<b>Leak to their bankers</b> (Tier 2): tech 90, Senator, 5 agents, from $30M.',
  '<b>Wiretap their alliance</b> (Tier 3): tech 150, Prime Minister, 6 agents, from $60M. It now lasts <b>1 hour instead of 6</b> and gives only partial information: you catch about half of what they say, with some words missing. The alliance is warned half the time (it was 3 in 10).',
  '<b>False flag</b> (Tier 3): tech 180, Prime Minister, 8 agents, from $100M.']},
 {when:'Nov 21',title:'Eight duel games, ghost duels and duel ratings',items:[
  '<b>Four new games:</b> <b>Missile defense</b> (tap ahead of falling missiles to save six cities), <b>Pin the capital</b> (tap a world map where the city is), <b>Border checkpoint</b> (read the day\'s rules, then approve or deny each traveller) and <b>Market sprint</b> (buy low and sell high as the price moves for 45 seconds). They sit beside the vault, the code, memory and the sharpshooter range on your Intelligence page.',
  '<b>Ghost duels, so you can always play:</b> choose "Ghost duel" in the box above the games and you race another player\'s recorded run of the same puzzle, straight away, with nobody needing to be online. Beat their score to win. A ghost prize is half the size of a live duel prize. If no recorded run is waiting, the Academy instructor plays instead. You never meet the same recorded puzzle twice.',
  '<b>Difficulty for every game:</b> Easy, Medium or Hard. Harder puzzles pay more (Easy 60% of the prize, Hard 150%).',
  '<b>Rematch and friendly rounds:</b> the result screen has a Rematch button, and both players get it. A rematch is a friendly round: no entry fee, no prize, and no waiting. While a game\'s 2-hour prize timer is running you can still play it as a friendly round against players or ghosts.',
  '<b>Duel rating and titles:</b> everyone starts at 1,000 in each game. Wins raise your rating, more if you beat a stronger player; ghost duels count for half. The best-rated player of each game holds its title, such as Master safecracker or Sharpshooter, and it shows on their profile. Rankings has a new <b>Duels</b> tab with the title holders and the duelist table.',
  '<b>Challenge from anywhere:</b> tap a name in the online list or in chat to open their profile. If they are online there is a Duel button that lets you pick any of the eight games.',
  '<b>Fair play:</b> both players always get exactly the same puzzle, the server works out every score itself, two accounts on the same network cannot duel each other or race each other\'s ghosts, and the same two players can move each other\'s rating at most three times a day.']},
 {when:'Nov 21',title:'World Council: fairer votes',items:[
  '<b>Penalties need more support.</b> Sanctions now need two-thirds of the vote and at least 5 yes votes. The other penalties (embargo, arms embargo, asset freeze, condemnation and inspections) need at least 4 yes.',
  '<b>Penalties have a cost.</b> Whoever proposes one pays a deposit of 1% of their treasury, refunded if the vote passes, so the Council can\'t be used for cheap revenge.',
  '<b>Lift sanctions:</b> a sanctioned nation can petition once every 12 hours (was 6).',
  '<b>No penalties on AI nations</b>, and fighting AI nations still never counts against you.',
  '<b>Worldwide bonuses take turns:</b> each one can pass at most once every 3 days (the free market week once every 5 days), so they stay special.']},
 {when:'Nov 21',title:'The world market now has limited stock',items:[
  '<b>Resources are no longer unlimited.</b> The world market holds a real stock of food, oil, steel, goods and munitions. Exports add to it and imports take from it. A price rises as its stock runs low, and a sold-out commodity can\'t be bought until it is restocked.',
  '<b>Where the stock comes from:</b> nations that export, and foreign suppliers who deliver part of what the world is short of every 10 minutes. The market is filled up again at the start of every season.',
  '<b>Daily import limit:</b> each nation can import a set amount of each commodity every 24 hours. It grows with your provinces and with how much more you use than you make, so nobody can empty the market in one order. When the market is well stocked the limit is generous; it tightens as the stock runs low.',
  '<b>Emergency food:</b> if your food would run out in under 12 hours, you can import a day of food at three times the price. It doesn\'t use the market stock or your limit, so a shortage can hurt but never starve you.',
  '<b>See it on the Economy page:</b> two new columns show how much is on the market and how much you can still import today. Auto-buy orders follow the same rules. Trade offers with other players and the Black Market are not limited, so a nation with surplus can sell it to you directly.',
  '<b>Why:</b> players asked for resources that matter. Producing your own food and oil, or trading for it, now counts for something at every size.']},
 {when:'Nov 21',title:'Season 1 is over',items:[
  '<b>Congratulations to Zeiro Kingdom</b>, the Season 1 champion, with New America second and County of Sin third. The final standings are in the Hall of Fame on the Rankings page.',
  '<b>Everyone is back in their real nation</b>, exactly as they left it.',
  '<b>Clearer names:</b> the online list at the bottom of the screen now shows nation names, like the rest of the game. Hover over or tap a name to see who leads it.']},
 {when:'Nov 21',title:'A bigger world, and building up pays',items:[
  '<b>The map has grown:</b> the big provinces were split into smaller ones, with much more detail in Europe. The world went from 961 to 1,711 provinces, so there is room for many more nations.',
  '<b>You kept all your land.</b> If a province you held was split, you kept every piece. The extra pieces don\'t count against your province limit and don\'t change your score, so nothing is taken from you and nothing is added. Each piece still produces resources and can be developed.',
  '<b>New Rankings page:</b> a podium for the top three, a card showing your place and how far you are from the nation ahead, and 18 leaderboards to choose from (economy, military, land, technology, aid given and more). Below it, six comparison graphs: pick up to six nations and see the race over time, who passed whom, strengths side by side, a head to head, the whole field, and your share of the world. Records, the season, the Hall of Fame and world statistics are on their own tabs.',
  '<b>Built-up nation bonus:</b> the higher your provinces\' average development level, the more your whole nation earns: up to +32% GDP and +24% production, and development counts up to double for score. It reaches full strength at 12 provinces. See it under Economy → Province development.',
  'Province centres that sat in the sea (some island and coastal provinces) are now on land.',
  'The daily aid mission now shows the amount needed on the mission itself.']},
 {when:'Nov 21',title:'Developed provinces are more loyal',items:[
  '<b>Build up your far provinces:</b> each development level (farms, industry, city, metropolis) makes a province 15% less likely to break away, up to 60% at Metropolis. This applies to far-flung land, provinces stirred up by foreign separatists, and unrest when stability is low.',
  '<b>Still fair:</b> no province ever becomes rebellion-proof, the same rule applies to every nation, newly conquered land still needs a garrison, and an empire over its administration limit still loses land as before. When a far province does break away, the least developed one goes first.']},
 {when:'Nov 21',title:'Spy duels are now for prizes',items:[
  '<b>Same duels, new stakes.</b> Crack the vault, Break the code, War room memory and Sharpshooter range are still 1v1: pick a player in the Spy mini-games box and challenge them. The box lists only players who were online in the last 2 minutes, by nation and leader name. If they accept, you both play the same puzzle and the better score wins a cash prize and experience.',
  '<b>Nobody loses anything.</b> The duels no longer take money from a treasury, weaken defenses or kill a general. The challenger pays a small entry fee; the player who is challenged pays nothing.',
  '<b>Every 2 hours:</b> each duel can be started once every 2 hours. Practice stays free and unlimited.']},
 {when:'Nov 20',title:'Spy mini-games rebuilt',items:[
  '<b>Their own section:</b> the four spy mini-games (vault, code-breaking, war plans and sniper) now sit apart from the ordinary covert operations on the Intelligence page.',
  '<b>Practice for free:</b> every mini-game has a Practice button. It costs nothing, starts no cooldown and changes nothing in the world, and shows the score and odds you would have had.',
  '<b>New look and feel:</b> a clear step-by-step briefing, a sniper scope that magnifies, a vault dial that glows as you get close, a QWERTY keypad and progress bar for code-breaking, labelled memory cards, a timer that warns you in the last 10 seconds, and a result card with your score, stars and odds.',
  'The globe now looks exactly the same while you drag it as when it is still.']},
 {when:'Nov 20',title:'Chaos world',items:[
  '<b>Chaos world:</b> now and then the game switches into a temporary all-out-war world: every weapon unlocked, huge war chests, up to 2 nukes for every nation and timers up to 30× faster. When it ends, the real world comes back exactly as it was. See the FAQ for details.',
  '<b>Start your own Chaos world:</b> buy one on the Donate page and press Start whenever you like: 15 or 30 minutes, with your choice of speed and nukes.']},
 {when:'Nov 20',title:'Blackjack splits and fair spy duels',items:[
  '<b>Blackjack:</b> you can now split a pair (two cards of the same value) into two hands, with a second bet of the same size. You play each hand in turn, split aces get one card each, and 21 on a split hand pays like a normal win.',
  '<b>Spy duels:</b> when you start a heist, code-breaking or assassination against a player who is online, you now wait for them to accept. If they accept, you both play the same puzzle at the same time. If they decline or don\'t answer within 30 seconds, it\'s called off and costs you nothing. Against players who are offline, you play straight away as before.',
  '<b>Tell us which spy missions you like:</b> every mission on the Intelligence page now has a 👍 Yes / 👎 No. Tap again to take your vote back. It helps decide which missions to improve.',
  '<b>New spy mission, Steal their war plans</b> (4 agents, $1.5M): a memory game. The cards show face up for a few seconds, then flip over, and you match the pairs. Pick Easy (8 cards), Medium (12) or Hard (16); harder boards score higher. Success makes the target\'s defenses 12% weaker against everyone for 12 hours and shows you their forces. Online targets can accept a duel on the same board. Idea from Camaar.',
  'Fixed: when a quick human check was due while you picked a decision, it didn\'t pop up until your next operation, and the decision didn\'t go through. Now the check appears straight away and your decision goes through as soon as you answer it. Thanks Zeiro for the report.',
  'Fixed: the market could let a very busy trader make a tiny profit by buying and selling straight back. It always costs something now.']},
 {when:'Nov 19',title:'Phones rumble, fairer checks',items:[
  'On Android phones, big weapons now make your phone vibrate as the screen shakes, strongest when it\'s your nation being hit, and a nuclear blast gives a long rumble. Turn it off with <b>Vibrate on big hits</b> next to Sound effects. (iPhones don\'t let websites vibrate.)',
  'Fixed: on iPhone, passing the quick check with a finger tap could be marked as unusual. It is recorded correctly now.',
  'The daily “send aid” mission now needs real aid (a tenth of the mission\'s reward, at least $1M).',
  'Repaying debt: typing more than you owe now simply repays all of it.']},
 {when:'Nov 19',title:'Weapon tiers: the big weapons are now rare',items:[
  'Heavy weapons now come in four tiers, and each one takes far more research: <b>Tactical</b> (tech 10–40), <b>Strategic</b> (70–120), <b>Advanced</b> (150–200) and <b>Superweapons</b> (250–320). The war planner groups them by tier and shows what each one unlocks at.',
  'The <b>Golden Dome</b> now needs tech 300 (upgrades at 320–400), a <b>nuclear deterrent</b> tech 350 and a <b>launchable warhead</b> tech 400. Missile strikes need tech 25 and dirty bombs tech 120.',
  'Nations that already own a dome, a deterrent or an armed warhead keep them. New warheads and dome upgrades need the new tech levels.',
  '<b>Research slows down above tech 200:</b> each level costs 3% more than the last on top of the normal rise (about ×19 at tech 300 and ×84 at 350), so the top tiers take real, sustained work.',
  '<b>Nukes and domes get pricier as they spread:</b> the price rises ×1.5 for every nation that already owns one. The Military page shows the current price.']},
 {when:'Nov 19',title:'❓ Helpdesk',items:[
  'Have a question or a problem? Click <b>❓ Helpdesk</b> in the Leaders online list or the chat sidebar, or choose Helpdesk when writing mail.',
  'The staff answer in your Mail inbox and you get a notification. Reply to keep the conversation going.',
  'Questions are private, and you can write to the Helpdesk even while muted or under investigation.']},
 {when:'Nov 19',title:'Very high taxes now backfire',items:[
  'Above 25%, every extra point of tax cuts your GDP 1.5% (−37.5% at 50%), so maxing taxes now brings in less money than a normal rate.',
  'If your approval falls under 25 while your rate is above 25%, stability drops no matter how strong your fortifications are, and low stability brings rebellions.',
  'Nothing changes at 25% or below. Around 20% is still the sweet spot, and the tax slider now warns you before you go too high.']},
 {when:'Nov 19',title:'Dev corner: see what happens to suggestions',items:[
  'Suggestions in the <a href="/dev">Dev corner</a> forum now show the team\'s decision: <b>✅ Accepted</b>, <b>🛠 Done</b> or <b>❌ Rejected</b>, usually with a short reason.',
  'You get a notification when your own suggestion is decided, and the decision is posted in the topic.',
  'The new <b>📜 Decisions</b> tab lists every decided suggestion, newest first, so you can see what everyone\'s ideas led to.']},
 {when:'Nov 19',title:'Nukes: the launcher pays',items:[
  'A nuclear strike no longer stops the target\'s tax collection. Instead <b>the nation that launches loses its own tax collection</b> for 36 hours during a season (72 hours otherwise), on top of rogue status. Nukes are meant to be a true last resort, not an economic weapon.',
  'Firing back at a nation that nuked you (automatically or within 72 hours) is self-defense and does not stop your taxes.',
  'Strikes launched before this change keep their old effects.']},
 {when:'Nov 19',title:'Run all fix, nuclear fire-back choice, smoother globe',items:[
  'Fixed: when the quick check popped up during <b>Run all</b>, the check was hidden and every remaining operation greyed out. Now the check shows, and once you answer it Run all finishes the rest by itself.',
  'New: <b>Fire back automatically if I\'m nuked</b>, a switch under your armed warhead (Military → Nuclear). It\'s on by default. Untick it to keep your warhead and decide yourself. Only you can see this setting. Your last missile still fires if your capital falls.',
  'New: <b>Slowly spin the globe</b>, a checkbox under the globe on the World page. The globe turns gently on its own. Click or tap it to stop it; it also pauses while a province is open. Your choice is remembered on each device.',
  'Dragging the globe is smoother on computers: provinces off the screen are no longer drawn, and the picture is sharp again the moment you stop.']},
 {when:'Nov 19',title:'Fairer rankings from Saturday',items:[
  'When Season 1 ends on Saturday, rankings switch to a fairer score. Season 1 itself is finished and paid out under the current rules.',
  'Your rank uses your <b>average score over the last 12 hours</b>, so steady play counts and nobody can jump to the top in one lucky hour.',
  'GDP, army and fleets still count, but each extra billion or 100K troops counts a little less, so balanced nations do best.',
  'Things that take effort count more: land you hold and develop, wins against real players, aid and relief you give, and alliances and bloc-mates you keep for a day or more.',
  'Aid, trade offers and relief between accounts on the same home network are blocked in every world, not just during seasons.']},
 {when:'Nov 19',title:'Fixes',items:[
  'Fixed: rogue status from a nuclear strike could end early if the nation was already a rogue state before the strike. It now always lasts the full time after the strike, then ends once aggression falls below 50.',
  'Buying your way out of rogue status now shows your aggression before and after, and withdraws your own open petition to the Council.',
  'Dragging the globe is smoother on computers when many provinces are burning.']},
 {when:'Nov 19',title:'Stronger anti-cheat',items:[
  'The quick check that pops up now and then is harder for scripts: sometimes you tap a shape, sometimes you <b>type a short code</b> from the picture (not case-sensitive). It can now appear before any action, not just economy buttons, but no more often than before for normal players.',
  'Accounts that show clear signs of a script or auto-clicker are now locked automatically for an admin to review. Nothing is taken from your nation while it\'s reviewed.']},
 {when:'Nov 19',title:'Smoother on every phone, iPad and computer',items:[
  '<b>Opt out of spy duels:</b> a new box on your Intelligence page. If you untick it, nobody can use the vault, cipher or sniper missions on you, you can\'t use them yourself, and you get no duel alarms. Ordinary spy jobs work as before. You can change it once a day.',
  'Tapping a province on the globe is more accurate, especially on small phones and iPads. A two-finger pinch no longer selects a province by accident, and the province you pick turns into view instead of hiding under its info card.',
  'The province info card is smaller on phones, and the top bar no longer overlaps on iPads.',
  'Strike animations now adjust to your device: slower phones get smooth playback instead of stutter, and everything returns to full sharpness when the strikes end.',
  'If your connection drops, a bar now says so right away, and the game catches up by itself when you\'re back. No reload needed after locking your phone, switching apps, losing signal or a game update.']},
 {when:'Nov 18',title:'Spy jobs you play yourself',items:[
  '<b>💰 Crack the treasury vault</b> (new): turn the dial, listen for the clicks and lock in the combination before the guards arrive. Get away with up to 3% of their treasury.',
  '<b>📡 Intercept and decode</b> (new): break a real coded message from their government, letter by letter: their army, treasury, wars and next target.',
  '<b>🎯 Assassinate a general</b> is now a sniper mission: steady the swaying scope, hold your breath and take the shot. Three bullets.',
  'Your score sets the odds (from about 15% to 90%), and a good score also makes it less likely your agents are identified.',
  '<b>⚔️ Spy duels:</b> if your target is online, they are warned and can defend by playing the same puzzle at the same time. The better score wins, and a defender who wins finds out who sent the agents.']},
 {when:'Nov 18',title:'Big phone fix: no more lag after strikes',items:[
  'Fixed a bug where smoke and radiation clouds on the globe kept starting extra copies of their own animation. After a few strikes this could keep a phone busy for the rest of the day, so updates, timers and countdowns lagged by several seconds. Now the game stays responsive and other players\' moves show up within about a second.',
  'Smoke billows smoothly for the first few minutes after a strike, then drifts gently, which is much easier on your battery.',
  'Live updates use about 85% less data during busy wars: unchanged parts of other nations are no longer resent every time they change.']},
 {when:'Nov 18',title:'Attacks hit the province you picked',items:[
  'Fixed: if a tap landed just off a province (beside a small island, on a coastline or in a gap), the previously tapped province stayed selected, so an attack planned from it could hit a different province than the one you meant. Taps just off the land now snap to the nearest province, and a tap on open sea clears the selection.']},
 {when:'Nov 18',title:'Smoother on phones',items:[
  'The globe no longer redraws itself every time any nation in the world changes a number. It only redraws when something you can actually see on the map changes: a border, a colour, a name, a flag, a dome or fallout. On a busy world this roughly doubles the frame rate on phones and removes nearly all of the stutters.',
  'Game updates now come back online within about half a second after a new version is released, instead of around five seconds.']},
 {when:'Nov 18',title:'No buying your way out of a nuke',items:[
  'Launching a nuclear strike makes you a rogue state, and that status can no longer be <b>paid off</b> or <b>voted away</b> by the World Council at all. It ends only on its own: after the minimum time, once your aggression falls below 50.',
  'Rogue status from ordinary aggression can still be ended by a petition or a payoff, as before.']},
 {when:'Nov 17',title:'Prestige units go to war',items:[
  'Owning a <b>Nuclear Submarine</b>, <b>Stealth Bomber Wing</b> or <b>Supercarrier</b> now unlocks its own strike in the war planner: a surfaced submarine firing a missile salvo, a stealth bomber that slips past every defence and shakes the world, and a carrier group that sails over, launches its jets and sails home.',
  'Each extra unit you own makes its strike stronger.',
  'Carpet bombing now sends big heavy bombers with huge swept wings.']},
 {when:'Nov 17',title:'Cheaper development, a rarer EMP and one truce a week',items:[
  '<b>Developing provinces is cheaper for big economies.</b> The price now rises with the square root of your GDP: a nation 35 times richer pays about 6 times more, not 35. Growing your economy now really pays off.',
  '<b>The EMP is a rare weapon now:</b> it needs the rank of Sovereign and tech 110, costs $1B plus 500 munitions, and can be used once every 36 hours. Stronger Golden Domes resist it: a level 5 dome goes down only 60% of the time, and for just 4 hours.',
  'The World Council votes on a <b>world truce</b> only once a week.',
  '<b>Comeback support has been retired.</b>']},
 {when:'Nov 17',title:'Fewer spam votes, restless empires and a fair-play check',items:[
  'If a penalty vote against a nation <b>fails</b>, no new penalty vote can target that nation for 2 days.',
  'A <b>nuclear weapons ban</b> can be voted on once every 3 days and a <b>non-proliferation treaty</b> once every 4 days, so nobody can re-pass them every time they run out.',
  '<b>War and aggression stir up your provinces:</b> each war (up to three) makes breakaways 25% more likely, and high aggression up to twice as likely. Far-flung provinces of a warmonger go first.',
  'The quick check shows up a bit more often, and repeated wrong answers lock an account for an admin to review.',
  'In alliance chat, the bottom list now shows your alliance’s members instead of disappearing.']},
 {when:'Nov 17',title:'The Dev corner and quieter spies',items:[
  '<b>New: the Dev corner.</b> Open “Dev” next to Updates for a forum and a chat room where we talk about ideas and changes to the game.',
  '<b>Spies are caught less often:</b> a failed operation is traced back to you 1 time in 5 (was 1 in 3).',
  'Only a caught <b>assassination</b> or <b>armed rebellion</b> gives the target a just cause to attack. Small operations like unrest, fake news or sabotage never do.']},
 {when:'Nov 17',title:'Three new spy missions and clearer provinces',items:[
  '<b>📡 Wiretap their alliance:</b> hear everything another alliance says in chat for the next 6 hours (they may get a warning that they’re bugged).',
  '<b>🏦 Leak to their bankers:</b> knock a nation’s credit rating down a step for a day.',
  '<b>🎭 False flag:</b> frame another nation for your next operation. One time in three it backfires in front of the whole world.',
  '<b>Top-tier weapons cost more:</b> a nuclear program is now $500M, a warhead $2B, a Golden Dome $2B, a hypersonic missile $250M and an orbital strike $750M.',
  '<b>A cleaner map:</b> borders between nations are now bold white lines, province lines are thin and even, and your own nation has the boldest outline.']},
 {when:'Nov 17',title:'Big empires can be beaten',items:[
  '<b>Air support has a limit.</b> A nation’s aircraft can at most double its army’s defence. Planes alone can’t hold a country any more, so keep a real army.',
  '<b>Big empires are spread thin.</b> Past 10 provinces, each province defends a little less: about 72% at 30 provinces, 58% at 60 and 50% at 100. Capitals always keep full strength.',
  '<b>Nuclear capitals can now fall, but it’s hard.</b> A nuclear power’s capital defends twice as hard and its last stand lasts 48 hours. If it falls anyway, the <b>dead hand</b> fires its last nuclear missile at the conqueror’s capital (a Golden Dome may stop it).',
  'The war planner now shows the defender’s tech, forts and how spread out they are, so you can see why a battle is hard.']},
 {when:'Nov 16',title:'Quick checks and a fairer Council',items:[
  '<b>Quick check:</b> once in a while, an operation asks you to tap one shape in a small picture. It keeps scripts and auto-clickers out. Most players see it only every couple of hours of active play.',
  'A nation can face only <b>one penalty vote a day</b> in the World Council, arms embargoes and nuclear inspections included.',
  'Ending an alliance or breaking a trade route now asks <b>“Are you sure?”</b> first.',
  '<b>Drone swarms</b> are escorted by your own air force, and at least 40% of a swarm always gets through.']},
 {when:'Nov 16',title:'Fairer conquest and smarter strikes',items:[
  '<b>Holding new land:</b> conquered provinces are restless for 24 hours (was 48). You need 800 troops per new province plus 200 per other province, and even under-garrisoned you keep about a third. A rebelling province only returns to its old owner if they still border it. The war planner shows exactly how many troops you need.',
  '<b>Artillery works against heavy forts:</b> forts soften a barrage but never stop it.',
  '<b>EMP strikes</b> knock out a Golden Dome for 12 hours, and now everyone can see it: the dome turns flickering electric blue with a “DOME DOWN” tag.',
  'The Intelligence target starts blank, so you can’t spy on the wrong nation by accident.',
  'Nation names and flags now sit on each nation’s biggest stretch of land instead of floating in the ocean.']},
 {when:'Nov 16',title:'Peace treaties, stacking fallout and clearer numbers',items:[
  'After peace is signed, neither side can declare war on the other for <b>24 hours</b>.',
  'Several dirty bombs on one nation now leave several radioactive clouds, and each one counts.',
  'Country borders are drawn in gold so nations stand out on the globe.',
  'Big numbers now have commas, and the amount box shows the number as you type it.',
  'New voting site: <b>Top Web Games</b>. Opened mail now scrolls into view on phones, and your flag sits in the top bar.']},
 {when:'Nov 15',title:'Bigger supporter perks and forever names',items:[
  '<b>🌟 Patrons</b> now get 5 Rush orders and 2 Rapid redeployments a day; <b>👑 Benefactors</b> get 10 Rush orders and 4 Rapid redeployments a day.',
  '<b>New: reserve your nation name forever.</b> A one-time $10 payment on the Donate page locks your name to your account in every season. Nobody else can ever use it. This is now the only way to reserve a name.']},
 {when:'Nov 15',title:'No more stuck wars',items:[
  'At war with someone who stopped playing? <b>Offer them peace.</b> If they haven’t played for over a day and don’t answer within 2 hours, peace is signed for them automatically.',
  'Active players still decide for themselves.']},
 {when:'Nov 15',title:'Debt relief rules, bigger vote rewards and a tidier menu',items:[
  'Only nations with debt under 15% of GDP can propose <b>debt relief</b> in the World Council, and it only forgives debt held when the vote started. Borrowing during the vote doesn’t get wiped.',
  'Each voting site now pays at least <b>$2M per vote</b> (2% of GDP for bigger nations, up to $25M).',
  'Military and Intelligence now sit right under World on the left menu.']},
 {when:'Nov 15',title:'Debt now has real consequences',items:[
  'Your <b>credit rating</b> sets your interest rate and how much lenders will give you. A bad rating slows GDP and lowers approval and stability; AAA nations get a +2% GDP bonus.',
  'Lenders stop lending as debt grows, and CCC nations can’t borrow at all.',
  '<b>Defaulting</b> forgives only 40% of debt, crashes your economy and locks you out of lending for 72 hours. See the credit rating table on the Economy page.']},
 {when:'Nov 15',title:'Supporter rewards, AI labels and fair play',items:[
  'The <b>Donate</b> button now opens a page with supporter perks: a badge, a gold monument on your capital, Rush orders and more. Sign in first and your donation links to your nation by itself.',
  'Computer-run nations now show <b>🤖 AI Nation</b> on the globe, in profiles and in chat.',
  'Cheat detection now catches <b>auto-clickers and scripts</b>. Play it yourself!']},
 {when:'Nov 15',title:'The fall screen and last words',items:[
  'If your capital is captured, you now see a fall screen showing who conquered you, how long you lasted and your rank, before founding a new nation.',
  'When you capture a player’s capital, you can leave them <b>one last message</b> (up to 200 characters) that appears on their fall screen. Only they can see it.',
  'In the <b>alliance chat</b>, the list on the right now shows only your alliance members.']},
 {when:'Nov 15',title:'Operation padlocks and fairer taxes',items:[
  'Every operation has a <b>padlock</b>: lock it and Run all skips it. You can still run it yourself with Execute.',
  'A tax <b>increase</b> now takes 30 minutes to reach your collections, so raising taxes just to collect and lowering them again no longer pays. Lowering taxes works right away.']},
 {when:'Earlier',title:'Smaller alliances and a fairer World Council',items:[
  'Alliances are now limited to <b>4 members</b>.',
  'The Council can only vote penalties onto nations that actually attacked another player, used nuclear weapons or were caught spying, and each nation can face at most one player-proposed penalty vote a day.']},
 {when:'Earlier',title:'Chat pictures and quieter spies',items:[
  'Post <b>pictures and GIFs</b> in chat by pasting a link (Giphy, Tenor, Imgur and more). Tap the 🖼 button to hide them.',
  'Unread message counts are back, and they clear as soon as you open the chat.',
  'Spy operations are more anonymous: a foiled plot no longer reveals who sent the agents.']},
 {when:'Earlier',title:'A bigger globe and a cleaner chat',items:[
  'The <b>World</b> page now fills the screen with the globe, with your land and province list below it.',
  'On phones, <b>Log out</b> moved into the More menu.',
  'World Chat now only shows wars and attacks between <b>real players</b>; AI battles stay in the news at the top of the screen.']}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('list').innerHTML=UPDATES.slice(0,10).map((u,i)=>`<section class="up"><div class="when">${esc(u.when)}</div><h2>${esc(u.title)}${i===0?'<span class="new">NEW</span>':''}</h2><ul>${u.items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`).join('');
</script></body></html>
